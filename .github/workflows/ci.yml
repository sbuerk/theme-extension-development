name: "CI"

# Everything that runs for a pull request: quality gates, linting, unit tests,
# functional tests against every supported DBMS, acceptance tests against a
# freshly built development instance, and the rendered documentation.
#
# One workflow rather than one per core version. The core version is a matrix
# dimension, which keeps a single place to add v15 later.
#
# No job waits for another. Every job starts with the run:
#
#   quality, phpstan, lint, unit, assets, documentation   the gates, ~1 minute
#   visual        the styleguide partials: screenshots and axe
#   acceptance    a built instance, in Chromium and Firefox
#   functional    MySQL, MariaDB, PostgreSQL - 16 jobs
#   functional    SQLite
#
# The jobs used to be staged, cheapest first: the gates, then unit, then SQLite,
# then the 16 database jobs. A defect a gate finds was then reported without
# starting the expensive jobs - but every run that went on to pass waited for
# each stage in turn, and a pull request run is almost always one that passes.
# In the run of pull request #91 the first database job started 24 minutes after
# the run did, of a run of 101 minutes. Starting everything at once costs runner
# time when a gate fails, which this public repository does not pay for, and it
# delays no report: the gates still finish within about a minute.
#
# There is no aggregating "all checks" job. Nothing requires a named check on
# "main" - no branch protection, no ruleset - and every job reports on the pull
# request by itself. Add one when a required check is introduced, and require
# that one job rather than the matrix job names, which change with the matrix.
#
# The order of the jobs below is deliberate. The account runs at most 20 jobs at
# a time (GitHub Free) and this workflow has 40, so half of them start queued.
# The cheap and quick jobs come first, then the long ones, longest first: the 16
# database jobs before the SQLite jobs, which are shorter and absorb a late
# start. GitHub does not document in which order the queued jobs of a run get a
# runner; this order is what helps if it follows the file, and costs nothing if
# it does not.
#
# Supported versions are declared in the matrices below. There are three PHP
# sets, and they have to be changed together:
#
#   all edges  PHP versions      Used by
#   ---------  ----------------  -------------------------------------------
#   all        8.2 8.3 8.4 8.5   lint
#   edges      8.2 8.5           unit, functional
#   lowest     8.2               quality, phpstan
#
# Only the lowest PHP version is used for the gates that do not depend on it,
# because running them once per PHP version tests the same files again.
#
# Every step goes through "Build/Scripts/runTests.sh", so a gate behaves
# identically here and on a developer machine — see
# "docs/development/quality-gates.md".
#
# Every step also passes "-b docker". The script prefers podman whenever it is
# present and only falls back to docker, which is the right default for it — but
# GitHub hosted runners ship both, and their podman/crun combination has been
# observed to abort the first container start of a job with
# "OCI runtime error: crun: unknown version specified" (exit 126). It is
# intermittent, hits any job, and is caused by neither the runner image nor the
# testing image changing. Selecting docker here avoids crun entirely and leaves
# the script default and every local run untouched. Drop the flag once GitHub
# stops producing the mismatch.
#
# The composer download cache is restored per PHP and core version. It lives in
# ".cache/" at the repository root and **must not** be moved under ".Build/":
# "composerUpdate" starts with "rm -rf .Build", so a cache stored there would be
# deleted before composer ever reads it — still saved at the end of every job,
# but never used, which makes the whole cache step a silent no-op.

on:
  pull_request:
  workflow_dispatch:

# Least privilege. Nothing in this workflow writes, and it must stay that way:
# a pull request from a fork gets a read-only token anyway, so a write step here
# would work for branches and silently fail for external contributors.
# Commenting on the pull request happens in "pr-comment.yml" instead.
permissions:
  contents: read

# Superseded runs of the same pull request are pointless, and this workflow is
# not cheap. Pushing twice in a minute cancels the first run.
concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

jobs:

  quality:
    name: "quality (v${{ matrix.typo3 }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # These gates inspect source files, not the installed core, so one
        # dependency set is enough. The lowest supported one is used.
        php-version: [ "8.2" ]
        typo3: [ "13" ]
    steps:

      - name: "Checkout"
        uses: actions/checkout@v6

      - name: "Cache composer downloads"
        uses: actions/cache@v6
        with:
          path: ".cache/composer"
          key: "composer-${{ matrix.php-version }}-v${{ matrix.typo3 }}-${{ hashFiles('composer.json') }}"
          restore-keys: |
            composer-${{ matrix.php-version }}-v${{ matrix.typo3 }}-
            composer-${{ matrix.php-version }}-

      - name: "Prepare dependencies for TYPO3 v${{ matrix.typo3 }}"
        run: "Build/Scripts/runTests.sh -b docker -t ${{ matrix.typo3 }} -p ${{ matrix.php-version }} -s composerUpdate"

      - name: "Validate composer.json"
        run: "Build/Scripts/runTests.sh -b docker -t ${{ matrix.typo3 }} -p ${{ matrix.php-version }} -s composerValidate"

      - name: "CGL"
        run: "Build/Scripts/runTests.sh -b docker -t ${{ matrix.typo3 }} -p ${{ matrix.php-version }} -s cgl -n"

      - name: "Ensure UTF-8 files do not contain BOM"
        run: "Build/Scripts/runTests.sh -b docker -t ${{ matrix.typo3 }} -p ${{ matrix.php-version }} -s checkBom"

      - name: "Find duplicate exception codes"
        run: "Build/Scripts/runTests.sh -b docker -t ${{ matrix.typo3 }} -p ${{ matrix.php-version }} -s checkExceptionCodes"

      - name: "Ensure markdown tables are formatted"
        run: "Build/Scripts/runTests.sh -b docker -t ${{ matrix.typo3 }} -p ${{ matrix.php-version }} -s checkMarkdownTables"

      - name: "Ensure test methods do not start with \"test\""
        run: "Build/Scripts/runTests.sh -b docker -t ${{ matrix.typo3 }} -p ${{ matrix.php-version }} -s checkTestMethodsPrefix"

  phpstan:
    name: "phpstan (v${{ matrix.typo3 }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The only gate configured per core version: each configuration analyses
        # its own "Core13/" or "Core14/" sources against the core installed for
        # it. Running it for one version would miss half the code.
        php-version: [ "8.2" ]
        typo3: [ "13", "14" ]
    steps:

      - name: "Checkout"
        uses: actions/checkout@v6

      - name: "Cache composer downloads"
        uses: actions/cache@v6
        with:
          path: ".cache/composer"
          key: "composer-${{ matrix.php-version }}-v${{ matrix.typo3 }}-${{ hashFiles('composer.json') }}"
          restore-keys: |
            composer-${{ matrix.php-version }}-v${{ matrix.typo3 }}-
            composer-${{ matrix.php-version }}-

      - name: "Prepare dependencies for TYPO3 v${{ matrix.typo3 }}"
        run: "Build/Scripts/runTests.sh -b docker -t ${{ matrix.typo3 }} -p ${{ matrix.php-version }} -s composerUpdate"

      - name: "Static code analyzer"
        run: "Build/Scripts/runTests.sh -b docker -t ${{ matrix.typo3 }} -p ${{ matrix.php-version }} -s phpstan"

  lint:
    name: "lint (v${{ matrix.typo3 }}, PHP ${{ matrix.php-version }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: [ "8.2", "8.3", "8.4", "8.5" ]
        typo3: [ "13", "14" ]
    steps:

      - name: "Checkout"
        uses: actions/checkout@v6

      - name: "Cache composer downloads"
        uses: actions/cache@v6
        with:
          path: ".cache/composer"
          key: "composer-${{ matrix.php-version }}-v${{ matrix.typo3 }}-${{ hashFiles('composer.json') }}"
          restore-keys: |
            composer-${{ matrix.php-version }}-v${{ matrix.typo3 }}-
            composer-${{ matrix.php-version }}-

      - name: "Prepare dependencies for TYPO3 v${{ matrix.typo3 }}"
        run: "Build/Scripts/runTests.sh -b docker -t ${{ matrix.typo3 }} -p ${{ matrix.php-version }} -s composerUpdate"

      - name: "Run PHP lint"
        run: "Build/Scripts/runTests.sh -b docker -t ${{ matrix.typo3 }} -p ${{ matrix.php-version }} -s lintPhp"

  unit:
    name: "unit (v${{ matrix.typo3 }}, PHP ${{ matrix.php-version }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: [ "8.2", "8.5" ]
        typo3: [ "13", "14" ]
    steps:

      - name: "Checkout"
        uses: actions/checkout@v6

      - name: "Cache composer downloads"
        uses: actions/cache@v6
        with:
          path: ".cache/composer"
          key: "composer-${{ matrix.php-version }}-v${{ matrix.typo3 }}-${{ hashFiles('composer.json') }}"
          restore-keys: |
            composer-${{ matrix.php-version }}-v${{ matrix.typo3 }}-
            composer-${{ matrix.php-version }}-

      - name: "Prepare dependencies for TYPO3 v${{ matrix.typo3 }}"
        run: "Build/Scripts/runTests.sh -b docker -t ${{ matrix.typo3 }} -p ${{ matrix.php-version }} -s composerUpdate"

      - name: "Execute unit tests"
        run: "Build/Scripts/runTests.sh -b docker -t ${{ matrix.typo3 }} -p ${{ matrix.php-version }} -s unit"

      - name: "Execute unit tests in random order"
        run: "Build/Scripts/runTests.sh -b docker -t ${{ matrix.typo3 }} -p ${{ matrix.php-version }} -s unitRandom"

  # The committed build output: the stylesheet compiled from its SCSS and the
  # vendored Font Awesome icons, each compared with what the build writes. It
  # was called "css" while it checked the stylesheet alone. Independent of PHP
  # and of the core version, so a single job rather than a matrix dimension; it
  # also needs no "composerUpdate", which is what makes it the cheapest job in
  # the workflow. Both gates share the node image and the "npm ci" of one
  # lockfile.
  assets:
    name: "assets"
    runs-on: ubuntu-latest
    steps:

      - name: "Checkout"
        uses: actions/checkout@v6

      - name: "Cache npm downloads"
        uses: actions/cache@v6
        with:
          path: ".cache/npm"
          key: "npm-assets-${{ hashFiles('package-lock.json') }}"
          restore-keys: "npm-assets-"

      - name: "Ensure the committed CSS matches its SCSS sources"
        run: "Build/Scripts/runTests.sh -b docker -s checkCssBuild"

      - name: "Ensure the committed icons equal the pinned Font Awesome Free"
        run: "Build/Scripts/runTests.sh -b docker -s checkIconsBuild"

  documentation:
    name: "documentation"
    runs-on: ubuntu-latest
    steps:

      - name: "Checkout"
        uses: actions/checkout@v6

      # Recorded and uploaded *before* the rendering, so the comment workflow can
      # report on the right pull request even when the rendering fails.
      # "github.event.workflow_run.pull_requests" is empty for a fork, which is
      # why the number travels in an artifact rather than being read from the
      # event.
      - name: "Record the pull request number"
        if: "github.event_name == 'pull_request'"
        run: |
          mkdir -p .Build/pull-request-context
          echo "${{ github.event.pull_request.number }}" > .Build/pull-request-context/number

      - name: "Upload the pull request context"
        if: "github.event_name == 'pull_request'"
        uses: actions/upload-artifact@v6
        with:
          name: "pull-request-context"
          path: ".Build/pull-request-context/"
          if-no-files-found: "error"
          retention-days: 5

      - name: "Render documentation"
        run: "Build/Scripts/runTests.sh -b docker -s renderDocumentation"

      - name: "Upload rendered documentation"
        uses: actions/upload-artifact@v6
        with:
          name: "documentation"
          path: "Documentation-GENERATED-temp/"
          compression-level: 9
          if-no-files-found: "error"
          retention-days: 5
          include-hidden-files: true
          overwrite: true

  # Screenshots and axe of the styleguide partials, rendered into static pages
  # without TYPO3 - see "docs/testing/visual-tests.md". One job rather than a
  # matrix: the stylesheet depends on neither PHP nor the core version, the
  # partials render to identical pages with the Fluid of either dependency set,
  # and the browser is the one pinned image - a second job would compare the
  # same pixels again. It installs the set "quality" installs and uses the same
  # composer cache key: both restore what an earlier run saved. As neither waits
  # for the other, a cache miss is a download in both.
  visual:
    name: "visual (v${{ matrix.typo3 }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: [ "8.2" ]
        typo3: [ "13" ]
    steps:

      - name: "Checkout"
        uses: actions/checkout@v6

      - name: "Cache composer downloads"
        uses: actions/cache@v6
        with:
          path: ".cache/composer"
          key: "composer-${{ matrix.php-version }}-v${{ matrix.typo3 }}-${{ hashFiles('composer.json') }}"
          restore-keys: |
            composer-${{ matrix.php-version }}-v${{ matrix.typo3 }}-
            composer-${{ matrix.php-version }}-

      - name: "Cache npm downloads"
        uses: actions/cache@v6
        with:
          path: ".cache/npm"
          key: "npm-visual-${{ hashFiles('Tests/Acceptance/package-lock.json') }}"
          restore-keys: "npm-visual-"

      - name: "Prepare dependencies for TYPO3 v${{ matrix.typo3 }}"
        run: "Build/Scripts/runTests.sh -b docker -t ${{ matrix.typo3 }} -p ${{ matrix.php-version }} -s composerUpdate"

      - name: "Render the styleguide partials and test them in a browser"
        run: "Build/Scripts/runTests.sh -b docker -t ${{ matrix.typo3 }} -p ${{ matrix.php-version }} -s visual"

      # The diff images are in "test-results/", next to the actual and the
      # expected screenshot; the fixtures make a failure reproducible from the
      # artifact alone.
      - name: "Upload the Playwright report"
        if: "failure()"
        uses: actions/upload-artifact@v6
        with:
          name: "visual-report"
          path: |
            .Build/visual/report/
            .Build/visual/test-results/
            .Build/visual/fixtures/
            .Build/visual/php-server.log
          if-no-files-found: "ignore"
          retention-days: 5

  # A development instance built from nothing, the way "ddev start" builds one,
  # and tested in a browser. Per core version, because the instance is: its
  # composer.json, its site configurations and the backend it serves differ.
  # It starts with the run, like every job, and runs beside the functional jobs.
  # Every spec runs in Chromium and then in Firefox, in this one job against
  # the one instance — see "docs/testing/acceptance-tests.md#two-engines".
  acceptance:
    name: "acceptance (v${{ matrix.typo3 }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: [ "8.2" ]
        typo3: [ "13", "14" ]
    steps:

      - name: "Checkout"
        uses: actions/checkout@v6

      - name: "Cache composer downloads"
        uses: actions/cache@v6
        with:
          path: ".cache/composer"
          key: "composer-acceptance-${{ matrix.php-version }}-v${{ matrix.typo3 }}-${{ hashFiles(format('instance-core-{0}/composer.json', matrix.typo3)) }}"
          restore-keys: |
            composer-acceptance-${{ matrix.php-version }}-v${{ matrix.typo3 }}-
            composer-${{ matrix.php-version }}-v${{ matrix.typo3 }}-

      - name: "Cache npm downloads"
        uses: actions/cache@v6
        with:
          path: ".cache/npm"
          key: "npm-acceptance-v${{ matrix.typo3 }}-${{ hashFiles('Tests/Acceptance/package-lock.json') }}"
          restore-keys: "npm-acceptance-v${{ matrix.typo3 }}-"

      - name: "Build an instance from nothing and test it in Chromium and Firefox"
        run: "Build/Scripts/runTests.sh -b docker -t ${{ matrix.typo3 }} -p ${{ matrix.php-version }} -s acceptance"

      - name: "Upload the Playwright report"
        if: "failure()"
        uses: actions/upload-artifact@v6
        with:
          name: "acceptance-report-v${{ matrix.typo3 }}"
          path: |
            .Build/acceptance/report/
            .Build/acceptance/test-results/
            .Build/acceptance/instance/var/log/
          if-no-files-found: "ignore"
          retention-days: 5

  functional-dbms:
    name: "functional ${{ matrix.dbms.name }} ${{ matrix.dbms.version }} (v${{ matrix.typo3 }}, PHP ${{ matrix.php-version }})"
    runs-on: ubuntu-22.04
    # Beside the SQLite jobs, not after them - see the header. A defect that is
    # not DBMS specific is reported by these 16 jobs as well.
    strategy:
      fail-fast: false
      matrix:
        php-version: [ "8.2", "8.5" ]
        typo3: [ "13", "14" ]
        dbms:
          - { name: "mysql", version: "8.0" }
          - { name: "mariadb", version: "10.4" }
          - { name: "mariadb", version: "10.6" }
          - { name: "postgres", version: "10" }
    steps:

      - name: "Checkout"
        uses: actions/checkout@v6

      - name: "Cache composer downloads"
        uses: actions/cache@v6
        with:
          path: ".cache/composer"
          key: "composer-${{ matrix.php-version }}-v${{ matrix.typo3 }}-${{ hashFiles('composer.json') }}"
          restore-keys: |
            composer-${{ matrix.php-version }}-v${{ matrix.typo3 }}-
            composer-${{ matrix.php-version }}-

      - name: "Prepare dependencies for TYPO3 v${{ matrix.typo3 }}"
        run: "Build/Scripts/runTests.sh -b docker -t ${{ matrix.typo3 }} -p ${{ matrix.php-version }} -s composerUpdate"

      - name: "Execute functional tests with ${{ matrix.dbms.name }} ${{ matrix.dbms.version }}"
        run: "Build/Scripts/runTests.sh -b docker -t ${{ matrix.typo3 }} -p ${{ matrix.php-version }} -d ${{ matrix.dbms.name }} -i ${{ matrix.dbms.version }} -s functional"

  functional-sqlite:
    name: "functional sqlite (v${{ matrix.typo3 }}, PHP ${{ matrix.php-version }})"
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        php-version: [ "8.2", "8.5" ]
        typo3: [ "13", "14" ]
    steps:

      - name: "Checkout"
        uses: actions/checkout@v6

      - name: "Cache composer downloads"
        uses: actions/cache@v6
        with:
          path: ".cache/composer"
          key: "composer-${{ matrix.php-version }}-v${{ matrix.typo3 }}-${{ hashFiles('composer.json') }}"
          restore-keys: |
            composer-${{ matrix.php-version }}-v${{ matrix.typo3 }}-
            composer-${{ matrix.php-version }}-

      - name: "Prepare dependencies for TYPO3 v${{ matrix.typo3 }}"
        run: "Build/Scripts/runTests.sh -b docker -t ${{ matrix.typo3 }} -p ${{ matrix.php-version }} -s composerUpdate"

      - name: "Execute functional tests with SQLite"
        run: "Build/Scripts/runTests.sh -b docker -t ${{ matrix.typo3 }} -p ${{ matrix.php-version }} -d sqlite -s functional"
