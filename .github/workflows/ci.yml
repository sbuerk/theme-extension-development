name: "CI"

# Everything that runs for a pull request: quality gates, linting, unit tests,
# functional tests against every supported DBMS, acceptance tests against a
# freshly built development instance, and the rendered documentation.
#
# One workflow rather than one per core version. The core version is a matrix
# dimension, which keeps a single place to add a further supported version.
#
# No job waits for another. Every job starts with the run:
#
#   quality, phpstan, lint, unit, assets, documentation   the gates, ~1 minute
#   visual        the styleguide partials: screenshots and axe
#   acceptance    a built instance, in Chromium and Firefox, and in WebKit
#   functional    MySQL, MariaDB, PostgreSQL - 16 jobs
#   functional    SQLite
#
# The jobs used to be staged, cheapest first: the gates, then unit, then SQLite,
# then the 16 database jobs. A defect a gate finds was then reported without
# starting the expensive jobs - but every run that went on to pass waited for
# each stage in turn, and a pull request run is almost always one that passes.
# In the run of pull request #93 the first database job started 24 minutes after
# the run did, of a run of 91 minutes. Starting everything at once costs runner
# time when a gate fails, which this public repository does not pay for, and it
# delays no report: the gates still finish within about a minute.
#
# There is no aggregating "all checks" job. Nothing requires a named check on
# "1" - no branch protection, no ruleset - and every job reports on the pull
# request by itself. Add one when a required check is introduced, and require
# that one job rather than the matrix job names, which change with the matrix.
#
# The order of the jobs below is deliberate. The account runs at most 20 jobs at
# a time (GitHub Free) and this workflow has 39, so about half of them start
# queued. The cheap and quick jobs come first, then the long ones, longest
# first: the 16 database jobs before the SQLite jobs, which are shorter and
# absorb a late start. GitHub does not document in which order the queued jobs
# of a run get a runner; this order is what helps if it follows the file, and
# costs nothing if it does not.
#
# Every job has a "timeout-minutes", so a hang fails the job instead of holding a
# runner for the default of 360 minutes. The values of the jobs other than the
# functional and the acceptance ones are set from the slowest successful job, in
# minutes, of the 15 newest pull request runs of this workflow against "1"
# created up to 2026-09-26 16:23 UTC (#64 to #93), all attempts, a job carried
# unchanged into a re-run counted once - with room for a slow image pull or a
# busy runner. The functional values are set from the first run of the chunked
# suite on this branch (#96, run 36301746627): its test steps time out at about
# three times the slowest job, and each job five minutes later. The acceptance
# value is set at about twice the slowest of the 18 successful acceptance jobs
# of the pull request runs of #104 to #117, all attempts: the crawl of every
# page at 305 pixels (#109) made the job take 10 to 15 minutes, where 8.4 had
# been the slowest before, and left the old timeout of 20 little room.
#
#   job                     slowest seen   timeout
#   ----------------------  -------------  --------------------------
#   quality, phpstan, lint  0.9            10
#   unit, assets, docs      0.6            10
#   visual                  3.5            15
#   acceptance              15.3 (#115)    30
#   functional (SQLite)     4.0            20
#   functional (databases)  9.2            35
#
# Three times is deliberate. Unchunked, 5 of the 240 successful database jobs of
# this branch took 66.1 to 186.5 minutes: some hosted runners run the MySQL and
# MariaDB suites two to five times slower than others, from the first test to
# the last, and a re-run lands on another host and is normal. A job that slow
# now fails at its timeout, to be re-run, instead of holding the pull request for
# an hour or more.
#
# The functional test step has a timeout of its own, five minutes below that of
# its job: a step that times out fails like any failing step (the runner sets
# its result to failed, actions/runner "StepsRunner.cs"), and the upload of the
# logs after it still runs. A job that times out is cancelled as a whole, and
# "!cancelled()" skips the upload - as it does for a run superseded by a newer
# push, which has nothing worth keeping. The acceptance test step times out
# five minutes below its job as well, so a run that stalls still uploads the
# traces of the tests that failed and the logs of the instance.
#
# Every functional job runs its suite in four chunks in parallel,
# "runTests.sh -j 4". With the showcase seed imported once per class, no class
# outweighs the rest: the heaviest takes 15 to 29 % of the suite - 81 of 529 s
# on SQLite, 275 of 938 s on MySQL 8.0, TYPO3 v13 - so a fourth chunk still
# shortens the run. Measured locally on a shared machine, one pair of runs each:
# SQLite 179 s with "-j 3" and 138 s with "-j 4", MySQL 8.0 325 s and 287 s.
# Four is also the number of vCPU of a hosted runner, where neither count was
# measured on this branch.
#
# Each chunk writes a JUnit log and a PHPUnit event log below
# ".Build/functional-runs/", and the job uploads both as an artifact for seven
# days. The JUnit logs are what the committed test durations, which balance the
# chunks, are refreshed from. The event log is appended to event by event, so
# for a chunk that a timeout ended it still names the test it was in, where the
# JUnit log stayed empty.
#
# Supported versions are declared in the matrices below. There are three PHP
# sets, and they have to be changed together:
#
#   all edges  PHP versions      Used by
#   ---------  ----------------  -------------------------------------------
#   all        8.1 8.2 8.3 8.4   lint
#   edges      8.1|8.2 and 8.4   unit, functional (lower edge per core version)
#   lowest     8.2               quality, phpstan
#
# Only the lowest PHP version is used for the gates that do not depend on it,
# because running them once per PHP version tests the same files again.
#
# PHP 8.1 belongs to TYPO3 v12 only: "typo3/cms-core" 13.4 requires PHP "^8.2",
# so a (v13, PHP 8.1) dependency set cannot be installed at all. The lower edge
# of the supported PHP range is therefore a property of the core version — 8.1
# for v12, 8.2 for v13 — and the upper edge is 8.4 for both.
#
# That is what a cross-product cannot express: crossing a PHP list with a core
# version list gives every core version the same lower edge, and this branch has
# two. "lint" still crosses the two lists and removes the single impossible pair
# with "exclude:", because it genuinely wants every PHP version. The test jobs
# want the edges only, so they enumerate their four combinations instead —
# "include:" for "unit" and "functional-sqlite", and a paired matrix dimension
# for "functional-dbms", which has a second dimension to cross (see there).
#
# Every step goes through "Build/Scripts/runTests.sh", so a gate behaves
# identically here and on a developer machine — see
# "docs/development/quality-gates.md".
#
# Every step also passes "-b docker". The script prefers podman whenever it is
# present and only falls back to docker, which is the right default for it — but
# GitHub hosted runners ship both, and their podman/crun combination has been
# observed to abort the first container start of a job with
# "OCI runtime error: crun: unknown version specified" (exit 126). It is
# intermittent, hits any job, and is caused by neither the runner image nor the
# testing image changing. Selecting docker here avoids crun entirely and leaves
# the script default and every local run untouched. Drop the flag once GitHub
# stops producing the mismatch.
#
# Every job runs on "ubuntu-26.04", named rather than "ubuntu-latest". That
# label moves from Ubuntu 24.04 to 26.04 in a rollout from October 19 to
# November 19, 2026, job by job (actions/runner-images#14748); a named version
# moves every job at once, when this repository decides to. The two functional
# jobs had been pinned to "ubuntu-22.04" since the initial commit, without a
# recorded reason; they move too. The same label is used by "pr-comment.yml"
# and "publish.yml"; change them together.
#
# The composer download cache is restored per PHP and core version. It lives in
# ".cache/" at the repository root and **must not** be moved under ".Build/":
# "composerUpdate" starts with "rm -rf .Build", so a cache stored there would be
# deleted before composer ever reads it — still saved at the end of every job,
# but never used, which makes the whole cache step a silent no-op.

on:
  pull_request:
  # By hand, and every night by "nightly-1.yml" of "main", which starts this
  # workflow on this branch and waits for the result. A "schedule" fires on the
  # default branch only, so this branch has no nightly workflow of its own, and
  # this trigger is what the nightly run of "main" needs here.
  workflow_dispatch:

# Least privilege. Nothing in this workflow writes, and it must stay that way:
# a pull request from a fork gets a read-only token anyway, so a write step here
# would work for branches and silently fail for external contributors.
# Commenting on the pull request happens in "pr-comment.yml" instead.
permissions:
  contents: read

# Superseded runs of the same pull request are pointless, and this workflow is
# not cheap. Pushing twice in a minute cancels the first run. A dispatched run
# has no pull request number and is grouped by its branch, "refs/heads/<branch>",
# so a nightly run and a pull request run never cancel each other.
concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

jobs:

  quality:
    name: "quality (v${{ matrix.typo3 }})"
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # These gates inspect source files, not the installed core, so one
        # dependency set is enough. The lowest supported one is used, which on
        # this branch is TYPO3 v12. PHP stays 8.2 rather than dropping to 8.1
        # with it: the gates do not depend on the PHP version, and 8.2 is the
        # one version both core versions accept, so this job needs no thought
        # when the core version below changes. One job.
        php-version: [ "8.2" ]
        typo3: [ "12" ]
    steps:

      - name: "Checkout"
        uses: actions/checkout@v6

      - name: "Cache composer downloads"
        uses: actions/cache@v6
        with:
          path: ".cache/composer"
          key: "composer-${{ matrix.php-version }}-v${{ matrix.typo3 }}-${{ hashFiles('composer.json') }}"
          restore-keys: |
            composer-${{ matrix.php-version }}-v${{ matrix.typo3 }}-
            composer-${{ matrix.php-version }}-

      - name: "Prepare dependencies for TYPO3 v${{ matrix.typo3 }}"
        run: "Build/Scripts/runTests.sh -b docker -t ${{ matrix.typo3 }} -p ${{ matrix.php-version }} -s composerUpdate"

      - name: "Validate composer.json"
        run: "Build/Scripts/runTests.sh -b docker -t ${{ matrix.typo3 }} -p ${{ matrix.php-version }} -s composerValidate"

      - name: "CGL"
        run: "Build/Scripts/runTests.sh -b docker -t ${{ matrix.typo3 }} -p ${{ matrix.php-version }} -s cgl -n"

      - name: "Ensure UTF-8 files do not contain BOM"
        run: "Build/Scripts/runTests.sh -b docker -t ${{ matrix.typo3 }} -p ${{ matrix.php-version }} -s checkBom"

      - name: "Find duplicate exception codes"
        run: "Build/Scripts/runTests.sh -b docker -t ${{ matrix.typo3 }} -p ${{ matrix.php-version }} -s checkExceptionCodes"

      - name: "Ensure markdown tables are formatted"
        run: "Build/Scripts/runTests.sh -b docker -t ${{ matrix.typo3 }} -p ${{ matrix.php-version }} -s checkMarkdownTables"

      - name: "Ensure test methods do not start with \"test\""
        run: "Build/Scripts/runTests.sh -b docker -t ${{ matrix.typo3 }} -p ${{ matrix.php-version }} -s checkTestMethodsPrefix"

  phpstan:
    name: "phpstan (v${{ matrix.typo3 }})"
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The only gate configured per core version: each configuration analyses
        # the "Core<major>/" sources of its own version against the core
        # installed for it. Every supported version needs an entry here - the
        # sources of a version left out are not analysed at all. Two jobs.
        #
        # PHP 8.2 for both, so the two legs differ in the core version only.
        # It is also the lowest version v13 accepts, and analysing v12 on 8.2
        # rather than on 8.1 loses nothing: PHPStan reads the sources, it does
        # not execute them.
        php-version: [ "8.2" ]
        typo3: [ "12", "13" ]
    steps:

      - name: "Checkout"
        uses: actions/checkout@v6

      - name: "Cache composer downloads"
        uses: actions/cache@v6
        with:
          path: ".cache/composer"
          key: "composer-${{ matrix.php-version }}-v${{ matrix.typo3 }}-${{ hashFiles('composer.json') }}"
          restore-keys: |
            composer-${{ matrix.php-version }}-v${{ matrix.typo3 }}-
            composer-${{ matrix.php-version }}-

      - name: "Prepare dependencies for TYPO3 v${{ matrix.typo3 }}"
        run: "Build/Scripts/runTests.sh -b docker -t ${{ matrix.typo3 }} -p ${{ matrix.php-version }} -s composerUpdate"

      - name: "Static code analyzer"
        run: "Build/Scripts/runTests.sh -b docker -t ${{ matrix.typo3 }} -p ${{ matrix.php-version }} -s phpstan"

  lint:
    name: "lint (v${{ matrix.typo3 }}, PHP ${{ matrix.php-version }})"
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Every supported PHP version against every supported core version,
        # minus the one pair that cannot be installed. 4 x 2 - 1 = 7 jobs.
        php-version: [ "8.1", "8.2", "8.3", "8.4" ]
        typo3: [ "12", "13" ]
        exclude:
          # "typo3/cms-core" 13.4 requires PHP "^8.2", so this dependency set
          # does not resolve. PHP 8.1 is a v12-only version on this branch.
          - { typo3: "13", php-version: "8.1" }
    steps:

      - name: "Checkout"
        uses: actions/checkout@v6

      - name: "Cache composer downloads"
        uses: actions/cache@v6
        with:
          path: ".cache/composer"
          key: "composer-${{ matrix.php-version }}-v${{ matrix.typo3 }}-${{ hashFiles('composer.json') }}"
          restore-keys: |
            composer-${{ matrix.php-version }}-v${{ matrix.typo3 }}-
            composer-${{ matrix.php-version }}-

      - name: "Prepare dependencies for TYPO3 v${{ matrix.typo3 }}"
        run: "Build/Scripts/runTests.sh -b docker -t ${{ matrix.typo3 }} -p ${{ matrix.php-version }} -s composerUpdate"

      - name: "Run PHP lint"
        run: "Build/Scripts/runTests.sh -b docker -t ${{ matrix.typo3 }} -p ${{ matrix.php-version }} -s lintPhp"

  unit:
    name: "unit (v${{ matrix.typo3 }}, PHP ${{ matrix.php-version }})"
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The four edge combinations, enumerated instead of crossed, because the
        # lower edge is 8.1 on v12 and 8.2 on v13 - see the header. With no other
        # matrix dimension present, "include:" *is* the job list: every entry
        # becomes exactly one job, so this is 4 jobs.
        include:
          # PHP 8.1 runs here and nowhere else, and it is the only PHP version
          # PHPUnit 11 does not support - which is why "composer.json" pins
          # PHPUnit to the 10.5 line for the whole branch rather than letting
          # composer resolve 11.5 for every other job. One PHPUnit major means
          # one set of runner semantics; two would differ in how the harness has
          # to spell "--exclude-group".
          - { typo3: "12", php-version: "8.1" }
          - { typo3: "12", php-version: "8.4" }
          - { typo3: "13", php-version: "8.2" }
          - { typo3: "13", php-version: "8.4" }
    steps:

      - name: "Checkout"
        uses: actions/checkout@v6

      - name: "Cache composer downloads"
        uses: actions/cache@v6
        with:
          path: ".cache/composer"
          key: "composer-${{ matrix.php-version }}-v${{ matrix.typo3 }}-${{ hashFiles('composer.json') }}"
          restore-keys: |
            composer-${{ matrix.php-version }}-v${{ matrix.typo3 }}-
            composer-${{ matrix.php-version }}-

      - name: "Prepare dependencies for TYPO3 v${{ matrix.typo3 }}"
        run: "Build/Scripts/runTests.sh -b docker -t ${{ matrix.typo3 }} -p ${{ matrix.php-version }} -s composerUpdate"

      - name: "Execute unit tests"
        run: "Build/Scripts/runTests.sh -b docker -t ${{ matrix.typo3 }} -p ${{ matrix.php-version }} -s unit"

      - name: "Execute unit tests in random order"
        run: "Build/Scripts/runTests.sh -b docker -t ${{ matrix.typo3 }} -p ${{ matrix.php-version }} -s unitRandom"

  # The committed build output: the stylesheet compiled from its SCSS and the
  # vendored Font Awesome icons, each compared with what the build writes. It
  # was called "css" while it checked the stylesheet alone. Independent of PHP
  # and of the core version, so a single job rather than a matrix dimension; it
  # also needs no "composerUpdate", which is what makes it the cheapest job in
  # the workflow. Both gates share the node image and the "npm ci" of one
  # lockfile.
  assets:
    name: "assets"
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:

      - name: "Checkout"
        uses: actions/checkout@v6

      - name: "Cache npm downloads"
        uses: actions/cache@v6
        with:
          path: ".cache/npm"
          key: "npm-assets-${{ hashFiles('package-lock.json') }}"
          restore-keys: "npm-assets-"

      - name: "Ensure the committed CSS matches its SCSS sources"
        run: "Build/Scripts/runTests.sh -b docker -s checkCssBuild"

      - name: "Ensure the committed icons equal the pinned Font Awesome Free"
        run: "Build/Scripts/runTests.sh -b docker -s checkIconsBuild"

  documentation:
    name: "documentation"
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:

      - name: "Checkout"
        uses: actions/checkout@v6

      # Recorded and uploaded *before* the rendering, so the comment workflow can
      # report on the right pull request even when the rendering fails.
      # "github.event.workflow_run.pull_requests" is empty for a fork, which is
      # why the number travels in an artifact rather than being read from the
      # event.
      - name: "Record the pull request number"
        if: "github.event_name == 'pull_request'"
        run: |
          mkdir -p .Build/pull-request-context
          echo "${{ github.event.pull_request.number }}" > .Build/pull-request-context/number

      - name: "Upload the pull request context"
        if: "github.event_name == 'pull_request'"
        uses: actions/upload-artifact@v6
        with:
          name: "pull-request-context"
          path: ".Build/pull-request-context/"
          if-no-files-found: "error"
          retention-days: 5
          # A re-run is an attempt of the same run, and a name can be uploaded
          # to once per run (upload-artifact README, "Breaking Changes"): a
          # re-run of this job would fail here without this.
          overwrite: true

      - name: "Render documentation"
        run: "Build/Scripts/runTests.sh -b docker -s renderDocumentation"

      - name: "Upload rendered documentation"
        uses: actions/upload-artifact@v6
        with:
          name: "documentation"
          path: "Documentation-GENERATED-temp/"
          compression-level: 9
          if-no-files-found: "error"
          retention-days: 5
          include-hidden-files: true
          overwrite: true

  # Screenshots and axe of the styleguide partials, rendered into static pages
  # without TYPO3 - see "docs/testing/visual-tests.md". One job rather than a
  # matrix: the stylesheet depends on neither PHP nor the core version, the
  # partials render to identical pages with the Fluid of either dependency set,
  # and the browser is the one pinned image - a second job would compare the
  # same pixels again. It installs the set "quality" installs and uses the same
  # composer cache key: both restore what an earlier run saved. As neither waits
  # for the other, a cache miss is a download in both.
  visual:
    name: "visual (v${{ matrix.typo3 }})"
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php-version: [ "8.2" ]
        typo3: [ "12" ]
    steps:

      - name: "Checkout"
        uses: actions/checkout@v6

      - name: "Cache composer downloads"
        uses: actions/cache@v6
        with:
          path: ".cache/composer"
          key: "composer-${{ matrix.php-version }}-v${{ matrix.typo3 }}-${{ hashFiles('composer.json') }}"
          restore-keys: |
            composer-${{ matrix.php-version }}-v${{ matrix.typo3 }}-
            composer-${{ matrix.php-version }}-

      - name: "Cache npm downloads"
        uses: actions/cache@v6
        with:
          path: ".cache/npm"
          key: "npm-visual-${{ hashFiles('Tests/Acceptance/package-lock.json') }}"
          restore-keys: "npm-visual-"

      - name: "Prepare dependencies for TYPO3 v${{ matrix.typo3 }}"
        run: "Build/Scripts/runTests.sh -b docker -t ${{ matrix.typo3 }} -p ${{ matrix.php-version }} -s composerUpdate"

      - name: "Render the styleguide partials and test them in a browser"
        run: "Build/Scripts/runTests.sh -b docker -t ${{ matrix.typo3 }} -p ${{ matrix.php-version }} -s visual"

      # The diff images are in "test-results/", next to the actual and the
      # expected screenshot; the fixtures make a failure reproducible from the
      # artifact alone.
      - name: "Upload the Playwright report"
        if: "failure()"
        uses: actions/upload-artifact@v6
        with:
          name: "visual-report"
          path: |
            .Build/visual/report/
            .Build/visual/test-results/
            .Build/visual/fixtures/
            .Build/visual/php-server.log
          if-no-files-found: "ignore"
          retention-days: 5

  # A development instance built from nothing, the way "ddev start" builds one,
  # and tested in a browser. Per core version, because the instance is: its
  # composer.json, its site configurations and the backend it serves differ.
  # It starts with the run, like every job, and runs beside the functional jobs.
  # Every spec runs in Chromium and then in Firefox in one job against one
  # instance, and in WebKit in a second job against an instance of its own.
  # WebKit alone takes longer than the other two together, and as a third pass
  # in the same job it would make this the job every run waits for, see
  # "docs/testing/acceptance-tests.md#three-engines".
  acceptance:
    name: "acceptance (v${{ matrix.typo3 }}, ${{ matrix.engines.name }})"
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        php-version: [ "8.2" ]
        typo3: [ "12", "13" ]
        engines:
          - { name: "Chromium and Firefox", key: "chromium-firefox", projects: "--project chromium --project firefox" }
          - { name: "WebKit", key: "webkit", projects: "--project webkit" }
    steps:

      - name: "Checkout"
        uses: actions/checkout@v6

      - name: "Cache composer downloads"
        uses: actions/cache@v6
        with:
          path: ".cache/composer"
          key: "composer-acceptance-${{ matrix.php-version }}-v${{ matrix.typo3 }}-${{ hashFiles(format('instance-core-{0}/composer.json', matrix.typo3)) }}"
          restore-keys: |
            composer-acceptance-${{ matrix.php-version }}-v${{ matrix.typo3 }}-
            composer-${{ matrix.php-version }}-v${{ matrix.typo3 }}-

      - name: "Cache npm downloads"
        uses: actions/cache@v6
        with:
          path: ".cache/npm"
          key: "npm-acceptance-v${{ matrix.typo3 }}-${{ hashFiles('Tests/Acceptance/package-lock.json') }}"
          restore-keys: "npm-acceptance-v${{ matrix.typo3 }}-"

      # The step times out below the job, so the upload after it still runs.
      - name: "Build an instance from nothing and test it in ${{ matrix.engines.name }}"
        timeout-minutes: 25
        run: "Build/Scripts/runTests.sh -b docker -t ${{ matrix.typo3 }} -p ${{ matrix.php-version }} -s acceptance -- ${{ matrix.engines.projects }}"

      - name: "Upload the Playwright report"
        if: "failure()"
        uses: actions/upload-artifact@v6
        with:
          name: "acceptance-report-v${{ matrix.typo3 }}-${{ matrix.engines.key }}"
          path: |
            .Build/acceptance/report/
            .Build/acceptance/test-results/
            .Build/acceptance/instance/var/log/
          if-no-files-found: "ignore"
          retention-days: 5

  functional-dbms:
    name: "functional ${{ matrix.dbms.name }} ${{ matrix.dbms.version }} (v${{ matrix.target.typo3 }}, PHP ${{ matrix.target.php-version }})"
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    # Beside the SQLite jobs, not after them - see the header. A defect that is
    # not DBMS specific is reported by these 16 jobs as well.
    strategy:
      fail-fast: false
      matrix:
        # Two dimensions, crossed - which is exactly what this job wants: every
        # edge combination against every DBMS. The (core version, PHP version)
        # pairs are ONE dimension, a nested object, because they are not a
        # cross-product among themselves (see the header).
        #
        # They cannot be written as "include:" the way "unit" and
        # "functional-sqlite" write them, because that shape only produces the
        # job list while no other dimension is declared. An "include:" entry
        # whose keys are none of the declared dimensions is merged into *every*
        # combination of them, and a later entry overwrites what an earlier one
        # merged in ("Using a matrix for your jobs" -> "Expanding or adding
        # matrix configurations"). Declaring "dbms:" and listing the four pairs
        # under "include:" would therefore not yield 16 jobs but 4 - one per
        # DBMS, each carrying the pair of the *last* include entry - silently
        # dropping three quarters of the coverage and leaving v12 untested.
        #
        # 4 pairs x 4 DBMS = 16 jobs:
        #
        #   (v12, PHP 8.1)  x  mysql 8.0, mariadb 10.4, mariadb 10.6, postgres 10
        #   (v12, PHP 8.4)  x  the same four
        #   (v13, PHP 8.2)  x  the same four
        #   (v13, PHP 8.4)  x  the same four
        target:
          - { typo3: "12", php-version: "8.1" }
          - { typo3: "12", php-version: "8.4" }
          - { typo3: "13", php-version: "8.2" }
          - { typo3: "13", php-version: "8.4" }
        dbms:
          - { name: "mysql", version: "8.0" }
          - { name: "mariadb", version: "10.4" }
          - { name: "mariadb", version: "10.6" }
          - { name: "postgres", version: "10" }
    steps:

      - name: "Checkout"
        uses: actions/checkout@v6

      - name: "Cache composer downloads"
        uses: actions/cache@v6
        with:
          path: ".cache/composer"
          key: "composer-${{ matrix.target.php-version }}-v${{ matrix.target.typo3 }}-${{ hashFiles('composer.json') }}"
          restore-keys: |
            composer-${{ matrix.target.php-version }}-v${{ matrix.target.typo3 }}-
            composer-${{ matrix.target.php-version }}-

      - name: "Prepare dependencies for TYPO3 v${{ matrix.target.typo3 }}"
        run: "Build/Scripts/runTests.sh -b docker -t ${{ matrix.target.typo3 }} -p ${{ matrix.target.php-version }} -s composerUpdate"

      # "-j 4": four chunks in parallel, each with a database container of its
      # own - see the header for why four. The step times out below the job, so
      # the upload after it still runs.
      - name: "Execute functional tests with ${{ matrix.dbms.name }} ${{ matrix.dbms.version }}"
        timeout-minutes: 30
        run: "Build/Scripts/runTests.sh -b docker -t ${{ matrix.target.typo3 }} -p ${{ matrix.target.php-version }} -d ${{ matrix.dbms.name }} -i ${{ matrix.dbms.version }} -j 4 -s functional"

      # The JUnit logs of the chunks, which the committed test durations are
      # refreshed from, and their PHPUnit event logs. Also for a failed run and
      # a step that timed out: PHPUnit 10.5 creates the JUnit log of a chunk
      # empty when the chunk starts and writes it when the chunk ends, so an
      # empty one names the chunk that did not end, and its event log the test
      # it was in.
      - name: "Upload the JUnit and event logs"
        if: "!cancelled()"
        uses: actions/upload-artifact@v6
        with:
          name: "functional-junit-${{ matrix.dbms.name }}-${{ matrix.dbms.version }}-v${{ matrix.target.typo3 }}-php${{ matrix.target.php-version }}"
          path: |
            .Build/functional-runs/*/junit-*.xml
            .Build/functional-runs/*/events-*.txt
            .Build/functional-runs/host-*.txt
          if-no-files-found: "warn"
          retention-days: 7
          # A re-run is an attempt of the same run, and a name can be uploaded
          # to once per run (upload-artifact README, "Breaking Changes"): the
          # re-run of a job whose first attempt uploaded - after a step
          # timeout, say - would fail its upload without this.
          overwrite: true

  functional-sqlite:
    name: "functional sqlite (v${{ matrix.typo3 }}, PHP ${{ matrix.php-version }})"
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The same four combinations as "unit", and for the same reason. 4 jobs.
        include:
          - { typo3: "12", php-version: "8.1" }
          - { typo3: "12", php-version: "8.4" }
          - { typo3: "13", php-version: "8.2" }
          - { typo3: "13", php-version: "8.4" }
    steps:

      - name: "Checkout"
        uses: actions/checkout@v6

      - name: "Cache composer downloads"
        uses: actions/cache@v6
        with:
          path: ".cache/composer"
          key: "composer-${{ matrix.php-version }}-v${{ matrix.typo3 }}-${{ hashFiles('composer.json') }}"
          restore-keys: |
            composer-${{ matrix.php-version }}-v${{ matrix.typo3 }}-
            composer-${{ matrix.php-version }}-

      - name: "Prepare dependencies for TYPO3 v${{ matrix.typo3 }}"
        run: "Build/Scripts/runTests.sh -b docker -t ${{ matrix.typo3 }} -p ${{ matrix.php-version }} -s composerUpdate"

      # "-j 4": four chunks in parallel - see the header for why four.
      - name: "Execute functional tests with SQLite"
        timeout-minutes: 15
        run: "Build/Scripts/runTests.sh -b docker -t ${{ matrix.typo3 }} -p ${{ matrix.php-version }} -d sqlite -j 4 -s functional"

      - name: "Upload the JUnit and event logs"
        if: "!cancelled()"
        uses: actions/upload-artifact@v6
        with:
          name: "functional-junit-sqlite-v${{ matrix.typo3 }}-php${{ matrix.php-version }}"
          path: |
            .Build/functional-runs/*/junit-*.xml
            .Build/functional-runs/*/events-*.txt
            .Build/functional-runs/host-*.txt
          if-no-files-found: "warn"
          retention-days: 7
          # A re-run is an attempt of the same run, and a name can be uploaded
          # to once per run (upload-artifact README, "Breaking Changes"): the
          # re-run of a job whose first attempt uploaded - after a step
          # timeout, say - would fail its upload without this.
          overwrite: true
