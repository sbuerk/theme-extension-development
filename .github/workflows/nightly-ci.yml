name: "Nightly CI"

# Starts the complete "CI" workflow on one branch and waits for its result. It
# is not scheduled itself: "nightly-main.yml" and "nightly-1.yml" call it, one
# per maintained branch, each at a time of its own.
#
# Why a workflow that starts "ci.yml", rather than a "schedule" trigger in
# "ci.yml": a schedule only ever fires on the default branch, with the workflow
# file of the default branch. Branch "1" has a "ci.yml" of its own - other core
# versions, other PHP versions - which a schedule on "main" cannot reach.
# "workflow_dispatch" can: it runs "ci.yml" as it is on the branch it is given,
# and the "ci.yml" of both branches carries that trigger. A dispatch made with
# "github.token" starts a run, unlike most events that token causes.
#
# Why it waits for the run it started: a run started by the dispatch belongs to
# "github-actions", and its failure notifies nobody. This job fails when that run
# does not succeed, and a failed scheduled run is reported the way GitHub reports
# scheduled workflows: to whoever last changed the "cron" line of the caller.
#
# The dispatched run is the pull request run, job for job. Its concurrency group
# is "CI-refs/heads/<branch>", while a pull request run is grouped by its number,
# so a nightly run and a pull request run never cancel each other, and neither
# do the runs for the two branches. A run of "ci.yml" started by hand on the same
# branch while the nightly one runs does cancel it, and this job then fails.
#
# The job holds one runner while it waits. The account runs twenty jobs at a
# time, across all its workflows and repositories - measured on the first
# nightly run, which dispatched both branches at once: never more than twenty
# jobs in progress between its own two jobs and the two CI runs, and dozens
# queued; the run of "1" took 22 minutes there, against 13 to 15 alone. That is
# why each branch has a caller of its own, an hour apart.

on:
  workflow_call:
    inputs:
      branch:
        description: "The branch whose ci.yml is started."
        required: true
        type: string

jobs:

  ci:
    name: "CI on ${{ inputs.branch }}"
    # A named version rather than "ubuntu-latest", like every job of "ci.yml" -
    # see its header.
    runs-on: ubuntu-26.04
    # The longest job of "ci.yml" has a timeout of 25 minutes on "main" and 35
    # on "1", and a run of about forty jobs needs two or three rounds of the 19
    # runners this job leaves it. Two hours is stuck, not slow.
    timeout-minutes: 120
    env:
      GH_TOKEN: "${{ github.token }}"
      GH_REPO: "${{ github.repository }}"
      BRANCH: "${{ inputs.branch }}"
    steps:

      # The dispatch answers with the id of the run it created when asked to
      # ("return_run_details"). It may still answer "204 No Content" without
      # one, so the run is then looked up instead: the dispatched "CI" run on
      # the branch created since a minute before the dispatch - the minute
      # absorbs a runner clock ahead of GitHub's. It takes a few seconds to
      # appear. More than one such run fails the step rather than guessing.
      # What is left: a "CI" run dispatched by hand on the same branch in that
      # minute, or before the nightly one shows up, and alone in the list, is
      # taken for it - only on the 204 path. The response is parsed apart from
      # the request, so an empty body cannot fail the step, while a refused
      # dispatch does.
      - name: "Start CI on ${{ inputs.branch }}"
        id: "start"
        run: |
          STARTED="$(date -u -d '-1 minute' +%Y-%m-%dT%H:%M:%SZ)"
          RESPONSE="$(gh api --method POST "repos/${GH_REPO}/actions/workflows/ci.yml/dispatches" \
            -f "ref=${BRANCH}" -F "return_run_details=true")"
          RUN_ID="$(jq -r '.workflow_run_id // empty' <<< "${RESPONSE}")"
          ATTEMPT=0
          while [[ -z "${RUN_ID}" && ${ATTEMPT} -lt 30 ]]; do
            ATTEMPT=$((ATTEMPT + 1))
            sleep 10
            CANDIDATES="$(gh run list --workflow ci.yml --branch "${BRANCH}" --event workflow_dispatch \
              --created ">=${STARTED}" --limit 10 --json databaseId --jq '.[].databaseId')"
            if [[ $(wc -w <<< "${CANDIDATES}") -gt 1 ]]; then
              echo "More than one dispatched CI run on ${BRANCH} since ${STARTED}: $(tr '\n' ' ' <<< "${CANDIDATES}")- not guessing which one this dispatch created." >&2
              exit 1
            fi
            RUN_ID="${CANDIDATES}"
          done
          if [[ -z "${RUN_ID}" ]]; then
            echo "No CI run appeared on ${BRANCH} within five minutes of the dispatch." >&2
            exit 1
          fi
          echo "run-id=${RUN_ID}" >> "${GITHUB_OUTPUT}"
          echo "CI on \`${BRANCH}\`: https://github.com/${GH_REPO}/actions/runs/${RUN_ID}" >> "${GITHUB_STEP_SUMMARY}"

      # Exits non-zero unless the run concluded "success": a failed, a
      # cancelled and a timed out run all fail this job.
      - name: "Wait for the CI run and take over its result"
        env:
          RUN_ID: "${{ steps.start.outputs.run-id }}"
        run: 'gh run watch "${RUN_ID}" --exit-status --interval 60'
