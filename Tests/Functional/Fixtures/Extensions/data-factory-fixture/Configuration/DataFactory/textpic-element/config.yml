# The page tree of "TextPicElementRenderingTest".
#
# Seeded rather than imported from a CSV data set for the same reason as
# "image-element": a gallery only renders for a real file reference, and the
# import writes the storage record, the "sys_file" and the reference together.
#
# A set of its own, so the counts "ImageElementRenderingTest" asserts on its
# page stay what they are.
identifier: tests-textpic-element
title: 'Text and image element test tree'

