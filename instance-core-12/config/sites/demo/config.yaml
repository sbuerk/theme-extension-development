# Site of the seeded showcase page tree.
#
# "rootPageId" is 1 because the seed set declares that uid - see
# "Configuration/DataFactory/theme-demo/Scenario.yaml" of the theme. A seed
# declaring its uids is what lets this file be committed before the tree
# exists.
#
# The base is relative and carries no host name, so the instance is reachable
# under its DDEV host name and under whatever a host stack serves it as.
#
# Unlike "instance-core-13", this file carries no "dependencies" key. Site sets
# are a TYPO3 v13.1 feature (changelog 13.1 "Feature: #103437 - Introduce site
# sets", and "Feature: #103439" for the TypoScript provider that makes a set
# deliver "setup.typoscript"). On v12 the key resolves to nothing, so writing it
# down would claim that this file enables the theme when it does not.
#
# On v12 the theme is enabled through its other delivery path, the classic
# static include registered by "Configuration/TCA/Overrides/sys_template.php".
# That needs a "sys_template" record on page 1, a database row this file cannot
# carry. The seed set this instance is built from, "theme-instance-core12" of
# "packages-dev/dev-site", writes it - see "docs/development/seeding.md", "On
# TYPO3 v12: both trees through sys_template".
rootPageId: 1
base: /
websiteTitle: 'Theme demo, TYPO3 v12'
languages:
  -
    title: English
    enabled: true
    languageId: 0
    base: /
    locale: en_US.UTF-8
    navigationTitle: English
    flag: us
    websiteTitle: ''
  # A second language, so the language menu of the header has something to
  # show. The showcase is seeded in English only, and that is deliberate:
  # "sbuerk/data-factory" declares records through "self", "children" and
  # "entities" and has no way to express a translation, so a German page tree
  # cannot be seeded at all.
  #
  # The honest result is what the menu renders. Every page of the demo is
  # untranslated, so "LanguageMenuProcessor" reports "available = 0" for this
  # language on every page and "Partials/Navigation/Language.html" shows it as
  # plain text rather than a link. "fallbackType: strict" is what says so:
  # there is no fallback, and a reader is not sent to an English page dressed
  # as a German one.
  #
  # "fallbackType: fallback" with "fallbacks: 0" would not change the menu
  # either - "PageRepository::getPageOverlaysForLanguage()" filters the default
  # language out of the overlay chain, so there would still be no overlay and
  # the entry would still be unavailable. It would only change what the page
  # itself renders.
  #
  # No "sys_language" record is needed: that table was removed in TYPO3 v12,
  # and a site language is the site configuration alone.
  -
    title: German
    enabled: true
    languageId: 1
    base: /de/
    locale: de_DE.UTF-8
    navigationTitle: Deutsch
    flag: de
    websiteTitle: ''
    hreflang: de-DE
    fallbackType: strict
    fallbacks: ''
