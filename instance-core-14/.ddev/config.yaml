name: core14-theme-v2
type: typo3
docroot: public
php_version: "8.2"
webserver_type: nginx-fpm
xdebug_enabled: false
additional_hostnames: []
additional_fqdns: []
# The instance runs on SQLite, resolved by "config/system/additional.php" and
# built by the "system:setup" hook below. No database container is started at
# all - the "database" block below only satisfies DDEV's own schema, which
# requires it.
database:
    type: mariadb
    version: "11.8"
omit_containers: [db]
use_dns_when_possible: true
timezone: Europe/Berlin
composer_version: "2"
web_environment: []
corepack_enable: false
hooks:
    post-start:
        # Forward the host SSH agent first: "composer install" below may resolve
        # packages from remotes that need it.
        - exec-host: ddev auth ssh
        - composer: install
        # Installs TYPO3 and imports the seed set when either is missing, and
        # does nothing when both are there - see "Build/Scripts/instance.php".
        # This is what makes a fresh clone come up ready with one "ddev start".
        - composer: system:setup
