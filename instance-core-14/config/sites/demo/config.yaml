# Site of the seeded showcase page tree, delivered through the site set of the
# theme.
#
# "rootPageId" is 1 because the seed set declares that uid - see
# "Configuration/DataFactory/theme-demo/Scenario.yaml" of the theme. A seed
# declaring its uids is what lets this file be committed before the tree
# exists.
#
# The base is relative and carries no host name, so the instance is reachable
# under its DDEV host name and under whatever a host stack serves it as.
rootPageId: 1
base: /
websiteTitle: 'Theme demo, TYPO3 v14'
dependencies:
  - sbuerk/theme-extension-development
languages:
  -
    title: English
    enabled: true
    languageId: 0
    base: /
    locale: en_US.UTF-8
    navigationTitle: English
    flag: us
    websiteTitle: ''
