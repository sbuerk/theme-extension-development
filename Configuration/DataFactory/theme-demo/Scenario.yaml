            # The cheatsheet: every content element the theme renders, and
            # every variant of one, on a single page.
            #
            # Built out of "Insert records" elements rather than out of copies.
            # A copy of every element would be a second definition of the same
            # thing, and the two would drift the first time one of them was
            # changed; a reference cannot. It also means the page demonstrates
            # the element it is made of: each family below is one "shortcut"
            # record naming the elements of one page, under a header element
            # that says which family it is.
            #
            # What that costs is the one element it cannot show. A shortcut
            # reached through a shortcut renders nothing - deliberately, see
            # "tt_content.shortcut" in
            # "Configuration/TypoScript/ContentElements.typoscript" - so the
            # "Insert records" elements of page 50 are not referenced here, and
            # the last element of the page says so.
            #
            # No sidebar. The main column beside one is narrower, and a
            # features element of four columns, a pricing element of three
            # plans and a hero all render differently in it. A cheatsheet whose
            # elements do not look the way they look on their own pages is
            # worth less than the table of contents a sidebar would add.
            #
            # The header of each family carries "space_before_class", which is
            # the one appearance field that earns its place here: without it
            # the families run into each other.
