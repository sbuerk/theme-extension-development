            # Every "menu_*" content element the theme renders, each pointed at a
            # different part of the seeded tree so the eleven are told apart by
            # what they list rather than by their header alone.
            #
            # "backend_layout: content_sidebar" is deliberate and is asserted:
            # page 8 is a sibling under the same parent and does *not* use it, so
            # the pair prove the layout is resolved per page rather than
            # inherited down the branch.
            - self:
                  id: 7
                  title: 'Menu elements'
                  slug: '/elements/menu'
                  backend_layout: 'content_sidebar'
                  # Read by the "menu_abstract" element below, which lists the
                  # children of page 5 - this page among them. Without an
                  # abstract the item still renders, just as a bare link
                  # ("showAbstract" is guarded by "{item.data.abstract}" in
                  # "Partials/ContentElement/Menu.html"), and nothing says why.
                  abstract: 'The eleven menu content elements, each pointed at a different part of this page tree.'
                  # The keyword source of the "menu_related_pages" element below.
                  # "special = keywords" reads the keywords of the page selected
                  # in "pages" and matches every *other* page under the site root
                  # that shares one, so this page is the source and is itself
                  # excluded from the result.
                  keywords: 'content elements'
              entities:
                content:
                  - self:
                        id: 701
                        CType: 'header'
                        header: 'Menu elements'
                        header_layout: 1

                  # "special = list" - "pages" names the pages to render, in the
                  # order they are listed; nothing is looked up by rootline
                  # position. Three top level pages, so the list is visibly a
                  # hand-picked selection rather than a branch of the tree.
                  # Not page 4: it is "nav_hide", and every menu leaves such a
                  # page out unless "includeNotInMenu" is set, a "special =
                  # list" included.
                  - self:
                        id: 702
                        CType: 'menu_pages'
                        header: 'menu_pages: a hand-picked list of pages'
                        header_layout: 2
                        pages: '2,3,9'

                  # "special = directory" - the *children* of the selected pages,
                  # not the pages themselves. Page 5 is the parent of this page,
                  # so this renders its three siblings.
                  - self:
                        id: 703
                        CType: 'menu_subpages'
                        header: 'menu_subpages: the children of one page'
                        header_layout: 2
                        pages: '5'

                  # "special = list" plus "levels = 2" - the selected page itself
                  # *and* one level of its own children. Same starting point as
                  # "menu_subpages" above, so the two side by side show what the
                  # second level adds.
                  - self:
                        id: 704
                        CType: 'menu_section'
                        header: 'menu_section: one page and its children'
                        header_layout: 2
                        pages: '5'

                  # "special = directory" plus "levels = 2" - the children of the
                  # selected page, each with their own children beneath them.
                  # Rooted at the home page, so the "Elements" branch appears
                  # with its three sub pages nested under it.
                  - self:
                        id: 705
                        CType: 'menu_section_pages'
                        header: 'menu_section_pages: two levels below one page'
                        header_layout: 2
                        pages: '1'

                  # No source field at all: the TCA of this type has no "pages"
                  # (EXT:frontend,
                  # "Overrides/280-tt_content-content_type-menu_sitemap.php"),
                  # and the TypoScript empties "special" - it always
                  # starts at the site root and walks seven levels down.
                  - self:
                        id: 706
                        CType: 'menu_sitemap'
                        header: 'menu_sitemap: the whole site from its root'
                        header_layout: 2

                  # The same seven-level walk as "menu_sitemap", rooted at the
                  # selected page instead of the site root. This tree is only
                  # three levels deep, so what it renders here is the same single
                  # level "menu_subpages" above renders - the depth has nothing
                  # further to reach, and that is a property of the demo tree,
                  # not of the element.
                  - self:
                        id: 707
                        CType: 'menu_sitemap_pages'
                        header: 'menu_sitemap_pages: a whole branch from one page'
                        header_layout: 2
                        pages: '5'

                  # "special = directory" again, with each item's own "abstract"
                  # shown beneath its link. Rooted at page 5, so the items are
                  # pages 6, 7 and 8 - each of which needs an "abstract" of its
                  # own for this element to show anything but bare links.
                  - self:
                        id: 708
                        CType: 'menu_abstract'
                        header: 'menu_abstract: children with their abstracts'
                        header_layout: 2
                        pages: '5'

                  # "special = updated" - the selected page and everything
                  # beneath it, sorted by "SYS_LASTCHANGED" descending. That
                  # column is 0 on a freshly seeded tree and is only written when
                  # a page is first rendered in the frontend, so the links are
                  # all there from the start and the dates appear page by page as
                  # the tree is browsed. The theme sets no "maxAge", so nothing
                  # is filtered out by age.
                  - self:
                        id: 709
                        CType: 'menu_recently_updated'
                        header: 'menu_recently_updated: the tree by last change'
                        header_layout: 2
                        pages: '1'

                  # "special = keywords" - "pages" names the page whose keywords
                  # are the search term, not the pages to list. This page is that
                  # source (see "keywords" on the page above); the result is
                  # every other page under the site root sharing one of them.
                  - self:
                        id: 710
                        CType: 'menu_related_pages'
                        header: 'menu_related_pages: pages sharing a keyword'
                        header_layout: 2
                        pages: '7'

                  # No category is selected, deliberately: this tree seeds no
                  # "sys_category" records, so there is nothing to select. An
                  # empty selection renders an empty menu, which is the correct
                  # rendering of "nothing selected".
                  #
                  # "selected_categories: 0" rather than leaving the field out:
                  # it is the value DataHandler itself normalises an
                  # unresolvable selection to, so it is what the column holds
                  # once anything real has touched it, and it keeps this element
                  # identical to its sibling below so neither reads as the
                  # special case.
                  - self:
                        id: 711
                        CType: 'menu_categorized_pages'
                        header: 'menu_categorized_pages: pages by category'
                        header_layout: 2
                        selected_categories: 0
                        category_field: 'categories'

                  # The same deliberate gap as above.
                  #
                  # The explicit 0 used to be load-bearing: the TypoScript
                  # interpolated the field straight into "uid_local IN (...)",
                  # and an empty value made that "IN ()" - accepted by SQLite,
                  # rejected as a syntax error by MariaDB, MySQL and PostgreSQL,
                  # taking the whole page down rather than just the element. That
                  # is now guarded where it belongs, in
                  # "ContentElements.typoscript", because an editor who saves the
                  # element before picking a category hits the same path and no
                  # seed value can help them.
                  - self:
                        id: 712
                        CType: 'menu_categorized_content'
                        header: 'menu_categorized_content: content by category'
                        header_layout: 2
                        selected_categories: 0
                        category_field: 'categories'

                  # The card and thumbnail layouts of the two page menus -
                  # "layout" 1 and 2, enabled for these two CTypes only. The
                  # three pages below "Theme elements" carry page media and an
                  # abstract, which is what a card shows; "menu_subpages" of
                  # page 8 lists every page below it, with media or without.
                  - self:
                        id: 713
                        CType: 'menu_pages'
                        header: 'menu_pages as cards: page media, title and abstract'
                        header_layout: 2
                        layout: 1
                        pages: '90,91,92'
                  - self:
                        id: 714
                        CType: 'menu_pages'
                        header: 'menu_pages as thumbnails: page media and title'
                        header_layout: 2
                        layout: 2
                        pages: '90,91,92'
                  - self:
                        id: 715
                        CType: 'menu_subpages'
                        header: 'menu_subpages as cards: the pages below one page'
                        header_layout: 2
                        layout: 1
                        pages: '8'
                  - self:
                        id: 716
                        CType: 'menu_subpages'
                        header: 'menu_subpages as thumbnails'
                        header_layout: 2
                        layout: 2
                        pages: '8'

            # The content elements this extension registers itself, one each,
            # so the "theme_*" CTypes can be looked at side by side rather than
            # one fixture at a time. The layouts of the heroes, the call to
            # action and the testimonial are on the pages below this one.
            #
            # No "content_sidebar" here, unlike its two siblings 6 and 7: the
            # layout is resolved per page, not inherited down the branch, and
            # this page is what proves it.
            - self:
                  id: 8
                  title: 'Theme elements'
                  slug: '/elements/theme'
                  backend_layout: 'content'
                  # As on page 6: the abstract and the keyword are read by the
                  # two menu elements on page 7, not by anything on this page.
                  abstract: 'The content elements this extension registers itself, one each; the pages below show the layouts of the heroes, the call to action and the quotation.'
                  keywords: 'content elements, theme'
              entities:
                content:
                  # theme_hero - the full hero: heading, lead, media and one call
                  # to action. Its own template defaults an unset
                  # "header_layout" to h1 (Partials/ContentElement/Hero.html),
                  # which is right for a page whose hero is its top heading and
                  # wrong for a page carrying three of them, so the level is set
                  # explicitly here.
                  - self:
                        id: 801
                        CType: 'theme_hero'
                        header: 'The full hero'
                        header_layout: 2
                        bodytext: >-
                          The hero carries a heading, a lead paragraph, one media
                          slot and a single call to action. It is the widest element
                          the theme ships and is meant to open a page.
                        tx_theme_link: 't3://page?uid=2'
                        tx_theme_link_label: 'Read the typography page'
                        # The empty string is a real item of the select, not a
                        # missing value: it is the default variant and renders the
                        # plain ".theme-button" with no modifier.
                        tx_theme_link_variant: ''
                        # An icon of the shipped set, before the label. The four
                        # link styles are spread over 801 to 805: primary here,
                        # secondary 802, ghost 803 and 805, link 804.
                        tx_theme_link_icon: 'arrow-right'
                  # theme_hero_small - the same field set as theme_hero, rendered
                  # through the same partial with "compact: 1", so the difference
                  # between the two is only visible with both on one page.
                  - self:
                        id: 802
                        CType: 'theme_hero_small'
                        header: 'The reduced hero'
                        header_layout: 2
                        bodytext: >-
                          The same fields as the full hero, rendered compactly. The
                          element above and this one differ in nothing an editor
                          fills in - only in the variant that was chosen.
                        tx_theme_link: 't3://page?uid=3'
                        tx_theme_link_label: 'Look at the media page'
                        tx_theme_link_variant: 'secondary'
                  # theme_hero_text_only - no "image" field on the CType at all,
                  # so no file reference either. The hero renders without its
                  # "theme-hero--media" modifier.
                  - self:
                        id: 803
                        CType: 'theme_hero_text_only'
                        header: 'The hero without media'
                        header_layout: 2
                        bodytext: >-
                          This variant has no image field in the backend form, so
                          there is nothing to leave empty. What it demonstrates is the
                          hero body on its own, full width.
                        tx_theme_link: 't3://page?uid=1'
                        tx_theme_link_label: 'Back to the start page'
                        tx_theme_link_variant: 'ghost'
                  # theme_teaser - a short block of text with a call to action
                  # and no media. Like theme_hero_text_only it has no "image"
                  # field, which is why the teaser partial renders without its
                  # "theme-teaser__media" part.
                  - self:
                        id: 804
                        CType: 'theme_teaser'
                        header: 'A teaser without media'
                        bodytext: >-
                          A teaser is a secondary block: a heading, a couple of
                          sentences and one link. Its heading defaults to h2 rather
                          than the hero's h1.
                        tx_theme_link: 't3://page?uid=4'
                        tx_theme_link_label: 'Open the empty page'
                        tx_theme_link_variant: 'link'
                  # theme_media_teaser - the same teaser with an image beside the
                  # text. The link is an external URL rather than a page, because
                  # "tx_theme_link" is a TCA type=link field and holds whatever
                  # the link wizard encoded - a page, a file, a mail address or,
                  # as here, a plain URL.
                  - self:
                        id: 805
                        CType: 'theme_media_teaser'
                        header: 'A teaser beside an image'
                        bodytext: >-
                          Text and a single image side by side. The image is one
                          file reference; the theme deliberately wires no gallery
                          processing here, because there is no grid to arrange.
                        tx_theme_link: 'https://docs.typo3.org/'
                        tx_theme_link_label: 'Read the TYPO3 documentation'
                        tx_theme_link_variant: 'ghost'
                  # theme_testimonial - a quotation with its attribution.
                  # "header" and "subheader" are relabelled on this CType to hold
                  # the attributed person's name and role, not a content heading.
                  #
                  # No media, and no file reference: the element renders through
                  # ".theme-quote", which has no media slot, and the image field
                  # was removed from the CType rather than left inert. Do not add
                  # one back without giving the component a slot first.
                  - self:
                        id: 806
                        CType: 'theme_testimonial'
                        header: 'Ada Lovelace'
                        subheader: 'Mathematician, 1843'
                        bodytext: >-
                          The Analytical Engine weaves algebraic patterns just as
                          the Jacquard loom weaves flowers and leaves.
                  # theme_author - a person: portrait, name, role, a short bio and
                  # the person's own links. The name is the content element's
                  # heading and goes through the shared header partial; the role
                  # is "subheader" and sits inside the component.
                  #
                  # "tx_theme_list_items" is the inline relation: the declared
                  # ids of its children, in the order they are rendered.
                  - self:
                        id: 807
                        CType: 'theme_author'
                        header: 'Grace Hopper'
                        subheader: 'Compiler pioneer'
                        bodytext: >-
                          Wrote the first compiler and spent the rest of her career
                          arguing that a programming language should read like
                          English.
                        tx_theme_list_items: '1,2'
                  # theme_linklist - a flat list of links. "header" is the list
                  # title here, not a content heading, which is why the CType
                  # offers the bare field rather than the headers palette.
                  #
                  # The list names its children out of uid order on purpose:
                  # 5, 3, 6, 4 renders "Typography", "Media", "Empty page" and
                  # the unlabelled link, while the uid order - which is also
                  # the order they are created in - would put "Media" first.
                  # Only the relation can produce the rendered order, which is
                  # what lets "ShowcaseTreeTest" tell the relation from the uid
                  # or the insertion order.
                  - self:
                        id: 808
                        CType: 'theme_linklist'
                        header: 'Where to read more'
                        tx_theme_list_items: '5,3,6,4'
                  # theme_sociallinks - a row of platform links. The first two
                  # carry a "brand_icon" from the vendored brands set and
                  # collapse to a square holding the logo, with "link_label"
                  # still in the markup and hidden visually; the other two have
                  # no logo and keep their label visible. Both states are in
                  # the seeded tree on purpose - the stylesheet decides between
                  # them with ":has(.theme-icon)", so a tree with logos only
                  # would never exercise the other half. The child "link" is
                  # restricted to url, email and telephone on this relation, so
                  # each of the three appears at least once.
                  - self:
                        id: 809
                        CType: 'theme_sociallinks'
                        header: 'Elsewhere'
                        tx_theme_list_items: '7,19,8,9'
                  # theme_media_teaser_grid - several cards in a grid. "header"
                  # and "bodytext" are the lead-in above the grid; the cards
                  # themselves are the same child table, here with the full
                  # header/text/image/link set the other three relations narrow
                  # away.
                  - self:
                        id: 810
                        CType: 'theme_media_teaser_grid'
                        header: 'Three cards in a grid'
                        bodytext: >-
                          Every card is one row of the shared child table. The
                          lead-in above is the element's own heading and body.
                        tx_theme_list_items: '10,11,12'
                  # theme_notice - the six kinds of ".theme-alert", one element
                  # each. The kind decides the modifier and the "role" together
                  # ("Templates/ContentElements/ThemeNotice.html"): "status" for
                  # info and success, "alert" for warning and danger, "note" for
                  # note and tip. "header" is the title inside the component,
                  # not a content heading, and "bodytext" is rich text on this
                  # CType, so it is written as a paragraph.
                  - self:
                        id: 811
                        CType: 'theme_notice'
                        tx_theme_notice_kind: 'note'
                        header: 'A note'
                        bodytext: '<p>An aside to the text around it. It takes the note role and is never a live region, because nothing about it ever changes. It is also the kind a notice gets when nobody chose one.</p>'
                  - self:
                        id: 812
                        CType: 'theme_notice'
                        tx_theme_notice_kind: 'info'
                        header: 'Information'
                        bodytext: '<p>The neutral kind, and the look of the bare class. It takes the status role, a polite live region that waits for a pause before it is read.</p>'
                  - self:
                        id: 813
                        CType: 'theme_notice'
                        tx_theme_notice_kind: 'tip'
                        header: 'A tip'
                        bodytext: '<p>A recommendation, and the one kind that follows the palette: switch the palette in the display settings, and this is the only notice that changes colour.</p>'
                  - self:
                        id: 814
                        CType: 'theme_notice'
                        tx_theme_notice_kind: 'success'
                        header: 'Something finished'
                        bodytext: '<p>Confirms that something went through. It takes the status role, like the information.</p>'
                  - self:
                        id: 815
                        CType: 'theme_notice'
                        tx_theme_notice_kind: 'warning'
                        header: 'A warning'
                        bodytext: '<p>Something needs attention before it becomes a problem. It takes the alert role, the assertive one.</p>'
                  - self:
                        id: 816
                        CType: 'theme_notice'
                        tx_theme_notice_kind: 'danger'
                        header: 'Something failed'
                        bodytext: '<p>Assertive like the warning, with a glyph of its own: once colours are forced, the glyph is what tells the six kinds apart.</p>'
                  # theme_tabs - one tab per child. The ids of the tabs and
                  # panels are derived from the anchor of the element, "c817",
                  # so a second tab group on the page cannot collide with this
                  # one. The children's "text" is rich text on this relation
                  # only; the second one links to the start page to show it.
                  - self:
                        id: 817
                        CType: 'theme_tabs'
                        header: 'Three tabs'
                        header_layout: 2
                        tx_theme_list_items: '13,14,15'
                  # theme_accordion - native "details" sharing one "name",
                  # "c818-accordion", so opening one item closes the others.
                  - self:
                        id: 818
                        CType: 'theme_accordion'
                        header: 'An accordion'
                        header_layout: 2
                        tx_theme_list_items: '16,17,18'

                # The children of the four relations above. A relation is not a
                # containment: a child is an ordinary record on this page, and
                # only the relation columns DataHandler writes tie it to its
                # parent element.
                listItem:
                  # theme_author, uid 807. This relation is narrowed to the link
                  # palette on that CType, so a child carries "link" and
                  # "link_label" and nothing else - "header", "text" and "image"
                  # are not part of the form there and would be dead data.
                  - self:
                        id: 1
                        link: 't3://page?uid=1'
                        link_label: 'Profile'
                  - self:
                        id: 2
                        # TYPO3 link syntax, not an "href": an email address is
                        # stored with its "mailto:" scheme.
                        link: 'mailto:grace@example.org'
                        link_label: 'Write an email'

                  # theme_linklist, uid 808, which lists these as 5, 3, 6, 4.
                  - self:
                        id: 3
                        link: 't3://page?uid=3'
                        link_label: 'Media'
                  # No "link_label" on purpose: the label is optional, and a row
                  # without one falls back to the resolved URL rather than
                  # rendering an empty link. This entry is what shows that
                  # fallback in the seeded tree.
                  - self:
                        id: 4
                        link: 'https://typo3.org/'
                  - self:
                        id: 5
                        link: 't3://page?uid=2'
                        link_label: 'Typography'
                        # "link_icon" is part of the link palette of every
                        # relation; one row of the list shows it.
                        link_icon: 'book-open'
                  - self:
                        id: 6
                        link: 't3://page?uid=4'
                        link_label: 'Empty page'

                  # theme_sociallinks, uid 809.
                  - self:
                        id: 7
                        link: 'https://mastodon.example/@theme'
                        link_label: 'Mastodon'
                        brand_icon: 'mastodon'
                  - self:
                        id: 19
                        link: 'https://github.example/theme'
                        link_label: 'GitHub'
                        brand_icon: 'github'
                  - self:
                        id: 8
                        link: 'mailto:hello@example.org'
                        link_label: 'Send an email'
                  - self:
                        id: 9
                        # "tel:" plus digits, "+", "," and ";" - anything else is
                        # stripped when the link wizard encodes a number.
                        link: 'tel:+4930123456'
                        link_label: 'Call the office'

                  # theme_media_teaser_grid, uid 810. The images of the three
                  # cards are attached in "config.yml".
                  #
                  # The child's "text" is a plain text column, never RTE-enabled,
                  # and is rendered through nl2br - so it holds sentences and
                  # line breaks, never markup.
                  - self:
                        id: 10
                        header: 'Typography'
                        text: 'Headings, running text and the inline cases a stylesheet has to answer for.'
                        link: 't3://page?uid=2'
                        link_label: 'Open the typography page'
                        link_icon: 'arrow-right'
                  - self:
                        id: 11
                        header: 'Media'
                        text: 'A single image and a two column gallery, both driven by the fields of the element.'
                        link: 't3://page?uid=3'
                        link_label: 'Open the media page'
                  # No "link" on this one: unlike the other three relations, the
                  # grid does not require it, and a card without a link renders
                  # its title and text with no ".theme-card__link". That shape is
                  # part of what this page demonstrates.
                  - self:
                        id: 12
                        header: 'A card without a link'
                        text: |-
                          The link is optional on this relation only.
                          A card without one is a plain block of text.

                  # theme_tabs, uid 817. Title and rich text, nothing else: the
                  # relation is narrowed to those two on that CType. The text is
                  # stored as written - "overrideChildTca" enables the editor in
                  # the form only, and DataHandler runs no rich text
                  # transformation for it (see "tt_content_theme_tabs.php").
                  - self:
                        id: 13
                        header: 'Site set'
                        text: '<p>A site depends on the site set of the theme, and constants, page TSconfig and setup arrive together. This is the first tab, the one the markup selects.</p>'
                  - self:
                        id: 14
                        header: 'Static include'
                        text: '<p>An installation without site sets includes the static TypoScript in a template record instead: the same files, read the same way. The <a href="t3://page?uid=1">start page</a> of the second tree of a development instance is delivered like that.</p>'
                  - self:
                        id: 15
                        header: 'Without the script'
                        text: '<p>Switch JavaScript off and reload: the tab list is gone, and every panel is shown in a frame of its own, under a heading repeating its tab.</p>'

                  # theme_accordion, uid 818.
                  - self:
                        id: 16
                        header: 'What makes the items exclusive?'
                        text: '<p>One <em>name</em> shared by every item of this element. Open another item and this one closes, with no script involved.</p>'
                  - self:
                        id: 17
                        header: 'Why is the name derived from the element?'
                        text: '<p>The browser groups items by name across the whole page, so two accordions sharing one would close each other. The name is the anchor of the element with a suffix.</p>'
                  - self:
                        id: 18
                        header: 'Is anything open at first?'
                        text: '<p>No. Which item a reader meets first is what the order of the items already says.</p>'

              # One page per theme element with variants, named after it:
              # every value of the fields that change how it looks, one element
              # each. "ShowcaseTreeTest" reads the values from the TCA and the
              # page TSconfig and holds these pages to them. The elements on
              # page 8 above keep their default look.
              #
              # "content_sidebar" where the element fits beside the sub
              # navigation, so the sibling pages are listed next to them.
              children:
                # "theme_text_icon" - every position, shape and size of the
                # icon, and one element without an icon.
                - self:
                      id: 70
                      title: 'Text and icon'
                      slug: '/elements/theme/text-icon'
                      backend_layout: 'content_sidebar'
                  entities:
                    content:
                      - self:
                            id: 7001
                            CType: 'header'
                            header: 'Text and icon'
                            header_layout: 1
                      - self:
                            id: 7002
                            CType: 'text'
                            header: 'Where the icon goes'
                            header_layout: 2
                            bodytext: |
                              <p>The heading, the text and the link of the element sit beside one
                              icon of the set. The icon goes at the start of the line, at its end or
                              above the text; it is drawn plain in the accent, or on a square or a
                              round tile of the accent; and it comes in three sizes. The elements
                              below show every one of those values.</p>
                      - self:
                            id: 7003
                            CType: 'theme_text_icon'
                            header: 'Configure once, in the site'
                            header_layout: 2
                            bodytext: |
                              <p>A site depends on the site set of the theme, and constants, page
                              TSconfig and setup arrive together. Nothing is copied into the site
                              package.</p>
                            tx_theme_icon: 'gear'
                            tx_theme_icon_position: 'start'
                            tx_theme_icon_shape: 'square'
                            tx_theme_icon_size: 'md'
                            tx_theme_link: 't3://page?uid=9'
                            tx_theme_link_label: 'Open the styleguide'
                            tx_theme_link_variant: ''
                      - self:
                            id: 7004
                            CType: 'theme_text_icon'
                            header: 'Templates that stay readable'
                            header_layout: 2
                            bodytext: |
                              <p>Every element is one Fluid template on the contract of a component.
                              A site package overrides the one file it wants to change and keeps the
                              rest.</p>
                            tx_theme_icon: 'code'
                            tx_theme_icon_position: 'end'
                            tx_theme_icon_shape: 'circle'
                            tx_theme_icon_size: 'lg'
                            tx_theme_link: 't3://page?uid=6'
                            tx_theme_link_label: 'See the core elements'
                            tx_theme_link_variant: 'secondary'
                            tx_theme_link_icon: 'arrow-right'
                      - self:
                            id: 7005
                            CType: 'theme_text_icon'
                            header: 'Readable for everybody'
                            header_layout: 2
                            bodytext: |
                              <p>Every colour of the theme is checked against the surfaces it sits
                              on, in both appearances and all five palettes. The icon beside this
                              text is decoration: the heading says the same.</p>
                            tx_theme_icon: 'universal-access'
                            tx_theme_icon_position: 'top'
                            tx_theme_icon_shape: 'plain'
                            tx_theme_icon_size: 'xl'
                      - self:
                            id: 7006
                            CType: 'theme_text_icon'
                            header: 'From a checkout to a running site'
                            header_layout: 2
                            bodytext: |
                              <p>Both development instances start with one command and seed this very
                              page tree, so a change is looked at in the backend and the frontend of
                              TYPO3 v13 and v14 alike.</p>
                            tx_theme_icon: 'rocket'
                            tx_theme_icon_position: 'top'
                            tx_theme_icon_shape: 'square'
                            tx_theme_icon_size: 'lg'
                            tx_theme_link: 't3://page?uid=2'
                            tx_theme_link_label: 'Read the typography pages'
                            tx_theme_link_variant: 'ghost'
                      - self:
                            id: 7007
                            CType: 'theme_text_icon'
                            header: 'An icon at the end, plain'
                            header_layout: 2
                            bodytext: |
                              <p>At the end of the line the icon moves to the other side of the text,
                              in a right-to-left page as well. It stays first in the markup.</p>
                            tx_theme_icon: 'shield-halved'
                            tx_theme_icon_position: 'end'
                            tx_theme_icon_shape: 'plain'
                            tx_theme_icon_size: 'md'
                      - self:
                            id: 7008
                            CType: 'theme_text_icon'
                            header: 'Without an icon'
                            header_layout: 2
                            bodytext: |
                              <p>No icon was picked for this element, so it renders its text alone,
                              without an empty tile where the icon would be.</p>
                            tx_theme_icon: ''
                            tx_theme_icon_position: 'start'
                            tx_theme_icon_shape: 'circle'
                            tx_theme_icon_size: 'md'

                # "theme_features" - every layout and every column count. The
                # children are list items 100-114, on this page like every
                # child of a relation.
                #
                # "content", not "content_sidebar" like its siblings: four
                # columns of the grid need 53.625rem inside the element, and
                # the main column beside the sub navigation has less, so the
                # four-column element would show three. "ShowcaseTreeTest"
                # holds every four-column features element to a page without
                # a sidebar.
                - self:
                      id: 71
                      title: 'Features'
                      slug: '/elements/theme/features'
                      backend_layout: 'content'
                  entities:
                    content:
                      - self:
                            id: 7101
                            CType: 'header'
                            header: 'Features'
                            header_layout: 1
                      - self:
                            id: 7102
                            CType: 'text'
                            header: 'Four layouts, up to four columns'
                            header_layout: 2
                            bodytext: |
                              <p>A group of features: an icon, a title, a sentence or two and a
                              link each. The layout sets the icon above the title, beside it on a
                              framed tile, or frames the whole feature; the fourth sets the heading
                              and the text of the element beside the grid. The grid takes two,
                              three or four columns at most, and fewer where a column would be too
                              narrow - one on a phone.</p>
                      - self:
                            id: 7103
                            CType: 'theme_features'
                            header: 'Why build against this theme'
                            header_layout: 2
                            bodytext: '<p>Three reasons, in columns of three, the icon on a tile above each title.</p>'
                            layout: 0
                            tx_theme_columns: 3
                            tx_theme_list_items: '100,101,102'
                      - self:
                            id: 7104
                            CType: 'theme_features'
                            header: 'What every element brings'
                            header_layout: 2
                            layout: 1
                            tx_theme_columns: 2
                            tx_theme_list_items: '103,104,105,106'
                      - self:
                            id: 7105
                            CType: 'theme_features'
                            header: 'The showcase at a glance'
                            header_layout: 2
                            layout: 2
                            tx_theme_columns: 4
                            tx_theme_list_items: '107,108,109,110'
                      - self:
                            id: 7106
                            CType: 'theme_features'
                            header: 'Two ways to deliver the theme'
                            header_layout: 2
                            bodytext: |
                              <p>A site takes the theme through its site set, an installation without
                              site sets through the static include. Both render the same pages, and
                              the tests hold them to it.</p>
                            layout: 3
                            tx_theme_columns: 2
                            tx_theme_list_items: '111,112,113,114'
                    listItem:
                      # theme_features 7103, in columns.
                      - self:
                            id: 100
                            header: 'Neutral by design'
                            text: 'An extension built against this theme shows its own structure, not a brand.'
                            icon: 'lightbulb'
                            link: 't3://page?uid=9'
                            link_label: 'Open the styleguide'
                            link_icon: 'arrow-right'
                      - self:
                            id: 101
                            header: 'Tested on both cores'
                            text: 'Every gate runs for TYPO3 v13 and for v14, each on its own dependency set.'
                            icon: 'list-check'
                            link: 't3://page?uid=6'
                            link_label: 'See the core elements'
                      # No link: a feature does not need one.
                      - self:
                            id: 102
                            header: 'Readable in every palette'
                            text: 'Every colour is checked in both appearances and all five palettes.'
                            icon: 'universal-access'
                      # theme_features 7104, hanging icons.
                      - self:
                            id: 103
                            header: 'A form of its own'
                            text: 'The backend form offers the fields the template renders, and no others.'
                            icon: 'pen-to-square'
                      - self:
                            id: 104
                            header: 'A template on a contract'
                            text: 'One Fluid file per element, written against the markup of a component.'
                            icon: 'code'
                      - self:
                            id: 105
                            header: 'Rich text where it is prose'
                            text: 'Headings and lists come from the rich text editor, with the classes of the theme.'
                            icon: 'book-open'
                      - self:
                            id: 106
                            header: 'Icons from one set'
                            text: 'Every icon is one of Font Awesome Free, picked by name in the form.'
                            icon: 'star'
                      # theme_features 7105, tiles.
                      - self:
                            id: 107
                            header: 'Typography'
                            text: 'Running text, lists, tables, quotes and code.'
                            icon: 'book'
                            link: 't3://page?uid=2'
                            link_label: 'Read'
                      - self:
                            id: 108
                            header: 'Media'
                            text: 'Images and galleries.'
                            icon: 'image'
                            link: 't3://page?uid=3'
                            link_label: 'Look'
                      - self:
                            id: 109
                            header: 'Core elements'
                            text: 'Every classic element, in its variants.'
                            icon: 'list'
                            link: 't3://page?uid=6'
                            link_label: 'Browse'
                      - self:
                            id: 110
                            header: 'Styleguide'
                            text: 'Every component, from its own markup.'
                            icon: 'gear'
                            link: 't3://page?uid=9'
                            link_label: 'Open'
                      # theme_features 7106, beside the introduction.
                      - self:
                            id: 111
                            header: 'Site set'
                            text: 'A dependency of the site; constants, page TSconfig and setup arrive together.'
                            icon: 'server'
                      - self:
                            id: 112
                            header: 'Static include'
                            text: 'The same TypoScript, included through a template record.'
                            icon: 'database'
                      - self:
                            id: 113
                            header: 'Never both'
                            text: 'A condition keeps the static include out of a site that names the set.'
                            icon: 'shield-halved'
                      - self:
                            id: 114
                            header: 'Compared page by page'
                            text: 'The second tree of an instance is rendered through the other path.'
                            icon: 'circle-check'

                # "theme_stats" - figures with and without icons, with and
                # without a sentence. List items 115-121.
                - self:
                      id: 72
                      title: 'Stats'
                      slug: '/elements/theme/stats'
                      backend_layout: 'content_sidebar'
                  entities:
                    content:
                      - self:
                            id: 7201
                            CType: 'header'
                            header: 'Stats'
                            header_layout: 1
                      - self:
                            id: 7202
                            CType: 'text'
                            header: 'A figure and what it counts'
                            header_layout: 2
                            bodytext: |
                              <p>Each figure is a pair of a description list: what it counts is the
                              term, the figure its description, shown above it and larger, in digits
                              of one width. An icon before the figure and a sentence below it are
                              optional.</p>
                      - self:
                            id: 7203
                            CType: 'theme_stats'
                            header: 'The theme in figures'
                            header_layout: 2
                            tx_theme_list_items: '115,116,117,118'
                      - self:
                            id: 7204
                            CType: 'theme_stats'
                            header: 'Without icons'
                            header_layout: 2
                            tx_theme_list_items: '119,120,121'
                    listItem:
                      # theme_stats 7203. "header" is the figure, "subheader"
                      # what it counts.
                      - self:
                            id: 115
                            header: '2001'
                            subheader: 'Icons shipped'
                            text: 'The whole solid style of Font Awesome Free, inline.'
                            icon: 'image'
                      - self:
                            id: 116
                            header: '5'
                            subheader: 'Palettes'
                            text: 'Each varies the accents only.'
                            icon: 'star'
                      - self:
                            id: 117
                            header: '2'
                            subheader: 'Core versions'
                            text: 'TYPO3 v13.4 and v14.3, from one branch.'
                            icon: 'server'
                      - self:
                            id: 118
                            header: '1'
                            subheader: 'Breakpoint'
                            icon: 'desktop'
                      # theme_stats 7204.
                      - self:
                            id: 119
                            header: '44px'
                            subheader: 'Smallest tap target'
                            text: 'The floor for anything clickable.'
                      - self:
                            id: 120
                            header: '4.5:1'
                            subheader: 'Contrast of body text, at least'
                      - self:
                            id: 121
                            header: '5px'
                            subheader: 'Border radius'
                            text: 'The single radius of the Frame.'

                # "theme_steps" - numbered steps, and steps with icons. List
                # items 122-129.
                - self:
                      id: 73
                      title: 'Steps'
                      slug: '/elements/theme/steps'
                      backend_layout: 'content_sidebar'
                  entities:
                    content:
                      - self:
                            id: 7301
                            CType: 'header'
                            header: 'Steps'
                            header_layout: 1
                      - self:
                            id: 7302
                            CType: 'text'
                            header: 'A process, in order'
                            header_layout: 2
                            bodytext: |
                              <p>The steps are an ordered list, numbered by the stylesheet, down the
                              page on a phone and across it from the medium breakpoint. A step may
                              show an icon in its marker instead of its number.</p>
                      - self:
                            id: 7303
                            CType: 'theme_steps'
                            header: 'Set up a development instance'
                            header_layout: 2
                            tx_theme_list_items: '122,123,124,125'
                      - self:
                            id: 7304
                            CType: 'theme_steps'
                            header: 'Release a version'
                            header_layout: 2
                            tx_theme_list_items: '126,127,128,129'
                    listItem:
                      # theme_steps 7303, numbered.
                      - self:
                            id: 122
                            header: 'Clone the repository'
                            text: 'One checkout holds both development instances.'
                      - self:
                            id: 123
                            header: 'Start the instance'
                            text: 'ddev start sets it up and seeds this page tree.'
                      - self:
                            id: 124
                            header: 'Log in'
                            text: 'The editor account and its password are documented.'
                      - self:
                            id: 125
                            header: 'Open the showcase'
                            text: 'Every element has a page below Elements.'
                      # theme_steps 7304, the icon in the marker; the last step
                      # has none and keeps its number.
                      - self:
                            id: 126
                            header: 'Run the gates'
                            text: 'Both core versions, one after the other.'
                            icon: 'list-check'
                      - self:
                            id: 127
                            header: 'Set the version'
                            text: 'In every file that carries one.'
                            icon: 'pen'
                      - self:
                            id: 128
                            header: 'Tag the release'
                            text: 'The tag starts the publishing.'
                            icon: 'tag'
                      - self:
                            id: 129
                            header: 'Tell people'
                            text: 'A step without an icon keeps its number.'
              # One page per collection element below "Theme elements", every
              # value of the fields that change how it looks - pages 90 to 92,
              # list items 150 to 177. "content_sidebar", like the pages of the
              # core elements: the sub navigation of the section lists them,
              # and "Theme elements" itself has no sidebar. Each page carries
              # page media and an abstract, which the card and thumbnail
              # layouts of the two page menus on page 7 show.
                - self:
                      id: 90
                      title: 'Card group'
                      slug: '/elements/theme/card-group'
                      backend_layout: 'content_sidebar'
                      abstract: 'Cards in a grid of two, three or four columns, and in one row that scrolls sideways.'
                  entities:
                    content:
                      - self:
                            id: 9001
                            CType: 'header'
                            header: 'Card group'
                            header_layout: 1
                      # "layout" 0 is the grid, "tx_theme_columns" the most cards
                      # side by side. The link of a card is a button of the style
                      # the card picks: the default, secondary, ghost and link
                      # are spread over the cards of this page.
                      - self:
                            id: 9002
                            CType: 'theme_card_group'
                            header: 'Three columns'
                            header_layout: 2
                            layout: 0
                            tx_theme_columns: 3
                            tx_theme_list_items: '150,151,152'
                      - self:
                            id: 9003
                            CType: 'theme_card_group'
                            header: 'Two columns'
                            header_layout: 2
                            layout: 0
                            tx_theme_columns: 2
                            tx_theme_list_items: '153,154'
                      - self:
                            id: 9004
                            CType: 'theme_card_group'
                            header: 'Four columns'
                            header_layout: 2
                            layout: 0
                            tx_theme_columns: 4
                            tx_theme_list_items: '155,156,157,158'
                      # "layout" 1 is the scroller: one row, three cards in view
                      # and the next one showing at the end. Five cards, so the
                      # strip always has something to scroll to.
                      - self:
                            id: 9005
                            CType: 'theme_card_group'
                            header: 'Around the showcase'
                            header_layout: 2
                            layout: 1
                            tx_theme_columns: 3
                            tx_theme_list_items: '159,160,161,162,163'
                            # A link back to the top of the page, because this
                            # is the last element of a long "content_sidebar"
                            # page - which is where such a link is worth
                            # anything, and the only reason the field is
                            # seeded anywhere. The other elements that carry
                            # it are the last ones of the article and of the
                            # cheatsheet, for the same reason; everything else
                            # keeps the TCA default of 0.
                            linkToTop: 1
                      # "layout" 2 is the wall: the cards keep their own
                      # heights and stack into columns, filled top to bottom.
                      # The texts are deliberately of very different lengths,
                      # because a wall of cards that are all the same height
                      # looks exactly like the grid.
                      - self:
                            id: 9006
                            CType: 'theme_card_group'
                            header: 'What people ask'
                            header_layout: 2
                            layout: 2
                            tx_theme_columns: 2
                            tx_theme_list_items: '450,451,452,453,454'
                    listItem:
                      # The images of the cards are attached in "config.yml".
                      - self:
                            id: 150
                            header: 'Workshops'
                            subheader: 'Every second Thursday'
