        # The styleguide. Not a showcase of content elements: the "styleguide"
        # backend layout declares no usable content column at all, and
        # "Templates/Page/Styleguide.html" renders the component library
        # straight from Fluid, ignoring anything placed on the page.
        #
        # In the main navigation, like the form showcase below: the showcase
        # sections - elements, typography, and the styleguide with the forms -
        # are what a reviewer of the theme navigates. Both pages used to be
        # "nav_hide"; neither was ever "hidden", which answers 404 in the
        # frontend and defeats seeding a page that exists to be opened.
        - self:
              id: 9
              title: 'Styleguide'
              slug: '/styleguide'
              backend_layout: 'styleguide'

        # The form showcase. A request form built from the form contract of the
        # component library, rendered by "Templates/Page/Forms.html" from the
        # "forms" backend layout - which, like "styleguide", declares no usable
        # content column: the form is the page.
        - self:
              id: 10
              title: 'Forms'
              slug: '/forms'
              backend_layout: 'forms'
