                        records: 'tt_content_11102,tt_content_11103,tt_content_11104,tt_content_11105'
                  - self:
                        id: 15353
                        CType: 'header'
                        header: 'Quotations'
                        header_layout: 2
                        space_before_class: 'extra-large'
                  - self:
                        id: 15354
                        CType: 'shortcut'
                        header: 'Quotations: theme_testimonial'
                        records: 'tt_content_11203,tt_content_11204,tt_content_11205,tt_content_11206'
                  - self:
                        id: 15355
                        CType: 'header'
                        header: 'Author, link list and social links'
                        header_layout: 2
                        space_before_class: 'extra-large'
                  - self:
                        id: 15356
                        CType: 'shortcut'
                        header: 'Author, link list and social links: theme_author, theme_linklist, theme_sociallinks'
                        records: 'tt_content_807,tt_content_808,tt_content_809'
                  - self:
                        id: 15357
                        CType: 'header'
                        header: 'Media teaser grid'
                        header_layout: 2
                        space_before_class: 'extra-large'
                  - self:
                        id: 15358
                        CType: 'shortcut'
                        header: 'Media teaser grid: theme_media_teaser_grid'
                        records: 'tt_content_810'
                  - self:
                        id: 15359
                        CType: 'header'
                        header: 'Notices'
                        header_layout: 2
                        space_before_class: 'extra-large'
                  - self:
                        id: 15360
                        CType: 'shortcut'
                        header: 'Notices: theme_notice'
                        records: 'tt_content_811,tt_content_812,tt_content_813,tt_content_814,tt_content_815,tt_content_816'
                  - self:
                        id: 15361
                        CType: 'header'
                        header: 'Tabs and accordion'
                        header_layout: 2
                        space_before_class: 'extra-large'
                  - self:
                        id: 15362
                        CType: 'shortcut'
                        header: 'Tabs and accordion: theme_tabs, theme_accordion'
                        records: 'tt_content_817,tt_content_818'
                  - self:
                        id: 15363
                        CType: 'header'
                        header: 'Frames, spacing and header looks'
                        header_layout: 2
                        space_before_class: 'extra-large'
                  - self:
                        id: 15364
                        CType: 'shortcut'
                        header: 'Frames, spacing and header looks: the Appearance tab of every element'
                        records: 'tt_content_5103,tt_content_5104,tt_content_5105,tt_content_5106,tt_content_5107,tt_content_5108,tt_content_5109,tt_content_5110,tt_content_5111,tt_content_5112,tt_content_5113,tt_content_5114,tt_content_5115,tt_content_5116,tt_content_5117,tt_content_5118,tt_content_5119,tt_content_5120,tt_content_5121,tt_content_5122'
                  - self:
                        id: 15365
                        CType: 'text'
                        header: 'What is not on this page'
                        header_layout: 2
                        space_before_class: 'extra-large'
                        linkToTop: 1
                        bodytext: |
                          <p><em>Insert records</em> itself. This page is built out of that element,
                          and a shortcut reached through a shortcut renders nothing on purpose - it
                          is how the theme makes a reference cycle impossible on both core
                          versions. Its own page, <a href="t3://page?uid=50">Insert records</a>,
                          shows what it does.</p>
                          <p>The backend layouts. A layout is a property of a page, so one page can
                          only ever show one of them; the pages of the showcase carry them between
                          them instead.</p>
                          <p>The component library and the form showcase. Both are rendered from
                          Fluid rather than from records - see
                          <a href="t3://page?uid=9">Styleguide</a> and
                          <a href="t3://page?uid=10">Forms</a> - so there is nothing here to
                          reference.</p>

        # The page layouts. One page per backend layout the theme registers
        # beyond the four a content page uses, each of them a wireframe: one
        # content element per column, labelled with the name of the slot and
        # the colPos it sits in, so the page itself answers which column is
        # which without opening the page module.
        #
        # The boxes are not drawn by anything new. Every content element
        # already carries the dashed outline and the CType chip of the Frame
        # variant, and "frame_class" tints it - so a wireframe box is an
        # ordinary "text" element with an appearance an editor can set.
        #
        # "ShowcaseTreeTest::everyRegisteredBackendLayoutIsUsedByASeededPage"
        # is what keeps this section complete: a layout registered in
        # "Configuration/PageTsConfig/BackendLayouts" with no seeded page
        # using it fails that test.
        - self:
              id: 171
              title: 'Layouts'
              slug: '/layouts'
              backend_layout: 'content'
          entities:
            content:
              - self:
                    id: 17101
                    CType: 'header'
                    header: 'Page layouts'
                    header_layout: 1
              - self:
                    id: 17102
                    CType: 'text'
                    header: 'What a backend layout decides'
                    header_layout: 2
                    bodytext: |
                      <p>A page's backend layout decides two separate things: which
                      columns the page module offers an editor, and which template the
                      frontend renders. The first is page TSconfig, the second is the
                      file named after the layout in
                      <code>Resources/Private/Templates/Page/</code>, and the colPos
                      numbers are the only thing that connects them.</p>
                      <p>Each page below shows one layout, with a labelled box in every
                      column it declares. The boxes are ordinary content elements: the
                      dashed outline and the type chip around them are the theme's own
                      development affordance, which the display settings in the header
                      switch off.</p>
              - self:
                    id: 17103
                    CType: 'menu_subpages'
                    header: 'One page per layout'
                    header_layout: 2
                    pages: '171'
          children:
            # "two_columns": stage above, then two equal columns. The second
            # element in the main column is there to show that a column
            # stacks its elements rather than turning each into a grid item -
            # the failure mode the column wrapper in
            # "Templates/Page/TwoColumns.html" exists to prevent.
            - self:
                  id: 172
                  title: 'Two columns'
                  slug: '/layouts/two-columns'
                  backend_layout: 'two_columns'
                  abstract: 'Two content columns of equal width, below a full width stage.'
              entities:
                content:
                  - self:
                        id: 17201
                        CType: 'text'
                        colPos: 2
                        frame_class: 'accent'
                        header: 'Stage - colPos 2'
                        header_layout: 1
                        bodytext: |
                          <p>The full width row above the columns. It is the same slot
                          the content page and the start page use, so a hero placed
                          here renders the same way on all three.</p>
                  - self:
                        id: 17202
                        CType: 'text'
                        colPos: 0
                        frame_class: 'surface'
                        header: 'Main content - colPos 0'
                        header_layout: 2
                        bodytext: |
                          <p>The first column, and the column every other layout has as
                          well. Content moved here from a content page keeps its colPos
                          and stays where it was.</p>
                  - self:
                        id: 17203
                        CType: 'text'
                        colPos: 0
                        frame_class: 'surface'
                        header: 'A second element in the same column'
                        header_layout: 3
                        bodytext: |
                          <p>Elements of one column stack; they do not become columns of
                          their own. The column is a wrapper in the markup for exactly
                          this reason.</p>
                  - self:
                        id: 17204
                        CType: 'text'
                        colPos: 3
                        frame_class: 'raised'
                        header: 'Second column - colPos 3'
                        header_layout: 2
                        bodytext: |
                          <p>The second column of this layout and of the two below it.
                          Both columns are half the content width from 768 pixels up and
                          stacked below that.</p>

            # "two_columns_wide": the same two slots, 2fr to 1fr. Same colPos
            # numbers as the page above, which is the point of the numbering.
            - self:
                  id: 173
                  title: 'Two columns, wide first'
                  slug: '/layouts/two-columns-wide'
                  backend_layout: 'two_columns_wide'
                  abstract: 'The same two columns, the first one twice as wide as the second.'
              entities:
                content:
                  - self:
                        id: 17301
                        CType: 'text'
                        colPos: 2
                        frame_class: 'accent'
                        header: 'Stage - colPos 2'
                        header_layout: 1
                        bodytext: |
                          <p>The same stage slot as on every other layout that has
                          one.</p>
                  - self:
                        id: 17302
                        CType: 'text'
                        colPos: 0
                        frame_class: 'surface'
                        header: 'Main content - colPos 0'
                        header_layout: 2
                        bodytext: |
                          <p>Two thirds of the content width. The ratio is stated twice -
                          as a three column page module grid this column spans two of,
                          and as a grid fraction in the template - because the page
                          module has whole columns to work with and the frontend has
                          fractions.</p>
                  - self:
                        id: 17303
                        CType: 'text'
                        colPos: 3
                        frame_class: 'raised'
                        header: 'Second column - colPos 3'
                        header_layout: 2
                        bodytext: |
                          <p>One third. Switching this page to the equal column layout
                          moves nothing: both layouts read colPos 0 and colPos 3.</p>

            # "three_columns": colPos 4 joins the two above it.
            - self:
                  id: 174
                  title: 'Three columns'
                  slug: '/layouts/three-columns'
                  backend_layout: 'three_columns'
                  abstract: 'Three content columns of equal width, below a full width stage.'
              entities:
                content:
                  - self:
                        id: 17401
                        CType: 'text'
                        colPos: 2
                        frame_class: 'accent'
                        header: 'Stage - colPos 2'
                        header_layout: 1
                        bodytext: |
                          <p>The stage spans all three columns.</p>
                  - self:
                        id: 17402
                        CType: 'text'
                        colPos: 0
                        frame_class: 'surface'
                        header: 'Main content - colPos 0'
                        header_layout: 2
                        bodytext: |
                          <p>The first of three equal columns.</p>
                  - self:
                        id: 17403
                        CType: 'text'
                        colPos: 3
                        frame_class: 'raised'
                        header: 'Second column - colPos 3'
                        header_layout: 2
                        bodytext: |
                          <p>The second. A page switched from here to one of the two
                          column layouts keeps this column where it is and leaves the
                          third unrendered, rather than reshuffling the first two.</p>
                  - self:
                        id: 17404
                        CType: 'text'
                        colPos: 4
                        frame_class: 'default'
                        header: 'Third column - colPos 4'
                        header_layout: 2
                        bodytext: |
                          <p>The third, and the only column of the theme that no other
                          layout declares. Left with the default appearance, so the
                          dashed outline is all that draws this box.</p>

            # "article": the running text held to the reading measure, with
            # the aside beside it. The aside is colPos 1, the same slot the
            # sidebar layout uses - see "Article.tsconfig" for why the number
            # is shared and the rendering is not.
            - self:
                  id: 175
                  title: 'Article'
                  slug: '/layouts/article'
                  backend_layout: 'article'
                  abstract: 'A long read at the reading measure, with an aside of notes beside it.'
              entities:
                content:
                  - self:
                        id: 17501
                        CType: 'text'
                        colPos: 2
                        frame_class: 'accent'
                        header: 'Stage - colPos 2'
                        header_layout: 1
                        bodytext: |
                          <p>The stage spans the article and its aside.</p>
                  - self:
                        id: 17502
                        CType: 'text'
                        colPos: 0
                        frame_class: 'surface'
                        header: 'The article - colPos 0'
                        header_layout: 2
                        bodytext: |
                          <p>Held to the reading measure, the same 68 characters the
                          lead of a hero and the running text of a quotation are held
                          to. The column may be wider than that; the text is not.</p>
                          <p>The measure is a property of the text rather than of the
                          layout, which is why it is a cap on this column and not a
                          grid track: a column holding something that is not prose - a
                          table, a gallery - still has the whole track to use.</p>
                  - self:
                        id: 17503
                        CType: 'text'
                        colPos: 1
                        frame_class: 'raised'
                        header: 'The aside - colPos 1'
                        header_layout: 2
                        bodytext: |
                          <p>The same column number as the sidebar of the sidebar
                          layout, so material moved between the two layouts stays where
                          it was. What differs is the rendering: there the slot goes
                          into the navigation column of the page shell, which also
                          carries the sub navigation and the table of contents; here it
                          is a column of the article grid that follows the article in
                          reading order and carries nothing but what an editor puts in
                          it.</p>

            # "cover": one column, centred in what the shell leaves between the
            # header and the footer. No stage and no breadcrumb.
            - self:
                  id: 176
                  title: 'Cover'
                  slug: '/layouts/cover'
                  backend_layout: 'cover'
                  abstract: 'A landing page of one column, centred in the viewport.'
              entities:
                content:
                  - self:
                        id: 17601
                        CType: 'text'
                        colPos: 0
                        frame_class: 'accent'
                        header: 'Cover - colPos 0'
                        header_layout: 1
                        bodytext: |
                          <p>The only column of this layout, centred between the header
                          and the footer. The page is as tall as the viewport whatever
                          is placed here, so a short cover sits in the middle of the
                          screen rather than under the header.</p>
                  - self:
                        id: 17602
                        CType: 'text'
                        colPos: 0
                        header: 'No stage, and no breadcrumb'
                        header_layout: 2
                        bodytext: |
                          <p>A cover page is the top of whatever it announces: a trail
                          above it would lead nowhere worth going, and a stage would be
                          a second place to put the banner that this page already is.</p>

            # "bands": the three columns of "three_columns", stacked and taken
            # out of the content container. The third band is "inverse", which
            # is the band that makes the full width obvious at a glance.
            - self:
                  id: 177
                  title: 'Full-width bands'
                  slug: '/layouts/bands'
                  backend_layout: 'bands'
                  abstract: 'Three bands, stacked, each spanning the full width of the viewport.'
              entities:
                content:
                  - self:
                        id: 17701
                        CType: 'text'
                        colPos: 0
                        frame_class: 'surface'
                        header: 'First band - colPos 0'
                        header_layout: 1
                        bodytext: |
                          <p>The page gives up its content container while it holds a
                          band stack, so a band reaches both edges of the viewport. The
                          header and the footer keep theirs.</p>
                  - self:
                        id: 17702
                        CType: 'text'
                        colPos: 3
                        frame_class: 'accent'
                        header: 'Second band - colPos 3'
                        header_layout: 2
                        bodytext: |
                          <p>The same column numbers as the three column layout, laid
                          out one below the other instead of side by side - so a page
                          moved between the two changes how it reads and not where its
                          content sits.</p>
                  - self:
                        id: 17703
                        CType: 'text'
                        colPos: 4
                        frame_class: 'inverse'
                        header: 'Third band - colPos 4'
                        header_layout: 2
                        bodytext: |
                          <p>An inverted band, which is the appearance that makes the
                          width obvious at a glance. Bands are flush against each
                          other; the space between two of them is the space after the
                          last element of the one above.</p>

        # The composed pages - "Examples", page 113 and its children.
        #
        # Every other section of this tree shows ONE thing at a time: a page
        # per content element, a page per backend layout, a page per
        # appearance value. That is what a showcase has to do first, and it
        # is not what an editor ever builds. These pages are the other half:
        # whole pages, each put together from elements that already ship,
        # with nothing chosen to demonstrate a field and everything chosen
        # because the page needs it.
        #
        # NOTHING HERE IS NEW. No content element, no component, no backend
        # layout and no template was added for this section - if a page below
        # could not be expressed with what the theme already has, that is
        # reported rather than built around. The last element of every
        # composed page - 114 and below, not this section index - is a notice
        # naming the elements that page is made of, so the section reads as
        # documentation of composition rather than as decoration.
        #
        # NO GALLERY OF HEADER OR FOOTER VARIANTS. All six arrangements are
        # specimens of "Partials/Styleguide/Chrome.html" already, and
        # "ChromeVariantRenderingTest" drives each of them from its setting,
        # so a gallery of pages would restate what is shown and tested. It
        # would also cost more than it looks: "theme.header.variant" and
        # "theme.footer.variant" are read once into a TypoScript variable in
        # "Page.typoscript", so a page choosing its own needs a setup
        # condition on the page uid - a per-page override of a site-wide
        # setting, seeded into the showcase, that no site would write.
        #
        # The pages sit between "Layouts" and "Styleguide" in the main
        # navigation, which makes this the seventh top level entry. The header
        # holds seven beside a one line site title at 1280 pixels -
        # "Tests/Acceptance/frontend.spec.ts" measures exactly that, at three
        # and at seven entries, and has since the header was reworked.
        - self:
              id: 113
              title: 'Examples'
              slug: '/examples'
              backend_layout: 'content'
              abstract: 'Whole pages composed from the elements the theme already ships - an album, a pricing page, a weblog, a product page and three landing pages.'
              keywords: 'examples, composition'
          entities:
            content:
              - self:
                    id: 11301
                    CType: 'header'
                    header: 'Examples'
                    header_layout: 1
              - self:
                    id: 11302
                    CType: 'text'
                    header: 'Pages, not specimens'
                    header_layout: 2
                    bodytext: |
                      <p>The rest of this tree takes the theme apart: one page per content
                      element, one per backend layout, one per value of a field. These
                      pages put it back together. Each of them is a page somebody might
                      actually publish, and each is made of nothing but the elements,
                      layouts, frames and appearance values that are demonstrated one at a
                      time elsewhere.</p>
                      <p>That is the point of the section. An element looks finished on a
                      page that holds nothing else; what it is worth is decided next to
                      five other elements, under a heading, in a column of a real width.
                      The last element of every page below names what that page is made
                      of.</p>
              # "menu_abstract" rather than "menu_subpages": every page of this
              # section carries an abstract saying what it composes, and this
              # is the menu that shows one.
              - self:
                    id: 11303
                    CType: 'menu_abstract'
                    header: 'The pages of this section'
                    header_layout: 2
                    pages: '113'
          children:
            # An album: a reduced hero, a gallery of the core "Images"
            # element, a row of cards and a call to action. The one page of
            # the section on the plain content layout with a stage, which is
            # what most pages of a site are.
            - self:
                  id: 114
                  title: 'Album'
                  slug: '/examples/album'
                  backend_layout: 'content'
                  abstract: 'A photo collection: a centred reduced hero in the stage, a gallery in three columns, a row of cards and a closing call to action.'
              entities:
                content:
                  - self:
                        id: 11401
                        CType: 'theme_hero_small'
                        colPos: 2
                        tx_theme_hero_layout: 'centred'
                        tx_theme_eyebrow: 'Album'
                        header: 'Field notes from a relaunch'
                        header_layout: 1
                        bodytext: >-
                          Nine months of a site being rebuilt, photographed on the way.
                          The pictures are placeholders; the page around them is not.
                        tx_theme_link: 't3://page?uid=113'
                        tx_theme_link_label: 'Back to the examples'
                        tx_theme_link_variant: 'ghost'
                        tx_theme_link_icon: 'arrow-left'
                  - self:
                        id: 11402
                        CType: 'text'
                        header: 'What is in here'
                        header_layout: 2
                        bodytext: |
                          <p>A gallery of six pictures in three columns, three collections
                          as cards, and one place to ask for the full set. The gallery is
                          the core <em>Images</em> element with <em>imagecols</em> set to
                          three - the same element the media page shows in one, two, three
                          and four columns.</p>
                  - self:
                        id: 11403
                        CType: 'image'
                        header: 'Selected pictures'
                        header_layout: 2
                        imagecols: 3
                  - self:
                        id: 11404
                        CType: 'theme_card_group'
                        header: 'Three collections'
                        header_layout: 2
                        layout: 0
                        tx_theme_columns: 3
                        tx_theme_list_items: '600,601,602'
                  - self:
                        id: 11405
                        CType: 'theme_cta'
                        tx_theme_cta_tone: 'accent'
                        tx_theme_cta_width: 'band'
                        tx_theme_icon: 'camera'
                        header: 'Want the pictures at full size?'
                        header_layout: 2
                        bodytext: |
                          <p>The whole set is on request. The form showcase is where such a
                          request would be sent from.</p>
                        tx_theme_link: 't3://page?uid=10'
                        tx_theme_link_label: 'Ask for the set'
                        tx_theme_link_icon: 'envelope'
                        tx_theme_secondary_link: 't3://page?uid=3'
                        tx_theme_secondary_link_label: 'How images are rendered'
                        tx_theme_secondary_link_variant: 'link'
                  - self:
                        id: 11406
                        CType: 'theme_notice'
                        tx_theme_notice_kind: 'note'
                        header: 'What this page is made of'
                        bodytext: '<p>A reduced hero in the stage, a text, the core <em>Images</em> element in three columns, a card group in the grid layout and a call to action as a band. The backend layout is <em>Content page</em>.</p>'
                listItem:
                  # The cards of 11404. The pictures are attached in
                  # "config.yml"; the third card deliberately has none, which
                  # is the shape a card group falls back to when an editor
                  # leaves the image empty.
                  - self:
                        id: 600
                        header: 'Before'
                        subheader: 'March'
                        text: 'The site as it was, photographed on the day the rebuild was agreed.'
                        link: 't3://page?uid=3'
                        link_label: 'Look'
                        link_variant: 'secondary'
                  - self:
                        id: 601
                        header: 'During'
                        subheader: 'June'
                        text: 'Prototypes on a wall, most of them wrong, two of them kept.'
                        link: 't3://page?uid=9'
                        link_label: 'Look'
                        link_variant: 'secondary'
                  - self:
                        id: 602
                        header: 'After'
                        subheader: 'December'
                        text: 'The pictures of this one are not taken yet, so the card carries none.'

            # A pricing page: the text hero, the plans, what every plan
            # includes, the questions people ask, and one way to get in touch.
            # The plans need the full content width, so this page uses
            # "content" rather than "content_sidebar" - the same reason page
            # 170 gives for the pricing element's own demo page.
            - self:
                  id: 115
                  title: 'Pricing'
                  slug: '/examples/pricing'
                  backend_layout: 'content'
                  abstract: 'A plan comparison: a centred text hero, three plans, the features they share, the questions people ask and a way to get in touch.'
              entities:
                content:
                  - self:
                        id: 11501
                        CType: 'theme_hero_text_only'
                        colPos: 2
                        tx_theme_hero_layout: 'centred'
                        tx_theme_eyebrow: 'Support plans'
                        header: 'One theme, three ways to be supported'
                        header_layout: 1
                        bodytext: >-
                          The theme itself is free and always will be. What is bought here
                          is somebody answering when a site built on it does something
                          unexpected.
                  - self:
                        id: 11502
                        CType: 'theme_pricing'
                        header: 'Choose a plan'
                        header_layout: 2
                        tx_theme_list_items: '610,611,612'
                  - self:
                        id: 11503
                        CType: 'theme_features'
                        header: 'In every plan'
                        header_layout: 2
                        bodytext: |
                          <p>Whichever plan a site is on, these four are part of it.</p>
                        layout: 1
                        tx_theme_columns: 2
                        tx_theme_list_items: '613,614,615,616'
                  - self:
                        id: 11504
                        CType: 'theme_accordion'
                        header: 'Questions people ask before they choose'
                        header_layout: 2
                        tx_theme_list_items: '617,618,619'
                  - self:
                        id: 11505
                        CType: 'theme_cta'
                        tx_theme_cta_tone: ''
                        tx_theme_cta_width: 'boxed'
                        tx_theme_icon: 'envelope'
                        header: 'Still not sure which one?'
                        header_layout: 2
                        bodytext: |
                          <p>Describe the site and how many people edit it, and the plan
                          picks itself.</p>
                        tx_theme_link: 't3://page?uid=10'
                        tx_theme_link_label: 'Write to us'
                        tx_theme_link_icon: 'arrow-right'
                        tx_theme_secondary_link: 't3://page?uid=170'
                        tx_theme_secondary_link_label: 'The pricing element itself'
                        tx_theme_secondary_link_variant: 'link'
                  - self:
                        id: 11506
                        CType: 'theme_notice'
                        tx_theme_notice_kind: 'note'
                        header: 'What this page is made of'
                        bodytext: '<p>A hero without media in the stage, the pricing element with three plans, a feature grid with hanging icons, an accordion and a call to action in a box. The backend layout is <em>Content page</em>, without a sidebar, because three plans compared side by side need the full width.</p>'
                listItem:
                  # The plans of 11502. One feature per line: the relation
                  # declares "wrap = off" on this column, so a line break is
                  # the structure of the value.
                  - self:
                        id: 610
                        header: 'Reading'
                        subheader: '0 €'
                        meta: 'for ever'
                        text: |-
                          The documentation and this showcase
