                      - self:
                            id: 11202
                            CType: 'text'
                            header: 'Three ways to set a quotation'
                            header_layout: 2
                            bodytext: |
                              <p>The testimonial sets its quotation with a rule at the
                              start by default. A pull quote lifts a sentence out of the
                              text around it; a centred quotation stands on its own. Both
                              open with a quotation mark from the icon set.</p>
