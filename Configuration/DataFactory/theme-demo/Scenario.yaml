# The records of the seed set "theme-demo", in the scenario format of
# typo3/testing-framework as sbuerk/data-factory reads it.
#
# UIDS
#
# Every record declares its uid, and the numbering is a rule rather than a
# sequence:
#
#   pages               1-10, the first tree, and 30-39, 50-56, 70-73,
#                       90-92, 110-119, 130-131, 150-153 and 170-177 - the
#                       pages added below its sections, fifty-eight in all.
#                       The odd decades from 30 up are reserved; the ids
#                       actually used are fewer - see below for why the new
#                       ones skip decades
#   tt_content          the uid of its page times 100, plus its position on
#                       that page: the third element of page 6 is 603, the
#                       second of page 35 is 3502
#   tx_theme_list_item  1-19 on page 8, numbered in the order they are
#                       declared - the link list's four deliberately not in
#                       the order they render in, see there, and 19 declared
#                       after 18 when the social links grew a second entry
#                       with a logo - then 100-129 on the pages of the icon
#                       content elements below it, 150-177 on pages 90 to 92,
#                       450-454 on page 90 with the card wall, 460-465 on
#                       page 150, 470-474 on page 151, 500-503 on page 170,
#                       and 600-677 on the composed pages of "Examples".
#                       A hundred and forty-seven records in all: the ranges
#                       are deliberately not contiguous, and the numbers
#                       between them are free
#
# The development instances mirror this tree below "/legacy/", generated by
# "Build/Scripts/generateLegacyScenario.php", which moves every uid by 1000
# in every table. For "tt_content" that is ten pages: the mirror of the
# content of page p takes the uids of the content of page p + 10. So a page
# with content never sits ten uids from another one:
#
#   11-19   taken by the mirror of the content of pages 1-9
#   20-29   the account pages of the instance set ("Accounts.yaml" of
#           "packages-dev/dev-site"), 2101 and 2201 their content
#   30-39   new pages, their mirrors' content in 40-49
#   50-59   new pages, their mirrors' content in 60-69
#
# and the next pages take 70-79, then 90-99. "GeneratedLegacyScenarioTest"
# fails on a uid the composed instance set declares twice.
#
# A declared "id" is a suggestion to DataHandler, honoured for an admin backend
# user only - which is why "data-factory:import" refuses to run as anybody
# else. A record without one would not get an auto increment uid either, but
# one from a counter starting at 10000, so nothing here relies on that.
#
# The uids are what the rest of the repository points at: the committed site
# configurations of the development instances name root page 1, the file
# references in "config.yml" name the records they hang on, the "shortcut"
# element names "tt_content_601", the link fields name "t3://page?uid=2", and
# the functional tests assert against pages 1 to 10.
#
# RELATIONS
#
# An inline relation needs no construct of its own. The parent writes the
# comma separated list of its children's declared ids into its relation field,
# the children are records of their own on the same page, and DataHandler
# resolves that list exactly like a backend form submit - writing "uid_foreign",
# "tablename" and "sorting_foreign" from the TCA of the parent field. Their
# order is the order of that list.
#
# "hidden: 0" sits on the wildcard entity and nowhere else. The "pages" TCA
# defaults the column to 1, so a page written without it exists and renders
# nothing. It must not be repeated on a declared entity: the wildcard is merged
# into each of them with array_merge_recursive(), so a key on both sides
# becomes the list [0, 0] and reaches the database as the string "Array".
entitySettings:
  '*':
    nodeColumnName: 'pid'
    columnNames: {id: 'uid'}
    defaultValues: {pid: 0, hidden: 0}
  page:
    isNode: true
    tableName: 'pages'
    parentColumnName: 'pid'
    defaultValues: {doktype: 1}
  content:
    tableName: 'tt_content'
  listItem:
    tableName: 'tx_theme_list_item'

entities:
  page:
    - self:
          id: 1
          title: 'Theme demo'
          slug: '/'
          is_siteroot: 1
          # "backend_layout" is an ordinary field of the record: everything a
          # scenario declares is written as it stands. The identifiers are the
          # ones registered in "Configuration/PageTsConfig/BackendLayouts".
          #
          # A site root is where the footer columns are conventionally edited,
          # which is what the "start" layout offers over "content".
          backend_layout: 'start'
      entities:
        content:
          - self:
                id: 101
                CType: 'header'
                header: 'A frontend to look at'
                header_layout: 1
          - self:
                id: 102
                CType: 'text'
                header: 'What this is'
                header_layout: 2
                bodytext: |
                  <p>This page tree is seeded from a definition in the repository, so a
                  development instance can be rebuilt from nothing without clicking a
                  page tree together by hand.</p>
                  <p>The navigation holds the sections of the showcase: the
                  <a href="t3://page?uid=5">content elements</a>, one page per
                  element with its variants; the
                  <a href="t3://page?uid=2">typography</a>, from rich text and
                  elements; the <a href="t3://page?uid=171">page layouts</a>, one
                  wireframe page per backend layout; the
                  <a href="t3://page?uid=113">examples</a>, whole pages composed
                  from the elements above; and the
                  <a href="t3://page?uid=9">styleguide</a>, which renders every
                  component of the library, with the
                  <a href="t3://page?uid=10">form showcase</a>, a request form put
                  together from the form components alone.</p>
          # --- The footer of the whole tree ---------------------------------
          #
          # colPos 11 to 14 are the four footer columns of the "start" layout
          # and colPos 10 is the meta row under them. Nothing else in the tree
          # fills them: "lib.content.footer1" to "footer4" and
          # "lib.content.footermeta" carry "slide = -1" - on the object, not
          # inside "select" - so a page below
          # this one walks up the rootline and finds these five elements
          # ("docs/architecture/page-rendering.md"). Seeded once here, they are
          # the footer of all fifty-eight pages - and seeding them here is the
          # only thing that demonstrates the slide at all.
          #
          # Appended after 102 rather than inserted between the two: the file
          # references of "config.yml" name their record by uid, and an insert
          # would move every uid after it without moving them.
          #
          # The four columns mirror the "Footer - columns" specimen of the
          # styleguide, which draws the same arrangement from Fluid: a short
          # text, a menu, a text, and a row of platform links. Nothing here
          # links with a bare "#c<uid>" fragment - the mirror generator rewrites
          # a "t3://page" link and the anchor of one, and a fragment written by
          # hand would point into the wrong tree.
          - self:
                id: 103
                colPos: 11
                CType: 'text'
                header: 'About'
                header_layout: 2
                bodytext: |
                  <p>A theme built to be read, in a repository built to be reviewed.
                  Every decision it makes is written down next to the code that makes
                  it.</p>
          - self:
                id: 104
                colPos: 12
                CType: 'menu_pages'
                header: 'Sections'
                header_layout: 2
                pages: '5,2,171,113'
          - self:
                id: 105
                colPos: 13
                CType: 'text'
                header: 'Reference'
                header_layout: 2
                bodytext: |
                  <p>The <a href="t3://page?uid=9">styleguide</a> renders every
                  component straight from Fluid, the
                  <a href="t3://page?uid=10">form showcase</a> puts a request form
                  together from the form components alone, and the
                  <a href="t3://page?uid=153">cheatsheet</a> gathers every element
                  on one page.</p>
          - self:
                id: 106
                colPos: 14
                CType: 'theme_sociallinks'
                header: 'Elsewhere'
                header_layout: 2
                tx_theme_list_items: '700,701,702'
          # The meta row: one line under the columns, with no heading of its
          # own - "header_layout: 100" is "do not render the header", see
          # "Partials/ContentElement/Header.html".
          - self:
                id: 107
                colPos: 10
                CType: 'text'
                header: 'Footer meta'
                header_layout: 100
                bodytext: |
                  <p>Seeded from
                  <code>Configuration/DataFactory/theme-demo/</code>. This row and the
                  four columns above it are edited once, on the
                  <a href="t3://page?uid=1">site root</a>, and every page below it
                  renders them: the five footer slots are the only content objects of
                  the theme that slide down the rootline.</p>
        # The three platform links of the "Elsewhere" column, uid 106. A
        # relation is not a containment: these are ordinary rows of
        # "tx_theme_list_item" on this page, and only the relation column
        # DataHandler writes ties them to the element. 700 and up, because
        # the list item uids of the showcase run to 677 and the mirror of a
        # row takes its uid plus 1000.
        listItem:
          - self:
                id: 700
                link: 'https://mastodon.example/@theme'
                link_label: 'Mastodon'
                brand_icon: 'mastodon'
          - self:
                id: 701
                link: 'https://github.example/theme'
                link_label: 'GitHub'
                brand_icon: 'github'
          - self:
                id: 702
                link: 'mailto:hello@example.org'
                link_label: 'Send an email'
      children:
        - self:
              id: 2
              title: 'Typography'
              slug: '/typography'
              backend_layout: 'content'
          entities:
            content:
              - self:
                    id: 201
                    CType: 'header'
                    header: 'Typography'
                    header_layout: 1
              - self:
                    id: 202
                    CType: 'text'
                    header: 'Running text'
                    header_layout: 2
                    bodytext: |
                      <p>A paragraph of running text, so the theme has something to set
                      in its body font. It carries <strong>bold</strong> and
                      <em>emphasised</em> words and a <a href="t3://page?uid=1">link</a>, which are
                      the three inline cases a stylesheet has to answer for.</p>

              # The appearance fields of the core "Appearance" tab and of the
              # header palette, one band each, so the four bands the theme
              # adds to "frame_class" can be looked at next to plain running
              # text. "frame_class", "space_*_class", "header_position" and
              # "tx_theme_header_style" become modifiers in
              # "Layouts/ContentElement.html" and
              # "Partials/ContentElement/Header.html"; the page TSconfig in
              # "Configuration/PageTsConfig/ContentElementAppearance.tsconfig"
              # offers exactly these values in the form.
              - self:
                    id: 203
                    CType: 'text'
                    header: 'A surface band, header centred'
                    header_layout: 2
                    header_position: 'center'
                    frame_class: 'surface'
                    space_before_class: 'large'
                    bodytext: |
                      <p>The frame "Surface band" fills the element with the surface
                      colour and draws the hairline around it. The header is centred,
                      and the space before the element is "large".</p>
              - self:
                    id: 204
                    CType: 'text'
                    header: 'A raised band, header at the end, looking like heading 4'
                    header_layout: 2
                    header_position: 'right'
                    tx_theme_header_style: 'h4'
                    frame_class: 'raised'
                    bodytext: |
                      <p>The raised surface is white in the light appearance, so the
                      hairline is what draws this band there. The header is an h2 set
                      in the look of heading 4.</p>
              - self:
                    id: 205
                    CType: 'text'
                    header: 'An accent band, header in the display size'
                    header_layout: 2
                    tx_theme_header_style: 'display'
                    frame_class: 'accent'
                    bodytext: |
                      <p>A tint of the primary accent of the active palette, with a
                      <a href="t3://page?uid=3">link to the media page</a> in it:
                      switch the palette, and the tint follows it.</p>
              - self:
                    id: 206
                    CType: 'text'
                    header: 'An inverse band, header at the start'
                    header_layout: 2
                    header_position: 'left'
                    frame_class: 'inverse'
                    space_after_class: 'extra-large'
                    bodytext: |
                      <p>The page in the other appearance: dark on a light page, light
                      on a dark one, with every colour of the theme turned with it -
                      the <a href="t3://page?uid=1">link to the start page</a> as well.
                      The space after the element is "extra large".</p>

          # The typography section: the rich text path, from records. The
          # styleguide (uid 9) shows the same components as literal markup;
          # these pages prove that a record reaches them. Seeded "bodytext" is
          # written through DataHandler like a backend save, so the RTE
          # processing of the installation applies to it - with the theme's
          # preset, everything below survives - but it never went through
          # CKEditor, which is why it holds more than the toolbar offers.
          # The first element of each page says so.
          children:
            - self:
                  id: 52
                  title: 'Text'
                  slug: '/typography/text'
                  backend_layout: 'content'
              entities:
                content:
                  - self:
                        id: 5201
                        CType: 'header'
                        header: 'Text'
                        header_layout: 1
                  - self:
                        id: 5202
                        CType: 'text'
                        bodytext: |
                          <p class="theme-lead">Running text, headings inside it, the inline
                          semantics and the alignments of the rich text editor - all from
                          one text element each.</p>
                          <p>The rich text of these pages is written into the database the
                          way a backend save writes it, so the processing of the rich text
                          preset has run over it. It has not been typed into the editor:
                          several things here need its source view.</p>
                  - self:
                        id: 5203
                        CType: 'text'
                        header: 'Headings inside the text'
                        header_layout: 2
                        bodytext: |
                          <p>The header of the element is its heading 2. The rich text
                          continues the outline below it.</p>
                          <h3>A heading 3 inside the text</h3>
                          <p>The editor offers heading 2 and heading 3, so a text can carry
                          sections of its own without an element per section.</p>
                          <h3>A second heading 3, long enough to wrap onto a second line at
                          the width of the content column</h3>
                          <p>A long heading is balanced over its lines, so the last line is
                          not a single orphaned word.</p>
                  - self:
                        id: 5204
                        CType: 'text'
                        header: 'Inline semantics'
                        header_layout: 2
                        bodytext: |
                          <p><strong>Strong importance</strong> and <em>stress emphasis</em>,
                          <mark>a marked passage</mark>, <small>small print</small>,
                          <s>no longer accurate</s>, <del>deleted</del> and <ins>inserted</ins>
                          text, H<sub>2</sub>O and E = mc<sup>2</sup>.</p>
                          <p>An <abbr title="Rich Text Editor">RTE</abbr> writes
                          <code>&lt;p&gt;</code> around a paragraph; <kbd>Ctrl</kbd> +
                          <kbd>B</kbd> makes a word strong. A <dfn>content element</dfn> is
                          a record rendered into a column of a page. <q>A quotation inside
                          a sentence</q>, as <cite>the style guide</cite> puts it, gets its
                          quotation marks from the language.</p>
                  - self:
                        id: 5205
                        CType: 'text'
                        header: 'Alignment'
                        header_layout: 2
                        bodytext: |
                          <p class="theme-text--start">Aligned to the start of the line, which
                          is where every paragraph starts anyway.</p>
                          <p class="theme-text--center">Centred, for a short line that stands
                          on its own.</p>
                          <p class="theme-text--end">Aligned to the end of the line.</p>
                          <p class="theme-text--justify">Justified: both edges of the column
                          are straight, and the spaces between the words stretch to make them
                          so. Without hyphenation the gaps grow on a narrow column, which is
                          why the theme leaves justification to the paragraph that asks for
                          it.</p>
                  - self:
                        id: 5206
                        CType: 'text'
                        header: 'Language and direction'
                        header_layout: 2
                        bodytext: |
                          <p lang="de">Ein deutscher Absatz mit langen Zusammensetzungen wie
                          Inhaltselementdarstellung und Seitenbaumkonfigurationsdatei: mit der
                          Sprache am Absatz trennt der Browser sie am Zeilenende.</p>
                          <p dir="rtl" lang="ar">هذه فقرة قصيرة باللغة العربية، تبدأ من
                          اليمين وتنتهي في اليسار.</p>

            - self:
                  id: 53
                  title: 'Lists'
                  slug: '/typography/lists'
                  backend_layout: 'content'
              entities:
                content:
                  - self:
                        id: 5301
                        CType: 'header'
                        header: 'Lists'
                        header_layout: 1
                  - self:
                        id: 5302
                        CType: 'text'
                        header: 'Lists inside the text'
                        header_layout: 2
                        bodytext: |
                          <p>The lists of the rich text keep the markers of the element
                          baseline, nested lists included:</p>
                          <ul>
                            <li>A first item</li>
                            <li>A second item, holding a list of its own
                              <ul>
                                <li>A nested item</li>
                                <li>A second nested item
                                  <ul><li>A third level</li></ul>
                                </li>
                              </ul>
                            </li>
                            <li>A last item</li>
                          </ul>
                          <ol>
                            <li>A first step</li>
                            <li>A second step, with sub steps
                              <ol><li>A sub step</li><li>Another sub step</li></ol>
                            </li>
                            <li>A last step</li>
                          </ol>
                  - self:
                        id: 5303
                        CType: 'text'
                        header: 'The list component inside the text'
                        header_layout: 2
                        bodytext: |
                          <p>The class of a list is kept by the rich text processing, so a
                          list in the source view can be one of the list component:</p>
                          <ul class="theme-list theme-list--check">
                            <li>Check marks, from the source view</li>
                            <li>The same component the bullet list element renders</li>
                          </ul>
                          <ul class="theme-list theme-list--columns-2">
                            <li>Header</li><li>Text</li><li>Text &amp; Images</li>
                            <li>Text &amp; Media</li><li>Images</li><li>Bullet list</li>
                            <li>Table</li><li>File links</li>
                          </ul>
                  # The element, rather than rich text: see "/elements/core/bullets"
                  # (uid 35) for every layout.
                  - self:
                        id: 5304
                        CType: 'bullets'
                        header: 'A definition list from the bullet list element'
                        header_layout: 2
                        bullets_type: 2
                        bodytext: |
                          Unstyled|No marker and no indent
                          Check|A check mark in front of every item
                          Icon|An icon of the set in front of every item
                          Columns|The items flow into two or three columns
                          Divided|A hairline between the rows
                  - self:
                        id: 5305
                        CType: 'text'
                        bodytext: '<p>Every layout of the bullet list element is on its <a href="t3://page?uid=35">own page</a>.</p>'

            - self:
                  id: 54
                  title: 'Tables'
                  slug: '/typography/tables'
                  backend_layout: 'content'
              entities:
                content:
                  - self:
                        id: 5401
                        CType: 'header'
                        header: 'Tables'
                        header_layout: 1
                  # A table of the rich text keeps its classes through the
                  # parsing function of the frontend, but is not wrapped in the
                  # scroll region the table element renders - which is why the
                  # table element is the way to a wide table.
                  - self:
                        id: 5402
                        CType: 'text'
                        header: 'A table inside the text'
                        header_layout: 2
                        bodytext: |
                          <p>A table of the rich text, with the classes of the table
                          component written in the source view. It has no scroll region of
                          its own, so it has to fit the column.</p>
                          <table class="theme-table theme-table--striped">
                            <caption>The two appearances</caption>
                            <thead><tr><th scope="col">Appearance</th><th scope="col">Background</th><th scope="col">Text</th></tr></thead>
                            <tbody>
                              <tr><th scope="row">Light</th><td>A near white</td><td>A near black</td></tr>
                              <tr><th scope="row">Dark</th><td>A near black</td><td>A near white</td></tr>
                            </tbody>
                          </table>
                  - self:
                        id: 5403
                        CType: 'table'
                        header: 'The table element, with a header column and a footer'
                        header_layout: 2
                        table_class: 'compact'
                        table_caption: 'Contrast of the text colours on the page background'
                        table_delimiter: 124
                        table_enclosure: 0
                        table_header_position: 2
                        table_tfoot: 1
                        bodytext: |
                          Primary text|The body copy|at least 7:1
                          Secondary text|Leads and captions|at least 4.5:1
                          Muted text|Dates and hints|at least 4.5:1
                          Every text colour|Holds AA on its surface|4.5:1
                  - self:
                        id: 5404
                        CType: 'text'
                        bodytext: '<p>Every class of the table element is on its <a href="t3://page?uid=36">own page</a>.</p>'

            - self:
                  id: 55
                  title: 'Quotes and code'
                  slug: '/typography/quotes-and-code'
                  backend_layout: 'content'
              entities:
                content:
                  - self:
                        id: 5501
                        CType: 'header'
                        header: 'Quotes and code'
                        header_layout: 1
                  - self:
                        id: 5502
                        CType: 'text'
                        header: 'A quotation inside the text'
                        header_layout: 2
                        bodytext: |
                          <p>A block quotation of the rich text, set apart from the running
                          text around it:</p>
                          <blockquote><p>Programs must be written for people to read, and only
                          incidentally for machines to execute.</p></blockquote>
                          <p>- <cite>Abelson and Sussman, Structure and Interpretation of
                          Computer Programs</cite></p>
                  # The testimonial element renders the quote component with its
                  # attribution; the name is "header", the role "subheader".
                  - self:
                        id: 5503
                        CType: 'theme_testimonial'
                        header: 'Harold Abelson and Gerald Jay Sussman'
                        subheader: 'Preface to the first edition, 1985'
                        bodytext: 'Programs must be written for people to read, and only incidentally for machines to execute.'
                  - self:
                        id: 5504
                        CType: 'text'
                        header: 'Preformatted text inside the text'
                        header_layout: 2
                        bodytext: |
                          <p>The editor offers "Pre-Formatted Text" as a heading option. It
                          keeps line breaks and spaces, and scrolls rather than wraps:</p>
                          <pre><code>tt_content.bullets =&lt; lib.contentElement
                          tt_content.bullets.templateName = ContentElements/Bullets</code></pre>
                  # The code block component needs a figure, a caption and a
                  # scroll region with a label - markup for the HTML element,
                  # which renders it untouched.
                  - self:
                        id: 5505
                        CType: 'html'
                        header: 'A code block with its file name (name only, not rendered)'
                        bodytext: |
                          <h2 class="theme-content-element__heading">A code block with its file name</h2>
                          <figure class="theme-code">
                              <figcaption class="theme-code__caption">
                                  <span class="theme-code__filename">config/sites/demo/config.yaml</span>
                                  <span class="theme-code__language">YAML</span>
                              </figcaption>
                              <pre class="theme-code__block" role="region" tabindex="0" aria-label="config/sites/demo/config.yaml"><code>base: 'https://theme.example.com/'
                          rootPageId: 1
                          dependencies:
                            - sbuerk/theme-extension-development</code></pre>
                          </figure>

            # A long form article: every component of the section in one
            # reading flow, the way a page of a site uses them.
            - self:
                  id: 56
                  title: 'Article'
                  slug: '/typography/article'
                  # The one page of the typography section with a sidebar, and
                  # the reason is the table of contents: the "HMENU" with
                  # "sectionIndex = 1" of "Configuration/TypoScript/Navigation.typoscript"
                  # is rendered by "Partials/Page/Sidebar.html", which only the
                  # "content_sidebar" layout defines a column for. A long text
                  # is where a reader wants one; its sibling pages are short
                  # enough to read straight through and keep "content".
                  backend_layout: 'content_sidebar'
              entities:
                content:
                  - self:
                        id: 5601
                        CType: 'header'
                        header: 'How a content element reaches the page'
                        header_layout: 1
                        # The title of the article, out of the table of
                        # contents of the article: with it in, the first entry
                        # of "On this page" is the page the reader is already
                        # looking at. This is the core field an editor sets on
                        # the Appearance tab, seeded to show what it does.
                        sectionIndex: 0
                  # The byline. An "html" element, because ".theme-byline" is
                  # markup with no content element of its own - a site that
                  # publishes articles would give it one, a theme showing the
                  # component does not need to. "html" renders "bodytext" raw
                  # and shows no header, which is what this needs.
                  - self:
                        id: 5602
                        CType: 'html'
                        header: 'Byline (not visible in the frontend)'
                        sectionIndex: 0
                        bodytext: |
                          <p class="theme-byline">
                              <span class="theme-byline__item">By <span class="theme-byline__author">The theme team</span></span>
                              <time class="theme-byline__item" datetime="2026-09-20">20 September 2026</time>
                              <span class="theme-byline__item">Six minutes</span>
                          </p>
                  - self:
                        id: 5603
                        CType: 'text'
                        bodytext: |
                          <p class="theme-lead">An editor fills in a form and saves it. A
                          moment later a visitor reads a paragraph. Between the two lie a
                          database row, a few lines of configuration and a template - and
                          each of them decides something about what the visitor sees.</p>
                          <p>This article follows one element along that way. It is also a
                          specimen: a long text, set with the components a site package gets
                          from the theme, so the rhythm of headings, paragraphs, lists,
                          figures, tables and code can be read as a whole rather than one
                          specimen at a time.</p>
                  - self:
                        id: 5604
                        CType: 'text'
                        header: 'The record'
                        header_layout: 2
                        bodytext: |
                          <p>Everything starts as a row of the table <code>tt_content</code>.
                          Its type, the CType, decides which fields the form shows and which
                          rendering the frontend picks. The fields an editor fills in are
                          plain columns of that row: a header, a text, a layout, a frame.</p>
                          <h3>What the form does not show</h3>
                          <p>Some columns are there without a field in the form. The page the
                          element belongs to, its position in the column and its language are
                          written by the backend itself. They matter just as much: a content
                          element is rendered because a page asks for the content of one of
                          its columns<sup class="theme-footnote-ref" id="fnref1"><a href="#fn1">1</a></sup>,
                          not because the element exists.</p>
                  - self:
                        id: 5605
                        CType: 'textpic'
                        header: 'The frame'
                        header_layout: 2
                        imageorient: 17
                        imagecols: 1
                        bodytext: |
                          <p>Every element is rendered through one frame, the layout
                          <code>ContentElement</code> of the theme. It writes the wrapper
                          with the anchor of the element, the CType as a modifier and as an
                          attribute, and the modifiers of the appearance fields: the band of
                          the frame, the space before and after.</p>
                          <p>The frame is also what the outlines of the development mode
                          draw. Switch them on in the display settings, and every element
                          of this article shows its boundary and its CType - the image
                          beside this text belongs to the same element as the text itself.</p>
                          <p>The image is placed in the text, at the end of the line. The
                          gallery processor of the core computes its width from the column
                          and the number of columns, and the theme floats it, so this text
                          flows around it and continues under it once it is past.</p>
                  - self:
                        id: 5606
                        CType: 'bullets'
                        header: 'What the frame reads'
                        header_layout: 2
                        bullets_type: 0
                        layout: 1
                        bodytext: |
                          The frame: default, no frame, or one of four bands
                          The space before and after the element
                          The alignment and the look of the header
                          The CType, for the modifier and the outline
                  - self:
                        id: 5607
                        CType: 'text'
                        header: 'The template'
                        header_layout: 2
                        bodytext: |
                          <p>Inside the frame, the template of the CType renders what is
                          particular to it. A text element renders its header and its rich
                          text; a table element renders a table from the lines of its text
                          field, split by a data processor before the template sees them.</p>
                          <blockquote><p>A template receives data it can render and never
                          computes what a processor could hand it.</p></blockquote>
                          <p>That division is the reason a table element and a table of the
                          rich text look the same: both end in the same component, one from
                          a processor, the other from the source view of the
                          editor<sup class="theme-footnote-ref" id="fnref2"><a href="#fn2">2</a></sup>.</p>
                  - self:
                        id: 5608
                        CType: 'table'
                        header: 'The fields of a table element'
                        header_layout: 3
                        table_class: 'striped'
                        table_caption: 'What the table element reads, and what it does with it'
                        table_delimiter: 124
                        table_enclosure: 0
                        table_header_position: 1
                        bodytext: |
                          Field|Holds|Read by
                          bodytext|The rows, one per line|TableProcessor
                          table_delimiter|The character code of the column separator|TableProcessor
                          table_header_position|Header row, header column, or none|TableProcessor
                          table_class|The look of the table|Table.html
                  # Out of the table of contents, like the byline and the
                  # notes and for the same reason: "html" renders no header,
                  # so an entry for this element would name a heading that is
                  # nowhere on the page. Moving the article to a layout with a
                  # table of contents is what made that visible.
                  - self:
                        id: 5609
                        CType: 'html'
                        header: 'The TypoScript of the bullet list (name only, not rendered)'
                        sectionIndex: 0
                        bodytext: |
                          <figure class="theme-code">
                              <figcaption class="theme-code__caption">
                                  <span class="theme-code__filename">Configuration/TypoScript/ContentElements.typoscript</span>
                                  <span class="theme-code__language">TypoScript</span>
                              </figcaption>
                              <pre class="theme-code__block" role="region" tabindex="0" aria-label="Configuration/TypoScript/ContentElements.typoscript"><code>tt_content.bullets =&lt; lib.contentElement
                          tt_content.bullets {
                              templateName = ContentElements/Bullets
                          }</code></pre>
                          </figure>
                  - self:
                        id: 5610
                        CType: 'text'
                        header: 'What is left to the editor'
                        header_layout: 2
                        bodytext: |
                          <p>The editor chooses the type, fills in the fields and picks from
                          the values the form offers. The theme offers only values it
                          renders: a frame it does not draw is not in the list, and a field
                          it does not read is not in the form.</p>
                          <p>Everything else - the markup, the spacing, the colours in both
                          appearances - follows from the theme, which is what lets a page of
                          many elements read as one page.</p>
                  # The notes the two references above point at, and a link
                  # back to the top of the page. "linkToTop" is seeded on the
                  # card group page as well (element 9005). What is new on this
                  # page is "sectionIndex", which no element of the set carried
                  # before it.
                  #
                  # Out of the table of contents: it is the end of the page,
                  # not a section of it, and the reader arrives there by
                  # following a reference rather than by picking it from a
                  # list.
                  - self:
                        id: 5611
                        CType: 'html'
                        header: 'Footnotes (not visible in the frontend)'
                        sectionIndex: 0
                        linkToTop: 1
                        bodytext: |
                          <aside class="theme-footnotes" aria-labelledby="article-footnotes-heading">
                              <h2 class="theme-footnotes__heading" id="article-footnotes-heading">Notes</h2>
                              <ol class="theme-footnotes__list">
                                  <li class="theme-footnotes__item" id="fn1">
                                      1. The column is the <code>colPos</code> of the element, and the backend
                                      layout of the page decides which columns exist at all.
                                      <a class="theme-footnotes__backlink" href="#fnref1" aria-label="Back to reference 1"></a>
                                  </li>
                                  <li class="theme-footnotes__item" id="fn2">
                                      2. Which is also why an element moved into a column the layout of its
                                      page does not have disappears from the page without being deleted.
                                      <a class="theme-footnotes__backlink" href="#fnref2" aria-label="Back to reference 2"></a>
                                  </li>
                              </ol>
                          </aside>

            # A right-to-left page. The direction comes from a wrapper on each
            # block, not from a site language: a language is a property of the
            # installation, it needs a site configuration and a translation of
            # every record, and neither travels with a seed set. A wrapper is
            # what an editor has as well - "dir" is an allowed attribute of the
            # rich text preset - and it puts both directions on one page, which
            # is what makes a difference between them visible at all.
            #
            # The footnote ids below are names of their own ("rtl-fn1"), never
            # a content element anchor ("#c15204"). A raw "#c<uid>" in a value
            # is a pointer "Build/Scripts/generateLegacyScenario.php" does not
            # recognise: it would reach the mirror unrewritten and link back
            # into the "/" tree, which is what
            # "LegacyDeliveryTest::noPageLinkOfTheLegacyTreeLeavesIt" is for.
            #
            # Three of the four wrappers are in "html" elements (15203,
            # 15204, 15206), which render "bodytext" raw, and one is rich text
            # (15205), which goes through "lib.parseFunc_RTE" and its
            # sanitizer. The split is not arbitrary: each raw element carries
            # something the theme's rich text preset cannot write - a check
            # list and a table component, a footnote block, a "bdi" - while
            # 15205 is the proof that "dir" and "lang" survive the path an
            # editor's own text takes ("allowAttributes" of the imported
            # "Processing.yaml" lists both).
            #
            # What it costs is the components a record builds rather than
            # writes: a notice, a carousel or an embed is markup the template
            # produces, and nothing can wrap that in a "div" from a field. The
            # last element of the page says so, and "/styleguide#direction"
            # shows those side by side instead.
            - self:
                  id: 152
                  title: 'Right to left'
                  slug: '/typography/right-to-left'
                  backend_layout: 'content'
              entities:
                content:
                  - self:
                        id: 15201
                        CType: 'header'
                        header: 'Right to left'
                        header_layout: 1
                        sectionIndex: 0
                  - self:
                        id: 15202
                        CType: 'text'
                        bodytext: |
                          <p class="theme-lead">Every spacing, border and float of the theme is
                          written as a logical property, and every glyph that points somewhere is
                          mirrored by a rule of its own. This page is where that is looked at: the
                          same components as everywhere else, in a right-to-left context.</p>
                          <p>The Arabic below is a specimen rather than a translation, and each
                          block is glossed in English underneath, so a reader who does not read
                          Arabic can still see which edge a line starts at. What is demonstrated is
                          the direction, not the copy.</p>
                  - self:
                        id: 15203
                        CType: 'html'
                        header: 'Running text, a list and a quotation (not visible in the frontend)'
                        bodytext: |
                          <h2>Running text, a list and a quotation</h2>
                          <div dir="rtl" lang="ar">
                              <p>النص العربي يبدأ من اليمين.</p>
                              <p>هذه قائمة قصيرة:</p>
                              <ul>
                                  <li>العنصر الأول</li>
                                  <li>العنصر الثاني</li>
                                  <li>العنصر الثالث</li>
                              </ul>
                              <blockquote><p>اقتباس قصير.</p></blockquote>
                          </div>
                          <p><small>"Arabic text starts from the right.", "This is a short list:",
                          the first, second and third item, and "A short quotation." Nothing here
                          carries a class: the list marker, the indent of the quotation and the edge
                          every line starts at come from the element baseline.</small></p>
                  - self:
                        id: 15204
                        CType: 'html'
                        header: 'Components (not visible in the frontend)'
                        bodytext: |
                          <h2>Components</h2>
                          <div dir="rtl" lang="ar">
                              <p>العنصر الأول<sup class="theme-footnote-ref" id="rtl-fnref1"><a href="#rtl-fn1">1</a></sup></p>
                              <ul class="theme-list theme-list--check">
                                  <li>العنصر الأول</li>
                                  <li>العنصر الثاني</li>
                              </ul>
                              <p class="theme-byline">
                                  <span class="theme-byline__item">العنصر الأول</span>
                                  <span class="theme-byline__item">العنصر الثاني</span>
                              </p>
                              <div class="theme-table-wrapper" tabindex="0" role="region" aria-label="A table in a right-to-left context">
                                  <table class="theme-table theme-table--striped">
                                      <caption class="theme-table__caption">العنصر الأول</caption>
                                      <thead>
                                          <tr><th scope="col">العنصر الأول</th><th scope="col">العنصر الثاني</th></tr>
                                      </thead>
                                      <tbody>
                                          <tr><td>العنصر الأول</td><td>العنصر الثاني</td></tr>
                                          <tr><td>العنصر الأول</td><td>العنصر الثاني</td></tr>
                                      </tbody>
                                  </table>
                              </div>
                              <div class="theme-footnotes">
                                  <ol class="theme-footnotes__list">
                                      <li class="theme-footnotes__item" id="rtl-fn1">
                                          1. العنصر الأول
                                          <a class="theme-footnotes__backlink" href="#rtl-fnref1" aria-label="Back to reference 1"></a>
                                      </li>
                                  </ol>
                              </div>
                          </div>
                          <p><small>The superscript reference, the check mark of the list, the rule
                          between two byline items, the caption and the cells of the table and the
                          hanging indent of the note all sit at the right edge, and none of them has
                          a rule for it: they are placed with <code>inset-inline-start</code>,
                          <code>border-inline-start</code>, <code>padding-inline-start</code> and
                          <code>text-align: start</code>. The arrow back from the note is mirrored,
                          because it points somewhere.</small></p>
                  - self:
                        id: 15205
                        CType: 'text'
                        header: 'A link that leaves the site'
                        header_layout: 2
                        bodytext: |
                          <p>The marker after a link to another site is built by the theme rather
                          than written into the text, which is why this block is rich text and not
                          raw markup: the marker only exists once TYPO3 has built the link.</p>
                          <div dir="rtl" lang="ar">
                              <p><a href="https://example.org/">العنصر الأول</a></p>
                          </div>
                          <p><small>The arrow points up and to the left, because the text it
                          belongs to runs the other way. The same rule turns the arrow back from a
                          footnote and the two chevrons of a carousel around, and the
                          <em>Reading direction</em> section of the styleguide shows all of them
                          side by side.</small></p>
                  # Raw markup, and it has to be. "bdi" is in the allow list of
                  # the frontend sanitizer
                  # ("CommonBuilder::createBasicTags()") but *not* in the
                  # "allowTags" of "EXT:rte_ckeditor/Configuration/RTE/Processing.yaml",
                  # which the theme's preset imports - so the save
                  # transformation strips the tag on the way into the database
                  # and a rich text element could not carry this specimen at
                  # all. It is the concrete case of "a seeded value can show
                  # more than an editor can produce", which the lead of the
                  # page says. "RichTextPresetTest" pins the gap.
                  - self:
                        id: 15206
                        CType: 'html'
                        header: 'Numbers and Latin in a right-to-left line (not visible in the frontend)'
                        bodytext: |
                          <h2>Numbers and Latin in a right-to-left line</h2>
                          <div dir="rtl" lang="ar">
                              <p>TYPO3 <bdi>العنصر الأول</bdi> 13.4</p>
                          </div>
                          <p><small>Direction is resolved per run of text, not per element, so the
                          browser keeps the Latin word and the version number running the other way
                          by itself. <code>bdi</code> is what says where a run of user data begins,
                          so a name starting with a strong right-to-left character cannot reorder
                          the sentence around it.</small></p>
                  - self:
                        id: 15207
                        CType: 'text'
                        header: 'What this page does not cover'
                        header_layout: 2
                        bodytext: |
                          <p>The page chrome is not in the wrapper. The site header, the main
                          navigation, the breadcrumb and the footer are rendered once per page and
                          stay left to right here, because the page itself is an English one. A site
                          that is Arabic sets the direction on the <code>html</code> element through
                          its site language, and everything below it then follows the same rules
                          this page shows.</p>
                          <p>Neither are the components a record builds rather than writes: a
                          notice, a carousel or an embed is markup a template produces, and no field
                          of the element can wrap that in a <code>div</code>. The styleguide has
                          them, in a section of its own.</p>
                          <p>An arrow an editor puts into a button label is content rather than
                          furniture of the theme, and the theme does not turn it around. Only the
                          glyphs the theme draws itself are mirrored.</p>

        - self:
              id: 3
              title: 'Media'
              slug: '/media'
              backend_layout: 'content'
          entities:
            content:
              - self:
                    id: 301
                    CType: 'header'
                    header: 'Media'
                    header_layout: 1
              # The image is attached in "config.yml", which names this uid.
              - self:
                    id: 302
                    CType: 'image'
                    header: 'A single image'
                    header_layout: 2
              # The gallery layout is driven by the TCA fields of the element,
              # not by the template: "imagecols" is what an editor changes in
              # the backend to get a second column.
              - self:
                    id: 303
                    CType: 'image'
                    header: 'Two images, two columns'
                    header_layout: 2
                    imagecols: 2

        # The one page that declares no "backend_layout" at all, and it stays
        # that way on purpose: it is the only page in the tree that reaches the
        # hard coded "default" fallback of "PageLayoutResolver", so that path
        # has no other coverage. Asserted by "ShowcaseTreeTest".
        - self:
              id: 4
              title: 'Empty page'
              slug: '/empty'
              # Out of the menus: it is a fixture of the layout fallback, not
              # a page a reviewer navigates to. The header would hold it - the
              # acceptance test of the header row holds seven top level
              # entries at 1280 pixels - but a reviewer has no reason to
              # open it from the menu. Reached by URL and by the links of the
              # theme elements on page 8.
              nav_hide: 1

        # The showcase branch. Its three children each demonstrate one family of
        # content elements, and between them they carry every CType this theme
        # renders - which "ShowcaseTreeTest" holds them to, by reading the
        # TypoScript rather than a list kept in the test.
        - self:
              id: 5
              title: 'Elements'
              slug: '/elements'
              backend_layout: 'content'
          entities:
            content:
              - self:
                    id: 501
                    CType: 'header'
                    header: 'Elements'
                    header_layout: 1
              - self:
                    id: 502
                    CType: 'text'
                    bodytext: |
                      <p>Three pages, one per family: the classic types
                      <em>EXT:frontend</em> registers without supplying a rendering,
                      the eleven menu types, and the types this extension adds itself.
                      Each of them appears on the page of its family, so a single branch
                      of the tree answers what the theme does with it.</p>
                      <p>The theme types with layouts of their own - the heroes, the call
                      to action and the testimonial - also have a page each below the
                      theme elements, showing every layout.</p>
                      <p>Below the classic types, each has a page of its own with its
                      variants, and the <a href="t3://page?uid=51">Frames</a> page shows
                      every value of the Appearance tab, one element each.</p>
          children:
            - self:
                  id: 6
                  title: 'Core elements'
                  slug: '/elements/core'
                  # Read by the "menu_abstract" and "menu_related_pages" elements
                  # on page 7, which list the children of page 5 - this page
                  # among them. Without an abstract the item renders as a bare
                  # link, and without a shared keyword the related-pages menu
                  # comes back empty; both look like the element is broken rather
                  # than like the target page is missing a field.
                  abstract: 'Every classic content type EXT:frontend registers without supplying a rendering for it.'
                  keywords: 'content elements, core'
                  # "content_sidebar" rather than "content", and its sibling
                  # page 8 deliberately does not use it: two pages under one
                  # parent rendering with and without the sub navigation is what
                  # proves the backend layout is resolved per page instead of
                  # inherited down the branch.
                  #
                  # Nothing is seeded into the sidebar column (colPos 1) and
                  # nothing needs to be: "Partials/Page/Sidebar.html" renders the
                  # sub navigation above the "sidebar" slot unconditionally, so
                  # the aside is populated on a page that puts all its content in
                  # "main".
                  backend_layout: 'content_sidebar'
              entities:
                content:
                  # "header" - the whole element is a heading, nothing else.
                  #
                  # The "shortcut" element at the bottom of this page names this
                  # one by its uid: "records" is a plain string column holding
                  # "tt_content_<uid>", so the target's uid has to be known while
                  # the scenario is written.
                  #
                  # "header_layout" is the heading level: 1-5 are <h1>-<h5>, 0
                  # falls back to <h2>, and 100 means "do not display" - see
                  # "Partials/ContentElement/Header.html".
                  - self:
                        id: 601
                        CType: 'header'
                        header: 'Core elements'
                        header_layout: 1

                  # "text" - "bodytext" through "f:format.html", which means
                  # "lib.parseFunc_RTE": links are rewritten by typolink and
                  # lines that are not already wrapped are wrapped in <p>.
                  #
                  # The markup available here is not free-form. This CType's
                  # "bodytext" is declared "enableRichtext", so DataHandler runs
                  # the RTE "db" transformation over it ON SAVE, and which tags
                  # survive depends on the installation. With rte_ckeditor it is
                  # the processing of the rich text preset - the theme's own
                  # imports the core "Processing.yaml", which keeps "code" and
                  # "kbd". Without it, it is "RteHtmlParser::$defaultAllowedTagsList"
                  # (typo3/cms-core, Classes/Html/RteHtmlParser.php), which has
                  # neither. Dropping a tag is not an error and reports nothing;
                  # it is simply not in the row afterwards. So the copy of this
                  # element uses neither, and the "html" element further down is
                  # the one place on this page where they survive in every
                  # installation - its copy says so.
                  - self:
                        id: 602
                        CType: 'text'
                        header: 'What this page is'
                        header_layout: 2
                        bodytext: |
                          <p>Every classic content type this theme renders is on this
                          page exactly once, so a single URL answers what each one
                          looks like and which of its fields the theme actually reads.
                          The copy of each element describes that element.</p>
                          <p>The rendering is defined in
                          <em>Configuration/TypoScript/ContentElements.typoscript</em>.
                          This theme does not depend on <em>fluid_styled_content</em>,
                          so a content type without a branch in that file would render
                          the core's <strong>"no rendering definition"</strong> notice
                          instead of anything at all.</p>
                          <p>Each of them also has a page of its own below this one, in the
                          sub navigation, showing its variants: every orientation of
                          <a href="t3://page?uid=32">Text &amp; Images</a>, every layout of
                          the <a href="t3://page?uid=35">bullet list</a>, every class of the
                          <a href="t3://page?uid=36">table</a> and so on.</p>

                  # "bullets" - "bodytext" is one item per line, split by the
                  # core's own "SplitProcessor" (delimiter LF,
                  # "removeEmptyEntries = 1", so the trailing newline of this
                  # block scalar does not become an empty item).
                  #
                  # "bullets_type" selects the list element: 0 = <ul>, 1 = <ol>,
                  # 2 = <dl>. 0 is also the TCA default; it is written out anyway
                  # so the value the copy below talks about is visible next to it.
                  - self:
                        id: 603
                        CType: 'bullets'
                        header: 'Bullet list'
                        header_layout: 2
                        bullets_type: 0
                        bodytext: |
                          One item per line, with no markup and no delimiter
                          Each line is escaped on output, so a typed tag stays text
                          bullets_type 1 renders the same lines as an ordered list
                          bullets_type 2 renders them as a definition list of terms

                  # "table" - the element whose fields are least like their names.
                  #
                  # "bodytext" is delimiter separated text, one row per line, and
                  # "TableProcessor" (Classes/DataProcessing/TableProcessor.php)
                  # decodes it into header/body/footer rows before the template
                  # sees it. The fields that control the decode store CHARACTER
                  # CODES, not characters:
                  #
                  #   table_delimiter  the column separator, TCA default 124 = "|"
                  #                    (the other offered codes are 59, 44, 58, 9)
                  #   table_enclosure  the quoting character, 0 = none
                  #                    (the other offered codes are 39 and 34)
                  #
                  # 0 for "no enclosure" never reaches PHP as an empty string:
                  # "fgetcsv()" rejects that with a ValueError, so the processor
                  # passes chr(0) instead. That matters for the content here -
                  # with no real enclosure character, no cell below may contain
                  # the delimiter, which is why the first body row spells "124"
                  # out in words instead of showing the character.
                  #
                  # The remaining two are ordinary:
                  #
                  #   table_header_position  0 = none, 1 = first row is <thead>,
                  #                          2 = first cell of every row is a
                  #                              <th scope="row">
                  #   table_tfoot            1 = the last remaining row (after the
                  #                              header row was taken off) becomes
                  #                              <tfoot>
                  #
                  # "cols" and "table_class" exist in the core TCA of this element
                  # and are deliberately not set: the processor pads every row to
                  # the widest one by itself, and the template styles the table
                  # through ".theme-table" rather than a class from the record.
                  - self:
                        id: 604
                        CType: 'table'
                        header: 'Table'
                        header_layout: 2
                        table_caption: 'The five table_* fields, and what this element sets them to'
                        table_delimiter: 124
                        table_enclosure: 0
                        table_header_position: 1
                        table_tfoot: 1
                        bodytext: |
                          Field|What it stores|Value on this element
                          table_delimiter|The character CODE of the column separator|124, a vertical bar
                          table_enclosure|The character CODE of the quoting character, 0 for none|0
                          table_header_position|0 none, 1 first row, 2 first column|1
                          table_tfoot|Whether the last row becomes a table footer|1
                          Decoded by|Classes/DataProcessing/TableProcessor.php|not by Table.html

                  # "textpic" - text plus the core "image" field, laid out by
                  # "GalleryProcessor" from "imageorient" and "imagecols".
                  #
                  # "imageorient" 17 is "in text, right"; the values are 0/1/2
                  # above, 8/9/10 below and 17/18 in text - the processor turns
                  # them into the vertical/horizontal position the gallery partial
                  # renders as modifier classes. Together with "imagecols: 1" this
                  # is deliberately the opposite of the "textmedia" element below,
                  # so the two are distinguishable on the page rather than looking
                  # like one element seeded twice.
                  - self:
                        id: 605
                        CType: 'textpic'
                        header: 'Text & Images'
                        header_layout: 2
                        imageorient: 17
                        imagecols: 1
                        bodytext: |
                          <p>Reads the <em>image</em> field, which the core TCA
                          restricts to images. The gallery is placed by
                          <em>imageorient</em> - 17 here, "in text, right" - and split
                          into <em>imagecols</em> columns, both of them computed by
                          the core's <strong>GalleryProcessor</strong> rather than by
                          the template.</p>

                  # "textmedia" - identical to "textpic" except for the source
                  # field: "assets" allows every "common-media-type", not only
                  # images. Same two processors, and "GalleryProcessor" does not
                  # care which field the files came from.
                  #
                  # "imageorient" 8 is "below, centered", so this is also the one
                  # element on the page where the template puts the body text
                  # before the gallery in the DOM.
                  - self:
                        id: 606
                        CType: 'textmedia'
                        header: 'Text & Media'
                        header_layout: 2
                        imageorient: 8
                        imagecols: 2
                        bodytext: |
                          <p>Reads the <em>assets</em> field instead of
                          <em>image</em>, so a video or an audio file is allowed here
                          where "Text &amp; Images" above would refuse it. With
                          <em>imageorient</em> 8 the media sits below the text and
                          centered, and <em>imagecols</em> 2 puts the two files side
                          by side.</p>

                  # "image" - the same two processors as "textpic" without the
                  # body text. Kept minimal on purpose: the Media page (uid 3)
                  # already demonstrates the gallery settings, and this page only
                  # has to be complete, not to repeat them.
                  - self:
                        id: 607
                        CType: 'image'
                        header: 'Images'
                        header_layout: 2

                  # "uploads" - a file list, not a gallery.
                  #
                  # The fields "Uploads.html" actually reads are all set here:
                  #
                  #   uploads_type          0 = name only, 1 = name and file type
                  #                         icon, 2 = name and thumbnail, the
                  #                         modifiers of ".theme-file-list". 2
                  #                         renders a thumbnail only for files
                  #                         FAL classifies as an image, which an
                  #                         SVG is (image/* maps to
                  #                         FileType::IMAGE), and the icon of the
                  #                         file type for any other.
                  #   filelink_size         shows the byte count
                  #   uploads_description   shows the description of the file
                  #                         REFERENCE - which is why both
                  #                         references in "config.yml" carry one,
                  #                         and why they differ from the ones the
                  #                         same files carry elsewhere on this
                  #                         page.
                  #   filelink_sorting      "FilesProcessor" sorts natively, so
                  #                         this overrides the order the
                  #                         references are declared in - by name
                  #                         ascending, the portrait file first.
                  #                         That is the point of setting it.
                  #
                  # "target" is left at its default (empty): the template passes
                  # it straight into the link, and a demo page has no business
                  # forcing new windows.
                  #
                  # "file_collections" is the second source "FilesProcessor" is
                  # wired to and stays empty: a demonstration of one field does
                  # not justify seeding a "sys_file_collection".
                  - self:
                        id: 608
                        CType: 'uploads'
                        header: 'File links'
                        header_layout: 2
                        uploads_type: 2
                        filelink_size: 1
                        uploads_description: 1
                        filelink_sorting: 'name'
                        filelink_sorting_direction: 'asc'

                  # "html" - "bodytext" straight out, through "f:format.raw": no
                  # escaping, no parseFunc, no RTE. That is the entire element.
                  #
                  # Its "header" is not rendered - EXT:frontend relabels the
                  # field to "Name (not visible in frontend)" for this CType, the
                  # same way it does for "div" and "shortcut" - so the copy below
                  # has to carry its own heading, and it also introduces those
                  # two elements, which follow it and have no visible header
                  # either.
                  - self:
                        id: 609
                        CType: 'html'
                        header: 'Plain HTML (name only, not rendered)'
                        bodytext: |
                          <h2 class="theme-content-element__heading">Plain HTML</h2>
                          <p>This paragraph, its heading and the class on that heading
                          were written as raw markup in <code>bodytext</code> and
                          reached the page untouched. Nothing was escaped and no rich
                          text parsing ran, which is what separates this element from
                          "Text" further up - the <code>code</code> tags in this
                          sentence survive here in every installation. That
                          element's field is declared <em>enableRichtext</em>, so a
                          save keeps only what the processing of the rich text preset
                          allows: <code>code</code> with the theme's preset, nothing
                          of the kind without the rich text editor installed. Access to raw HTML is not restricted by
                          anything in the frontend: the <code>CType</code> field
                          carries <code>authMode = explicitAllow</code>, so a
                          non-admin editor can only pick it if a backend group grants
                          it explicitly.</p>
                          <p>Two elements follow that have no visible header either.
                          The horizontal rule below is the <strong>Divider</strong>
                          element, which renders nothing but that rule. After it,
                          <strong>Insert Records</strong> renders the page's own
                          "Core elements" heading a second time - it is a reference to
                          the first element on this page, not a copy of it.</p>

                  # "div" - a horizontal rule and nothing else. The core TCA gives
                  # this CType exactly one field besides "CType", and relabels it
                  # to "Name (not visible in frontend)", so the header below is
                  # there for the backend and the page module only.
                  - self:
                        id: 610
                        CType: 'div'
                        header: 'Divider before the record reference'

                  # "shortcut" - renders other content elements in place.
                  #
                  # "records" is a "type: group" field limited to "tt_content"
                  # (EXT:frontend/Configuration/TCA/tt_content.php). Its value is
                  # a comma separated list, each entry in the form
                  # "<tablename>_<uid>": "RecordsContentObject" hands it to
                  # "RelationHandler", which reverses the string and splits it on
                  # the first "_" from the right, so the id is the part after the
                  # last underscore and everything before it is the table name. A
                  # bare uid works too - a single allowed table makes it fall
                  # back to that table - but the qualified form is what the
                  # backend writes and what makes the scenario readable.
                  #
                  # This is also the element that demonstrates the cycle break of
                  # PR #19: inside a shortcut, "tt_content.shortcut" is redefined
                  # to render nothing, so a shortcut reached through a shortcut
                  # produces no output. TYPO3 v13.4 has a recursion guard of its
                  # own ("recordRegister"), v14 has none, and this element renders
                  # identically on both because the theme does not rely on it.
                  - self:
                        id: 611
                        CType: 'shortcut'
                        header: 'Insert records (name only, not rendered)'
                        records: 'tt_content_601'

              # One page per classic CType, below the page that shows each of
              # them once. The page is named after the CType and shows its
              # variants: every value of the field that changes how the
              # element looks, one element each. "ShowcaseTreeTest" derives
              # the CTypes from the TypoScript and the values from the TCA and
              # the page TSconfig, and holds these pages to both.
              #
              # "content_sidebar" like their parent, so the sub navigation
              # lists the sibling pages next to every one of them.
              children:
                # "header" - "header_layout" is the level, "header_position"
                # the alignment. The look independent of the level,
                # "tx_theme_header_style", is on the Frames page (uid 51).
                - self:
                      id: 30
                      title: 'Header'
                      slug: '/elements/core/header'
                      backend_layout: 'content_sidebar'
                  entities:
                    content:
                      - self:
                            id: 3001
                            CType: 'header'
                            header: 'Header'
                            header_layout: 1
                      - self:
                            id: 3002
                            CType: 'text'
                            header: 'Levels and positions'
                            header_layout: 2
                            bodytext: |
                              <p>The element is a heading and nothing else. Its level is the
                              value of "Layout" in the header palette, heading 1 to heading 5;
                              "Default" is a heading 2, and "Hidden" keeps the record and
                              renders nothing. The alignment moves the heading to the start,
                              the centre or the end of the line - the logical edges, so it
                              follows a right-to-left language.</p>
                      - self:
                            id: 3003
                            CType: 'header'
                            header: 'Heading level 2'
                            header_layout: 2
                      - self:
                            id: 3004
                            CType: 'header'
                            header: 'Heading level 3'
                            header_layout: 3
                      - self:
                            id: 3005
                            CType: 'header'
                            header: 'Heading level 4'
                            header_layout: 4
                      - self:
                            id: 3006
                            CType: 'header'
                            header: 'Heading level 5'
                            header_layout: 5
                      - self:
                            id: 3007
                            CType: 'header'
                            header: 'The default level, rendered as heading 2'
                            header_layout: 0
                      # Rendered as the wrapper alone: the record exists, the
                      # heading does not. Visible with the outlines switched on.
                      - self:
                            id: 3008
                            CType: 'header'
                            header: 'Hidden, and not displayed'
                            header_layout: 100
                      - self:
                            id: 3009
                            CType: 'header'
                            header: 'Centred'
                            header_layout: 2
                            header_position: 'center'
                      - self:
                            id: 3010
                            CType: 'header'
                            header: 'At the end of the line'
                            header_layout: 2
                            header_position: 'right'
                      - self:
                            id: 3011
                            CType: 'header'
                            header: 'At the start of the line'
                            header_layout: 2
                            header_position: 'left'
                      - self:
                            id: 3012
                            CType: 'header'
                            header: 'No alignment chosen'
                            header_layout: 2
                            header_position: ''

                # "text" - the rich text field and nothing else. The
                # typography section (below page 2) shows what rich text can
                # hold; this page shows the element.
                - self:
                      id: 31
                      title: 'Text'
                      slug: '/elements/core/text'
                      backend_layout: 'content_sidebar'
                  entities:
                    content:
                      - self:
                            id: 3101
                            CType: 'header'
                            header: 'Text'
                            header_layout: 1
                      - self:
                            id: 3102
                            CType: 'text'
                            header: 'Running text'
                            header_layout: 2
                            bodytext: |
                              <p>The text element renders its header and its rich text, and
                              the rich text goes through the parsing function of the frontend,
                              so a <a href="t3://page?uid=35">link to another page</a> is
                              resolved and <strong>strong</strong> and <em>emphasised</em>
                              words keep their meaning.</p>
                              <p>A second paragraph, so the space between two of them is on
                              the page as well.</p>
                      - self:
                            id: 3103
                            CType: 'text'
                            header: 'A list and a quotation inside the text'
                            header_layout: 2
                            bodytext: |
                              <p>Rich text holds lists and quotations of its own:</p>
                              <ul><li>an unordered list,</li><li>with a second item,</li></ul>
                              <ol><li>an ordered one,</li><li>numbered by the browser.</li></ol>
                              <blockquote><p>A quotation set apart from the text around it.</p></blockquote>
                      - self:
                            id: 3104
                            CType: 'text'
                            bodytext: |
                              <p>This element has no header, so it starts with its text.</p>
                      # "layout" 1 sets the text in columns - two where each
                      # gets 30 characters, one on a phone. Long enough to
                      # break, with a heading, a list and a quotation that
                      # move to the next column whole rather than split.
                      - self:
                            id: 3105
                            CType: 'text'
                            header: 'Text in columns'
                            header_layout: 2
                            layout: 1
                            bodytext: |
                              <p>The layout Columns sets the rich text of the element in
                              two columns wherever each of them can be at least thirty
                              characters wide, and in one column where it cannot - on a
                              phone, or in a narrow sidebar. The text itself is the same
                              markup as in running text; only the block around it
                              changes.</p>
                              <p>A hairline separates the columns. A paragraph keeps at
                              least two of its lines on either side of a break, so a
                              column never starts or ends with a single stranded
                              line.</p>
                              <h3>What stays in one piece</h3>
                              <p>A heading moves with the paragraph it opens, and the
                              blocks below are never cut in half by a column
                              break:</p>
                              <ul><li>a quotation,</li><li>a table or a code block,</li><li>every item of a list.</li></ul>
                              <blockquote><p>Columns suit short, self-contained text: a
                              notice, a set of facts, an imprint. A long article reads
                              better in one column at the measure.</p></blockquote>
                              <p>The first element of the text starts at the top of the
                              first column, level with the second.</p>

                # "textpic" - one element per value of "imageorient", in the
                # order the select offers them. The in-text values carry a
                # portrait image and the others a landscape one, and all share
                # one paragraph long enough to show where the text runs past
                # the image.
                - self:
                      id: 32
                      title: 'Text & Images'
                      slug: '/elements/core/textpic'
                      backend_layout: 'content_sidebar'
                  entities:
                    content:
                      - self:
                            id: 3201
                            CType: 'header'
                            header: 'Text & Images'
                            header_layout: 1
                      - self:
                            id: 3202
                            CType: 'textpic'
                            header: 'Above, centred (0)'
                            header_layout: 2
                            imageorient: 0
                            imagecols: 1
                            bodytext: &textpicBody |
                              <p>The position of the image is the value of
                              <em>imageorient</em> in the heading. The core's
                              <strong>GalleryProcessor</strong> turns it into a vertical and a
                              horizontal position, and the gallery partial turns those into
                              modifier classes. This paragraph is long enough to run past an
                              image placed in the text, which is what tells the variants that
                              let the text flow back under the image from the ones that keep it
                              beside the image.</p>
                      - self:
                            id: 3203
                            CType: 'textpic'
                            header: 'Above, right (1)'
                            header_layout: 2
                            imageorient: 1
                            imagecols: 1
                            bodytext: *textpicBody
                      - self:
                            id: 3204
                            CType: 'textpic'
                            header: 'Above, left (2)'
                            header_layout: 2
                            imageorient: 2
                            imagecols: 1
                            bodytext: *textpicBody
                      - self:
                            id: 3205
                            CType: 'textpic'
                            header: 'Below, centred (8)'
                            header_layout: 2
                            imageorient: 8
                            imagecols: 1
                            bodytext: *textpicBody
                      - self:
                            id: 3206
                            CType: 'textpic'
                            header: 'Below, right (9)'
                            header_layout: 2
                            imageorient: 9
                            imagecols: 1
                            bodytext: *textpicBody
                      - self:
                            id: 3207
                            CType: 'textpic'
                            header: 'Below, left (10)'
                            header_layout: 2
                            imageorient: 10
                            imagecols: 1
                            bodytext: *textpicBody
                      - self:
                            id: 3208
                            CType: 'textpic'
                            header: 'In text, right (17)'
                            header_layout: 2
                            imageorient: 17
                            imagecols: 1
                            bodytext: *textpicBody
                      - self:
                            id: 3209
                            CType: 'textpic'
                            header: 'In text, left (18)'
                            header_layout: 2
                            imageorient: 18
                            imagecols: 1
                            bodytext: *textpicBody
                      - self:
                            id: 3210
                            CType: 'textpic'
                            header: 'In text, right, no wrap (25)'
                            header_layout: 2
                            imageorient: 25
                            imagecols: 1
                            bodytext: *textpicBody
                      - self:
                            id: 3211
                            CType: 'textpic'
                            header: 'In text, left, no wrap (26)'
                            header_layout: 2
                            imageorient: 26
                            imagecols: 1
                            bodytext: *textpicBody

                # "textmedia" - the same processors as "textpic" on the
                # "assets" field, so four orientations and three column counts
                # are enough to show it is the same layout.
                - self:
                      id: 33
                      title: 'Text & Media'
                      slug: '/elements/core/textmedia'
                      backend_layout: 'content_sidebar'
                  entities:
                    content:
                      - self:
                            id: 3301
                            CType: 'header'
                            header: 'Text & Media'
                            header_layout: 1
                      - self:
                            id: 3302
                            CType: 'textmedia'
                            header: 'Two files above the text, two columns'
                            header_layout: 2
                            imageorient: 0
                            imagecols: 2
                            bodytext: &textmediaBody |
                              <p>The same gallery as "Text &amp; Images", read from the
                              <em>assets</em> field, which also takes a video or an audio
                              file. Orientation and columns are the values in the heading.</p>
                      - self:
                            id: 3303
                            CType: 'textmedia'
                            header: 'One file in the text, right'
                            header_layout: 2
                            imageorient: 17
                            imagecols: 1
                            bodytext: *textpicBody
                      - self:
                            id: 3304
                            CType: 'textmedia'
                            header: 'One file in the text, left, no wrap'
                            header_layout: 2
                            imageorient: 26
                            imagecols: 1
                            bodytext: *textpicBody
                      - self:
                            id: 3305
                            CType: 'textmedia'
                            header: 'Three files below the text, three columns'
                            header_layout: 2
                            imageorient: 8
                            imagecols: 3
                            bodytext: *textmediaBody
                      # The two media types "assets" takes that "image" does
                      # not. Both render as ".theme-media" rather than through
                      # "f:image" - see "Partials/ContentElement/Gallery.html".
                      # The film carries a caption track, in
                      # "tx_theme_captions": a field of the theme, because a
                      # file reference has nowhere to keep one. It is paired
                      # with the film by its file name.
                      #
                      # THE FILM DOES NOT PLAY, AND IS NOT MEANT TO. It is an
                      # "ftyp" and a "free" box - the header that makes the
                      # file "video/mp4" and nothing else - so a browser draws
                      # the player and its controls and then fails to decode
                      # it. A playable film needs an encoder, and committing
                      # one would put a megabyte of video in an extension
                      # whose showcase is about markup. The audio file beside
                      # it IS playable: a second of a 440 Hz tone. See
                      # "config.yml" and "docs/development/seeding.md".
                      - self:
                            id: 3306
                            CType: 'textmedia'
                            header: 'A video, with a caption track'
                            header_layout: 2
                            imageorient: 0
                            imagecols: 1
                            bodytext: >-
                              <p>A video file in the <em>assets</em> field renders as a
                              native player with its controls, and the WebVTT file of
                              the same name becomes its caption track. The file itself
                              is a placeholder that carries no picture, so the player
                              shows its controls and nothing else.</p>
                      - self:
                            id: 3307
                            CType: 'textmedia'
                            header: 'An audio file'
                            header_layout: 2
                            imageorient: 0
                            imagecols: 1
                            bodytext: >-
                              <p>An audio file renders as a native player as well. It
                              draws no picture, so its height is the browser's and only
                              its width is the theme's. This one is a second of a
                              440&nbsp;Hz tone.</p>

                # "image" - one element per column count up to four, each with
                # as many files as columns. The select offers up to eight; at
                # the gallery width of the theme a fifth column is a row of
                # thumbnails, which the page has no reason to show.
                - self:
                      id: 34
                      title: 'Images'
                      slug: '/elements/core/image'
                      backend_layout: 'content_sidebar'
                  entities:
                    content:
                      - self:
                            id: 3401
                            CType: 'header'
                            header: 'Images'
                            header_layout: 1
                      - self:
                            id: 3402
                            CType: 'image'
                            header: 'One column'
                            header_layout: 2
                            imagecols: 1
                      - self:
                            id: 3403
                            CType: 'image'
                            header: 'Two columns'
                            header_layout: 2
                            imagecols: 2
                      - self:
                            id: 3404
                            CType: 'image'
                            header: 'Three columns'
                            header_layout: 2
                            imagecols: 3
                      - self:
                            id: 3405
                            CType: 'image'
                            header: 'Four columns'
                            header_layout: 2
                            imagecols: 4
                      # "image_zoom" - the editor's "Enlarge on click". Every
                      # image of this element carries the badge and the link to
                      # the file, and with the theme's script the link opens the
                      # lightbox instead, which moves between the three.
                      - self:
                            id: 3406
                            CType: 'image'
                            header: 'Three columns, enlargeable'
                            header_layout: 2
                            imagecols: 3
                            image_zoom: 1

                # "bullets" - every "layout" on an unordered list, two on an
                # ordered one, and the definition list, which reads
                # "term|description" per line and ignores the layout. See
                # "Templates/ContentElements/Bullets.html".
                - self:
                      id: 35
                      title: 'Bullet list'
                      slug: '/elements/core/bullets'
                      backend_layout: 'content_sidebar'
                  entities:
                    content:
                      - self:
                            id: 3501
                            CType: 'header'
                            header: 'Bullet list'
                            header_layout: 1
                      - self:
                            id: 3502
                            CType: 'bullets'
                            header: 'Bullets or numbers'
                            header_layout: 2
                            bullets_type: 0
                            layout: 0
                            bodytext: &bulletsBody |
                              One item per line, typed into a plain text field
                              Each line is escaped, so a typed tag stays text
                              The layout picks the marker of the whole list
                      - self:
                            id: 3503
                            CType: 'bullets'
                            header: 'Check marks'
                            header_layout: 2
                            bullets_type: 0
                            layout: 1
                            bodytext: *bulletsBody
                      # The icon of the list is picked in "tx_theme_icon", the
                      # icon picker of the theme, from the curated list of
                      # "IconPicker.tsconfig". Without one the layout renders
                      # the markers of layout 0 - see "Bullets.html".
                      - self:
                            id: 3504
                            CType: 'bullets'
                            header: 'Icons'
                            header_layout: 2
                            bullets_type: 0
                            layout: 2
                            tx_theme_icon: 'star'
                            bodytext: *bulletsBody
                      - self:
                            id: 3505
                            CType: 'bullets'
                            header: 'Inline'
                            header_layout: 2
                            bullets_type: 0
                            layout: 3
                            bodytext: |
                              Header
                              Text
                              Bullet list
                              Table
                              File links
                      - self:
                            id: 3506
                            CType: 'bullets'
                            header: 'Numbered'
                            header_layout: 2
                            bullets_type: 1
                            layout: 0
                            bodytext: |
                              Pick the list type "Numbered list"
                              Type one step per line
                              Save, and the browser numbers the steps
                      - self:
                            id: 3507
                            CType: 'bullets'
                            header: 'Numbered, with check marks'
                            header_layout: 2
                            bullets_type: 1
                            layout: 1
                            bodytext: |
                              The list stays ordered for a screen reader
                              The check mark replaces the number on screen
                      - self:
                            id: 3508
                            CType: 'bullets'
                            header: 'Definition list'
                            header_layout: 2
                            bullets_type: 2
                            bodytext: |
                              Bullets or numbers|The markers of the element baseline
                              Check marks|A check mark in front of every item
                              Icons|One icon of the set in front of every item
                              Inline|The items on one line, a hairline between them
                              A term without a description

                # "table" - one element per "table_class": the three of the
                # core TCA and the five "TCEFORM/TableClass.tsconfig" adds, all
                # on the same rows so only the class differs.
                - self:
                      id: 36
                      title: 'Table'
                      slug: '/elements/core/table'
                      backend_layout: 'content_sidebar'
                  entities:
                    content:
                      - self:
                            id: 3601
                            CType: 'header'
                            header: 'Table'
                            header_layout: 1
                      - self:
                            id: 3602
                            CType: 'table'
                            header: 'Default, with a header row and a footer'
                            header_layout: 2
                            table_class: ''
                            table_caption: 'The spacing scale'
                            table_delimiter: 124
                            table_enclosure: 0
                            table_header_position: 1
                            table_tfoot: 1
                            bodytext: &tableBody |
                              Value|Token|Used for
                              extra-small|--theme-space-2|Tight groups
                              small|--theme-space-4|Related elements
                              medium|--theme-space-6|The default gap
