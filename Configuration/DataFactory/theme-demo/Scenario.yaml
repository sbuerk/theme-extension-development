# The records of the seed set "theme-demo", in the scenario format of
# typo3/testing-framework as sbuerk/data-factory reads it.
#
# UIDS
#
# Every record declares its uid, and the numbering is a rule rather than a
# sequence:
#
#   pages               1-9, the tree below
#   tt_content          the uid of its page times 100, plus its position on
#                       that page: the third element of page 6 is 603
#   tx_theme_list_item  1-18 on page 8, numbered in the order they are
#                       declared - the link list's four deliberately not in
#                       the order they render in, see there
#
# A declared "id" is a suggestion to DataHandler, honoured for an admin backend
# user only - which is why "data-factory:import" refuses to run as anybody
# else. A record without one would not get an auto increment uid either, but
# one from a counter starting at 10000, so nothing here relies on that.
#
# The uids are what the rest of the repository points at: the committed site
# configurations of the development instances name root page 1, the file
# references in "config.yml" name the records they hang on, the "shortcut"
# element names "tt_content_601", the link fields name "t3://page?uid=2", and
# the functional tests assert against pages 1 to 9.
#
# RELATIONS
#
# An inline relation needs no construct of its own. The parent writes the
# comma separated list of its children's declared ids into its relation field,
# the children are records of their own on the same page, and DataHandler
# resolves that list exactly like a backend form submit - writing "uid_foreign",
# "tablename" and "sorting_foreign" from the TCA of the parent field. Their
# order is the order of that list.
#
# "hidden: 0" sits on the wildcard entity and nowhere else. The "pages" TCA
# defaults the column to 1, so a page written without it exists and renders
# nothing. It must not be repeated on a declared entity: the wildcard is merged
# into each of them with array_merge_recursive(), so a key on both sides
# becomes the list [0, 0] and reaches the database as the string "Array".
entitySettings:
  '*':
    nodeColumnName: 'pid'
    columnNames: {id: 'uid'}
    defaultValues: {pid: 0, hidden: 0}
  page:
    isNode: true
    tableName: 'pages'
    parentColumnName: 'pid'
    defaultValues: {doktype: 1}
  content:
    tableName: 'tt_content'
  listItem:
    tableName: 'tx_theme_list_item'

entities:
  page:
    - self:
          id: 1
          title: 'Theme demo'
          slug: '/'
          is_siteroot: 1
          # "backend_layout" is an ordinary field of the record: everything a
          # scenario declares is written as it stands. The identifiers are the
          # ones registered in "Configuration/PageTsConfig/BackendLayouts".
          #
          # A site root is where the footer columns are conventionally edited,
          # which is what the "start" layout offers over "content".
          backend_layout: 'start'
      entities:
        content:
          - self:
                id: 101
                CType: 'header'
                header: 'A frontend to look at'
                header_layout: 1
          - self:
                id: 102
                CType: 'text'
                header: 'What this is'
                header_layout: 2
                bodytext: |
                  <p>This page tree is seeded from a definition in the repository, so a
                  development instance can be rebuilt from nothing without clicking a
                  page tree together by hand.</p>
      children:
        - self:
              id: 2
              title: 'Typography'
              slug: '/typography'
              backend_layout: 'content'
          entities:
            content:
              - self:
                    id: 201
                    CType: 'header'
                    header: 'Typography'
                    header_layout: 1
              - self:
                    id: 202
                    CType: 'text'
                    header: 'Running text'
                    header_layout: 2
                    bodytext: |
                      <p>A paragraph of running text, so the theme has something to set
                      in its body font. It carries <strong>bold</strong> and
                      <em>emphasised</em> words and a <a href="t3://page?uid=1">link</a>, which are
                      the three inline cases a stylesheet has to answer for.</p>

        - self:
              id: 3
              title: 'Media'
              slug: '/media'
              backend_layout: 'content'
          entities:
            content:
              - self:
                    id: 301
                    CType: 'header'
                    header: 'Media'
                    header_layout: 1
              # The image is attached in "config.yml", which names this uid.
              - self:
                    id: 302
                    CType: 'image'
                    header: 'A single image'
                    header_layout: 2
              # The gallery layout is driven by the TCA fields of the element,
              # not by the template: "imagecols" is what an editor changes in
              # the backend to get a second column.
              - self:
                    id: 303
                    CType: 'image'
                    header: 'Two images, two columns'
                    header_layout: 2
                    imagecols: 2

        # The one page that declares no "backend_layout" at all, and it stays
        # that way on purpose: it is the only page in the tree that reaches the
        # hard coded "default" fallback of "PageLayoutResolver", so that path
        # has no other coverage. Asserted by "ShowcaseTreeTest".
        - self:
              id: 4
              title: 'Empty page'
              slug: '/empty'

        # The showcase branch. Its three children each demonstrate one family of
        # content elements, and between them they carry every CType this theme
        # renders - which "ShowcaseTreeTest" holds them to, by reading the
        # TypoScript rather than a list kept in the test.
        - self:
              id: 5
              title: 'Elements'
              slug: '/elements'
              backend_layout: 'content'
          entities:
            content:
              - self:
                    id: 501
                    CType: 'header'
                    header: 'Elements'
                    header_layout: 1
              - self:
                    id: 502
                    CType: 'text'
                    bodytext: |
                      <p>Three pages, one per family: the classic types
                      <em>EXT:frontend</em> registers without supplying a rendering,
                      the eleven menu types, and the thirteen this extension adds itself.
                      Every one of them appears exactly once, so a single branch of the
                      tree answers what the theme does with each.</p>
          children:
            - self:
                  id: 6
                  title: 'Core elements'
                  slug: '/elements/core'
                  # Read by the "menu_abstract" and "menu_related_pages" elements
                  # on page 7, which list the children of page 5 - this page
                  # among them. Without an abstract the item renders as a bare
                  # link, and without a shared keyword the related-pages menu
                  # comes back empty; both look like the element is broken rather
                  # than like the target page is missing a field.
                  abstract: 'Every classic content type EXT:frontend registers without supplying a rendering for it.'
                  keywords: 'content elements, core'
                  # "content_sidebar" rather than "content", and its sibling
                  # page 8 deliberately does not use it: two pages under one
                  # parent rendering with and without the sub navigation is what
                  # proves the backend layout is resolved per page instead of
                  # inherited down the branch.
                  #
                  # Nothing is seeded into the sidebar column (colPos 1) and
                  # nothing needs to be: "Partials/Page/Sidebar.html" renders the
                  # sub navigation above the "sidebar" slot unconditionally, so
                  # the aside is populated on a page that puts all its content in
                  # "main".
                  backend_layout: 'content_sidebar'
              entities:
                content:
                  # "header" - the whole element is a heading, nothing else.
                  #
                  # The "shortcut" element at the bottom of this page names this
                  # one by its uid: "records" is a plain string column holding
                  # "tt_content_<uid>", so the target's uid has to be known while
                  # the scenario is written.
                  #
                  # "header_layout" is the heading level: 1-5 are <h1>-<h5>, 0
                  # falls back to <h2>, and 100 means "do not display" - see
                  # "Partials/ContentElement/Header.html".
                  - self:
                        id: 601
                        CType: 'header'
                        header: 'Core elements'
                        header_layout: 1

                  # "text" - "bodytext" through "f:format.html", which means
                  # "lib.parseFunc_RTE": links are rewritten by typolink and
                  # lines that are not already wrapped are wrapped in <p>.
                  #
                  # The markup available here is not free-form. This CType's
                  # "bodytext" is declared "enableRichtext", so DataHandler runs
                  # the RTE "db" transformation over it ON SAVE, and that drops
                  # every tag outside "RteHtmlParser::$defaultAllowedTagsList"
                  # (typo3/cms-core, Classes/Html/RteHtmlParser.php) - which has
                  # b, i, a, p, strong, em, ul, ol, li and so on, but no "code"
                  # and no "kbd". Seeding one is not an error and reports
                  # nothing; the tag is simply not in the row afterwards. The
                  # "html" element further down is the one place on this page
                  # where it survives, and its copy says so.
                  - self:
                        id: 602
                        CType: 'text'
                        header: 'What this page is'
                        header_layout: 2
                        bodytext: |
                          <p>Every classic content type this theme renders is on this
                          page exactly once, so a single URL answers what each one
                          looks like and which of its fields the theme actually reads.
                          The copy of each element describes that element.</p>
                          <p>The rendering is defined in
                          <em>Configuration/TypoScript/ContentElements.typoscript</em>.
                          This theme does not depend on <em>fluid_styled_content</em>,
                          so a content type without a branch in that file would render
                          the core's <strong>"no rendering definition"</strong> notice
                          instead of anything at all.</p>

                  # "bullets" - "bodytext" is one item per line, split by the
                  # core's own "SplitProcessor" (delimiter LF,
                  # "removeEmptyEntries = 1", so the trailing newline of this
                  # block scalar does not become an empty item).
                  #
                  # "bullets_type" selects the list element: 0 = <ul>, 1 = <ol>,
                  # 2 = <dl>. 0 is also the TCA default; it is written out anyway
                  # so the value the copy below talks about is visible next to it.
                  - self:
                        id: 603
                        CType: 'bullets'
                        header: 'Bullet list'
                        header_layout: 2
                        bullets_type: 0
                        bodytext: |
                          One item per line, with no markup and no delimiter
                          Each line is escaped on output, so a typed tag stays text
                          bullets_type 1 renders the same lines as an ordered list
                          bullets_type 2 renders them as a definition list of terms

                  # "table" - the element whose fields are least like their names.
                  #
                  # "bodytext" is delimiter separated text, one row per line, and
                  # "TableProcessor" (Classes/DataProcessing/TableProcessor.php)
                  # decodes it into header/body/footer rows before the template
                  # sees it. The fields that control the decode store CHARACTER
                  # CODES, not characters:
                  #
                  #   table_delimiter  the column separator, TCA default 124 = "|"
                  #                    (the other offered codes are 59, 44, 58, 9)
                  #   table_enclosure  the quoting character, 0 = none
                  #                    (the other offered codes are 39 and 34)
                  #
                  # 0 for "no enclosure" never reaches PHP as an empty string:
                  # "fgetcsv()" rejects that with a ValueError, so the processor
                  # passes chr(0) instead. That matters for the content here -
                  # with no real enclosure character, no cell below may contain
                  # the delimiter, which is why the first body row spells "124"
                  # out in words instead of showing the character.
                  #
                  # The remaining two are ordinary:
                  #
                  #   table_header_position  0 = none, 1 = first row is <thead>,
                  #                          2 = first cell of every row is a
                  #                              <th scope="row">
                  #   table_tfoot            1 = the last remaining row (after the
                  #                              header row was taken off) becomes
                  #                              <tfoot>
                  #
                  # "cols" and "table_class" exist in the core TCA of this element
                  # and are deliberately not set: the processor pads every row to
                  # the widest one by itself, and the template styles the table
                  # through ".theme-table" rather than a class from the record.
                  - self:
                        id: 604
                        CType: 'table'
                        header: 'Table'
                        header_layout: 2
                        table_caption: 'The five table_* fields, and what this element sets them to'
                        table_delimiter: 124
                        table_enclosure: 0
                        table_header_position: 1
                        table_tfoot: 1
                        bodytext: |
                          Field|What it stores|Value on this element
                          table_delimiter|The character CODE of the column separator|124, a vertical bar
                          table_enclosure|The character CODE of the quoting character, 0 for none|0
                          table_header_position|0 none, 1 first row, 2 first column|1
                          table_tfoot|Whether the last row becomes a table footer|1
                          Decoded by|Classes/DataProcessing/TableProcessor.php|not by Table.html

                  # "textpic" - text plus the core "image" field, laid out by
                  # "GalleryProcessor" from "imageorient" and "imagecols".
                  #
                  # "imageorient" 17 is "in text, right"; the values are 0/1/2
                  # above, 8/9/10 below and 17/18 in text - the processor turns
                  # them into the vertical/horizontal position the gallery partial
                  # renders as modifier classes. Together with "imagecols: 1" this
                  # is deliberately the opposite of the "textmedia" element below,
                  # so the two are distinguishable on the page rather than looking
                  # like one element seeded twice.
                  - self:
                        id: 605
                        CType: 'textpic'
                        header: 'Text & Images'
                        header_layout: 2
                        imageorient: 17
                        imagecols: 1
                        bodytext: |
                          <p>Reads the <em>image</em> field, which the core TCA
                          restricts to images. The gallery is placed by
                          <em>imageorient</em> - 17 here, "in text, right" - and split
                          into <em>imagecols</em> columns, both of them computed by
                          the core's <strong>GalleryProcessor</strong> rather than by
                          the template.</p>

                  # "textmedia" - identical to "textpic" except for the source
                  # field: "assets" allows every "common-media-type", not only
                  # images. Same two processors, and "GalleryProcessor" does not
                  # care which field the files came from.
                  #
                  # "imageorient" 8 is "below, centered", so this is also the one
                  # element on the page where the template puts the body text
                  # before the gallery in the DOM.
                  - self:
                        id: 606
                        CType: 'textmedia'
                        header: 'Text & Media'
                        header_layout: 2
                        imageorient: 8
                        imagecols: 2
                        bodytext: |
                          <p>Reads the <em>assets</em> field instead of
                          <em>image</em>, so a video or an audio file is allowed here
                          where "Text &amp; Images" above would refuse it. With
                          <em>imageorient</em> 8 the media sits below the text and
                          centered, and <em>imagecols</em> 2 puts the two files side
                          by side.</p>

                  # "image" - the same two processors as "textpic" without the
                  # body text. Kept minimal on purpose: the Media page (uid 3)
                  # already demonstrates the gallery settings, and this page only
                  # has to be complete, not to repeat them.
                  - self:
                        id: 607
                        CType: 'image'
                        header: 'Images'
                        header_layout: 2

                  # "uploads" - a file list, not a gallery.
                  #
                  # The fields "Uploads.html" actually reads are all set here:
                  #
                  #   uploads_type          0 = name only, 1 = name and file type
                  #                         icon, 2 = name and thumbnail. The
                  #                         component library has no file type
                  #                         icon, so 1 renders as 0; 2 renders a
                  #                         thumbnail only for files FAL
                  #                         classifies as an image, which an SVG
                  #                         is (image/* maps to FileType::IMAGE).
                  #   filelink_size         shows the byte count
                  #   uploads_description   shows the description of the file
                  #                         REFERENCE - which is why both
                  #                         references in "config.yml" carry one,
                  #                         and why they differ from the ones the
                  #                         same files carry elsewhere on this
                  #                         page.
                  #   filelink_sorting      "FilesProcessor" sorts natively, so
                  #                         this overrides the order the
                  #                         references are declared in - by name
                  #                         ascending, the portrait file first.
                  #                         That is the point of setting it.
                  #
                  # "target" is left at its default (empty): the template passes
                  # it straight into the link, and a demo page has no business
                  # forcing new windows.
                  #
                  # "file_collections" is the second source "FilesProcessor" is
                  # wired to and stays empty: a demonstration of one field does
                  # not justify seeding a "sys_file_collection".
                  - self:
                        id: 608
                        CType: 'uploads'
                        header: 'File links'
                        header_layout: 2
                        uploads_type: 2
                        filelink_size: 1
                        uploads_description: 1
                        filelink_sorting: 'name'
                        filelink_sorting_direction: 'asc'

                  # "html" - "bodytext" straight out, through "f:format.raw": no
                  # escaping, no parseFunc, no RTE. That is the entire element.
                  #
                  # Its "header" is not rendered - EXT:frontend relabels the
                  # field to "Name (not visible in frontend)" for this CType, the
                  # same way it does for "div" and "shortcut" - so the copy below
                  # has to carry its own heading, and it also introduces those
                  # two elements, which follow it and have no visible header
                  # either.
                  - self:
                        id: 609
                        CType: 'html'
                        header: 'Plain HTML (name only, not rendered)'
                        bodytext: |
                          <h2 class="theme-content-element__heading">Plain HTML</h2>
                          <p>This paragraph, its heading and the class on that heading
                          were written as raw markup in <code>bodytext</code> and
                          reached the page untouched. Nothing was escaped and no rich
                          text parsing ran, which is what separates this element from
                          "Text" further up - the <code>code</code> tags in this
                          sentence survive here and are stripped there, because that
                          element's field is declared <em>enableRichtext</em> and this
                          one's is not. Access to raw HTML is not restricted by
                          anything in the frontend: the <code>CType</code> field
                          carries <code>authMode = explicitAllow</code>, so a
                          non-admin editor can only pick it if a backend group grants
                          it explicitly.</p>
                          <p>Two elements follow that have no visible header either.
                          The horizontal rule below is the <strong>Divider</strong>
                          element, which renders nothing but that rule. After it,
                          <strong>Insert Records</strong> renders the page's own
                          "Core elements" heading a second time - it is a reference to
                          the first element on this page, not a copy of it.</p>

                  # "div" - a horizontal rule and nothing else. The core TCA gives
                  # this CType exactly one field besides "CType", and relabels it
                  # to "Name (not visible in frontend)", so the header below is
                  # there for the backend and the page module only.
                  - self:
                        id: 610
                        CType: 'div'
                        header: 'Divider before the record reference'

                  # "shortcut" - renders other content elements in place.
                  #
                  # "records" is a "type: group" field limited to "tt_content"
                  # (EXT:frontend/Configuration/TCA/tt_content.php). Its value is
                  # a comma separated list, each entry in the form
                  # "<tablename>_<uid>": "RecordsContentObject" hands it to
                  # "RelationHandler", which reverses the string and splits it on
                  # the first "_" from the right, so the id is the part after the
                  # last underscore and everything before it is the table name. A
                  # bare uid works too - a single allowed table makes it fall
                  # back to that table - but the qualified form is what the
                  # backend writes and what makes the scenario readable.
                  #
                  # This is also the element that demonstrates the cycle break of
                  # PR #19: inside a shortcut, "tt_content.shortcut" is redefined
                  # to render nothing, so a shortcut reached through a shortcut
                  # produces no output. TYPO3 v13.4 has a recursion guard of its
                  # own ("recordRegister"), v14 has none, and this element renders
                  # identically on both because the theme does not rely on it.
                  - self:
                        id: 611
                        CType: 'shortcut'
                        header: 'Insert records (name only, not rendered)'
                        records: 'tt_content_601'

            # Every "menu_*" content element the theme renders, each pointed at a
            # different part of the seeded tree so the eleven are told apart by
            # what they list rather than by their header alone.
            #
            # "backend_layout: content_sidebar" is deliberate and is asserted:
            # page 8 is a sibling under the same parent and does *not* use it, so
            # the pair prove the layout is resolved per page rather than
            # inherited down the branch.
            - self:
                  id: 7
                  title: 'Menu elements'
                  slug: '/elements/menu'
                  backend_layout: 'content_sidebar'
                  # Read by the "menu_abstract" element below, which lists the
                  # children of page 5 - this page among them. Without an
                  # abstract the item still renders, just as a bare link
                  # ("showAbstract" is guarded by "{item.data.abstract}" in
                  # "Partials/ContentElement/Menu.html"), and nothing says why.
                  abstract: 'The eleven menu content elements, each pointed at a different part of this page tree.'
                  # The keyword source of the "menu_related_pages" element below.
                  # "special = keywords" reads the keywords of the page selected
                  # in "pages" and matches every *other* page under the site root
                  # that shares one, so this page is the source and is itself
                  # excluded from the result.
                  keywords: 'content elements'
              entities:
                content:
                  - self:
                        id: 701
                        CType: 'header'
                        header: 'Menu elements'
                        header_layout: 1

                  # "special = list" - "pages" names the pages to render, in the
                  # order they are listed; nothing is looked up by rootline
                  # position. Three top level pages, so the list is visibly a
                  # hand-picked selection rather than a branch of the tree.
                  - self:
                        id: 702
                        CType: 'menu_pages'
                        header: 'menu_pages: a hand-picked list of pages'
                        header_layout: 2
                        pages: '2,3,4'

                  # "special = directory" - the *children* of the selected pages,
                  # not the pages themselves. Page 5 is the parent of this page,
                  # so this renders its three siblings.
                  - self:
                        id: 703
                        CType: 'menu_subpages'
                        header: 'menu_subpages: the children of one page'
                        header_layout: 2
                        pages: '5'

                  # "special = list" plus "levels = 2" - the selected page itself
                  # *and* one level of its own children. Same starting point as
                  # "menu_subpages" above, so the two side by side show what the
                  # second level adds.
                  - self:
                        id: 704
                        CType: 'menu_section'
                        header: 'menu_section: one page and its children'
                        header_layout: 2
                        pages: '5'

                  # "special = directory" plus "levels = 2" - the children of the
                  # selected page, each with their own children beneath them.
                  # Rooted at the home page, so the "Elements" branch appears
                  # with its three sub pages nested under it.
                  - self:
                        id: 705
                        CType: 'menu_section_pages'
                        header: 'menu_section_pages: two levels below one page'
                        header_layout: 2
                        pages: '1'

                  # No source field at all: the TCA of this type has no "pages"
                  # (EXT:frontend,
                  # "Overrides/280-tt_content-content_type-menu_sitemap.php"),
                  # and the TypoScript sets no "special" either - it always
                  # starts at the site root and walks seven levels down.
                  - self:
                        id: 706
                        CType: 'menu_sitemap'
                        header: 'menu_sitemap: the whole site from its root'
                        header_layout: 2

                  # The same seven-level walk as "menu_sitemap", rooted at the
                  # selected page instead of the site root. This tree is only
                  # three levels deep, so what it renders here is the same single
                  # level "menu_subpages" above renders - the depth has nothing
                  # further to reach, and that is a property of the demo tree,
                  # not of the element.
                  - self:
                        id: 707
                        CType: 'menu_sitemap_pages'
                        header: 'menu_sitemap_pages: a whole branch from one page'
                        header_layout: 2
                        pages: '5'

                  # "special = directory" again, with each item's own "abstract"
                  # shown beneath its link. Rooted at page 5, so the items are
                  # pages 6, 7 and 8 - each of which needs an "abstract" of its
                  # own for this element to show anything but bare links.
                  - self:
                        id: 708
                        CType: 'menu_abstract'
                        header: 'menu_abstract: children with their abstracts'
                        header_layout: 2
                        pages: '5'

                  # "special = updated" - the selected page and everything
                  # beneath it, sorted by "SYS_LASTCHANGED" descending. That
                  # column is 0 on a freshly seeded tree and is only written when
                  # a page is first rendered in the frontend, so the links are
                  # all there from the start and the dates appear page by page as
                  # the tree is browsed. The theme sets no "maxAge", so nothing
                  # is filtered out by age.
                  - self:
                        id: 709
                        CType: 'menu_recently_updated'
                        header: 'menu_recently_updated: the tree by last change'
                        header_layout: 2
                        pages: '1'

                  # "special = keywords" - "pages" names the page whose keywords
                  # are the search term, not the pages to list. This page is that
                  # source (see "keywords" on the page above); the result is
                  # every other page under the site root sharing one of them.
                  - self:
                        id: 710
                        CType: 'menu_related_pages'
                        header: 'menu_related_pages: pages sharing a keyword'
                        header_layout: 2
                        pages: '7'

                  # No category is selected, deliberately: this tree seeds no
                  # "sys_category" records, so there is nothing to select. An
                  # empty selection renders an empty menu, which is the correct
                  # rendering of "nothing selected".
                  #
                  # "selected_categories: 0" rather than leaving the field out:
                  # it is the value DataHandler itself normalises an
                  # unresolvable selection to, so it is what the column holds
                  # once anything real has touched it, and it keeps this element
                  # identical to its sibling below so neither reads as the
                  # special case.
                  - self:
                        id: 711
                        CType: 'menu_categorized_pages'
                        header: 'menu_categorized_pages: pages by category'
                        header_layout: 2
                        selected_categories: 0
                        category_field: 'categories'

                  # The same deliberate gap as above.
                  #
                  # The explicit 0 used to be load-bearing: the TypoScript
                  # interpolated the field straight into "uid_local IN (...)",
                  # and an empty value made that "IN ()" - accepted by SQLite,
                  # rejected as a syntax error by MariaDB, MySQL and PostgreSQL,
                  # taking the whole page down rather than just the element. That
                  # is now guarded where it belongs, in
                  # "ContentElements.typoscript", because an editor who saves the
                  # element before picking a category hits the same path and no
                  # seed value can help them.
                  - self:
                        id: 712
                        CType: 'menu_categorized_content'
                        header: 'menu_categorized_content: content by category'
                        header_layout: 2
                        selected_categories: 0
                        category_field: 'categories'

            # Every content element this extension registers itself, so the
            # thirteen "theme_*" CTypes can be looked at side by side rather than
            # one fixture at a time.
            #
            # No "content_sidebar" here, unlike its two siblings 6 and 7: the
            # layout is resolved per page, not inherited down the branch, and
            # this page is what proves it.
            - self:
                  id: 8
                  title: 'Theme elements'
                  slug: '/elements/theme'
                  backend_layout: 'content'
                  # As on page 6: the abstract and the keyword are read by the
                  # two menu elements on page 7, not by anything on this page.
                  abstract: 'The thirteen content elements this extension registers itself, from the hero down to the accordion.'
                  keywords: 'content elements, theme'
              entities:
                content:
                  # theme_hero - the full hero: heading, lead, media and one call
                  # to action. Its own template defaults an unset
                  # "header_layout" to h1 (Partials/ContentElement/Hero.html),
                  # which is right for a page whose hero is its top heading and
                  # wrong for a page carrying three of them, so the level is set
                  # explicitly here.
                  - self:
                        id: 801
                        CType: 'theme_hero'
                        header: 'The full hero'
                        header_layout: 2
                        bodytext: |
                          <p>The hero carries a heading, a lead paragraph, one media
                          slot and a single call to action. It is the widest element
                          the theme ships and is meant to open a page.</p>
                        tx_theme_link: 't3://page?uid=2'
                        tx_theme_link_label: 'Read the typography page'
                        # The empty string is a real item of the select, not a
                        # missing value: it is the default variant and renders the
                        # plain ".theme-button" with no modifier.
                        tx_theme_link_variant: ''
                  # theme_hero_small - the same field set as theme_hero, rendered
                  # through the same partial with "compact: 1", so the difference
                  # between the two is only visible with both on one page.
                  - self:
                        id: 802
                        CType: 'theme_hero_small'
                        header: 'The reduced hero'
                        header_layout: 2
                        bodytext: |
                          <p>The same fields as the full hero, rendered compactly. The
                          element above and this one differ in nothing an editor
                          fills in - only in the variant that was chosen.</p>
                        tx_theme_link: 't3://page?uid=3'
                        tx_theme_link_label: 'Look at the media page'
                        tx_theme_link_variant: 'secondary'
                  # theme_hero_text_only - no "image" field on the CType at all,
                  # so no file reference either. The hero renders without its
                  # "theme-hero--media" modifier.
                  - self:
                        id: 803
                        CType: 'theme_hero_text_only'
                        header: 'The hero without media'
                        header_layout: 2
                        bodytext: |
                          <p>This variant has no image field in the backend form, so
                          there is nothing to leave empty. What it demonstrates is the
                          hero body on its own, full width.</p>
                        tx_theme_link: 't3://page?uid=1'
                        tx_theme_link_label: 'Back to the start page'
                        tx_theme_link_variant: 'ghost'
                  # theme_teaser - a short block of text with a call to action
                  # and no media. Like theme_hero_text_only it has no "image"
                  # field, which is why the teaser partial renders without its
                  # "theme-teaser__media" part.
                  - self:
                        id: 804
                        CType: 'theme_teaser'
                        header: 'A teaser without media'
                        bodytext: |
                          <p>A teaser is a secondary block: a heading, a couple of
                          sentences and one link. Its heading defaults to h2 rather
                          than the hero's h1.</p>
                        tx_theme_link: 't3://page?uid=4'
                        tx_theme_link_label: 'Open the empty page'
                        tx_theme_link_variant: 'secondary'
                  # theme_media_teaser - the same teaser with an image beside the
                  # text. The link is an external URL rather than a page, because
                  # "tx_theme_link" is a TCA type=link field and holds whatever
                  # the link wizard encoded - a page, a file, a mail address or,
                  # as here, a plain URL.
                  - self:
                        id: 805
                        CType: 'theme_media_teaser'
                        header: 'A teaser beside an image'
                        bodytext: |
                          <p>Text and a single image side by side. The image is one
                          file reference; the theme deliberately wires no gallery
                          processing here, because there is no grid to arrange.</p>
                        tx_theme_link: 'https://docs.typo3.org/'
                        tx_theme_link_label: 'Read the TYPO3 documentation'
                        tx_theme_link_variant: 'ghost'
                  # theme_testimonial - a quotation with its attribution.
                  # "header" and "subheader" are relabelled on this CType to hold
                  # the attributed person's name and role, not a content heading.
                  #
                  # No media, and no file reference: the element renders through
                  # ".theme-quote", which has no media slot, and the image field
                  # was removed from the CType rather than left inert. Do not add
                  # one back without giving the component a slot first.
                  - self:
                        id: 806
                        CType: 'theme_testimonial'
                        header: 'Ada Lovelace'
                        subheader: 'Mathematician, 1843'
                        bodytext: |
                          <p>The Analytical Engine weaves algebraic patterns just as
                          the Jacquard loom weaves flowers and leaves.</p>
                  # theme_author - a person: portrait, name, role, a short bio and
                  # the person's own links. The name is the content element's
                  # heading and goes through the shared header partial; the role
                  # is "subheader" and sits inside the component.
                  #
                  # "tx_theme_list_items" is the inline relation: the declared
                  # ids of its children, in the order they are rendered.
                  - self:
                        id: 807
                        CType: 'theme_author'
                        header: 'Grace Hopper'
                        subheader: 'Compiler pioneer'
                        bodytext: |
                          <p>Wrote the first compiler and spent the rest of her career
                          arguing that a programming language should read like
                          English.</p>
                        tx_theme_list_items: '1,2'
                  # theme_linklist - a flat list of links. "header" is the list
                  # title here, not a content heading, which is why the CType
                  # offers the bare field rather than the headers palette.
                  #
                  # The list names its children out of uid order on purpose:
                  # 5, 3, 6, 4 renders "Typography", "Media", "Empty page" and
                  # the unlabelled link, while the uid order - which is also
                  # the order they are created in - would put "Media" first.
                  # Only the relation can produce the rendered order, which is
                  # what lets "ShowcaseTreeTest" tell the relation from the uid
                  # or the insertion order.
                  - self:
                        id: 808
                        CType: 'theme_linklist'
                        header: 'Where to read more'
                        tx_theme_list_items: '5,3,6,4'
                  # theme_sociallinks - the same list, rendered as text labels
                  # rather than icons: the theme ships no icon assets, so
                  # "link_label" carries the platform name. The child "link" is
                  # restricted to url, email and telephone on this relation, so
                  # each of the three appears once.
                  - self:
                        id: 809
                        CType: 'theme_sociallinks'
                        header: 'Elsewhere'
                        tx_theme_list_items: '7,8,9'
                  # theme_media_teaser_grid - several cards in a grid. "header"
                  # and "bodytext" are the lead-in above the grid; the cards
                  # themselves are the same child table, here with the full
                  # header/text/image/link set the other three relations narrow
                  # away.
                  - self:
                        id: 810
                        CType: 'theme_media_teaser_grid'
                        header: 'Three cards in a grid'
                        bodytext: |
                          <p>Every card is one row of the shared child table. The
                          lead-in above is the element's own heading and body.</p>
                        tx_theme_list_items: '10,11,12'
                  # theme_notice - the six kinds of ".theme-alert", one element
                  # each. The kind decides the modifier and the "role" together
                  # ("Templates/ContentElements/ThemeNotice.html"): "status" for
                  # info and success, "alert" for warning and danger, "note" for
                  # note and tip. "header" is the title inside the component,
                  # not a content heading, and "bodytext" is rich text on this
                  # CType, so it is written as a paragraph.
                  - self:
                        id: 811
                        CType: 'theme_notice'
                        tx_theme_notice_kind: 'note'
                        header: 'A note'
                        bodytext: '<p>An aside to the text around it. It takes the note role and is never a live region, because nothing about it ever changes. It is also the kind a notice gets when nobody chose one.</p>'
                  - self:
                        id: 812
                        CType: 'theme_notice'
                        tx_theme_notice_kind: 'info'
                        header: 'Information'
                        bodytext: '<p>The neutral kind, and the look of the bare class. It takes the status role, a polite live region that waits for a pause before it is read.</p>'
                  - self:
                        id: 813
                        CType: 'theme_notice'
                        tx_theme_notice_kind: 'tip'
                        header: 'A tip'
                        bodytext: '<p>A recommendation, and the one kind that follows the palette: switch the palette in the display settings, and this is the only notice that changes colour.</p>'
                  - self:
                        id: 814
                        CType: 'theme_notice'
                        tx_theme_notice_kind: 'success'
                        header: 'Something finished'
                        bodytext: '<p>Confirms that something went through. It takes the status role, like the information.</p>'
                  - self:
                        id: 815
                        CType: 'theme_notice'
                        tx_theme_notice_kind: 'warning'
                        header: 'A warning'
                        bodytext: '<p>Something needs attention before it becomes a problem. It takes the alert role, the assertive one.</p>'
                  - self:
                        id: 816
                        CType: 'theme_notice'
                        tx_theme_notice_kind: 'danger'
                        header: 'Something failed'
                        bodytext: '<p>Assertive like the warning, with a glyph of its own: once colours are forced, the glyph is what tells the six kinds apart.</p>'
                  # theme_tabs - one tab per child. The ids of the tabs and
                  # panels are derived from the anchor of the element, "c817",
                  # so a second tab group on the page cannot collide with this
                  # one. The children's "text" is rich text on this relation
                  # only; the second one links to the start page to show it.
                  - self:
                        id: 817
                        CType: 'theme_tabs'
                        header: 'Three tabs'
                        header_layout: 2
                        tx_theme_list_items: '13,14,15'
                  # theme_accordion - native "details" sharing one "name",
                  # "c818-accordion", so opening one item closes the others.
                  - self:
                        id: 818
                        CType: 'theme_accordion'
                        header: 'An accordion'
                        header_layout: 2
                        tx_theme_list_items: '16,17,18'

                # The children of the four relations above. A relation is not a
                # containment: a child is an ordinary record on this page, and
                # only the relation columns DataHandler writes tie it to its
                # parent element.
                listItem:
                  # theme_author, uid 807. This relation is narrowed to the link
                  # palette on that CType, so a child carries "link" and
                  # "link_label" and nothing else - "header", "text" and "image"
                  # are not part of the form there and would be dead data.
                  - self:
                        id: 1
                        link: 't3://page?uid=1'
                        link_label: 'Profile'
                  - self:
                        id: 2
                        # TYPO3 link syntax, not an "href": an email address is
                        # stored with its "mailto:" scheme.
                        link: 'mailto:grace@example.org'
                        link_label: 'Write an email'

                  # theme_linklist, uid 808, which lists these as 5, 3, 6, 4.
                  - self:
                        id: 3
                        link: 't3://page?uid=3'
                        link_label: 'Media'
                  # No "link_label" on purpose: the label is optional, and a row
                  # without one falls back to the resolved URL rather than
                  # rendering an empty link. This entry is what shows that
                  # fallback in the seeded tree.
                  - self:
                        id: 4
                        link: 'https://typo3.org/'
                  - self:
                        id: 5
                        link: 't3://page?uid=2'
                        link_label: 'Typography'
                  - self:
                        id: 6
                        link: 't3://page?uid=4'
                        link_label: 'Empty page'

                  # theme_sociallinks, uid 809.
                  - self:
                        id: 7
                        link: 'https://typo3.org/'
                        link_label: 'TYPO3 on the web'
                  - self:
                        id: 8
                        link: 'mailto:hello@example.org'
                        link_label: 'Send an email'
                  - self:
                        id: 9
                        # "tel:" plus digits, "+", "," and ";" - anything else is
                        # stripped when the link wizard encodes a number.
                        link: 'tel:+4930123456'
                        link_label: 'Call the office'

                  # theme_media_teaser_grid, uid 810. The images of the three
                  # cards are attached in "config.yml".
                  #
                  # The child's "text" is a plain text column, never RTE-enabled,
                  # and is rendered through nl2br - so it holds sentences and
                  # line breaks, never markup.
                  - self:
                        id: 10
                        header: 'Typography'
                        text: 'Headings, running text and the inline cases a stylesheet has to answer for.'
                        link: 't3://page?uid=2'
                        link_label: 'Open the typography page'
                  - self:
                        id: 11
                        header: 'Media'
                        text: 'A single image and a two column gallery, both driven by the fields of the element.'
                        link: 't3://page?uid=3'
                        link_label: 'Open the media page'
                  # No "link" on this one: unlike the other three relations, the
                  # grid does not require it, and a card without a link renders
                  # its title and text with no ".theme-card__link". That shape is
                  # part of what this page demonstrates.
                  - self:
                        id: 12
                        header: 'A card without a link'
                        text: |
                          The link is optional on this relation only.
                          A card without one is a plain block of text.

                  # theme_tabs, uid 817. Title and rich text, nothing else: the
                  # relation is narrowed to those two on that CType. The text is
                  # stored as written - "overrideChildTca" enables the editor in
                  # the form only, and DataHandler runs no rich text
                  # transformation for it (see "tt_content_theme_tabs.php").
                  - self:
                        id: 13
                        header: 'Site set'
                        text: '<p>A site depends on the site set of the theme, and constants, page TSconfig and setup arrive together. This is the first tab, the one the markup selects.</p>'
                  - self:
                        id: 14
                        header: 'Static include'
                        text: '<p>An installation without site sets includes the static TypoScript in a template record instead: the same files, read the same way. The <a href="t3://page?uid=1">start page</a> of the second tree of a development instance is delivered like that.</p>'
                  - self:
                        id: 15
                        header: 'Without the script'
                        text: '<p>Switch JavaScript off and reload: the tab list is gone, and every panel is shown in a frame of its own, under a heading repeating its tab.</p>'

                  # theme_accordion, uid 818.
                  - self:
                        id: 16
                        header: 'What makes the items exclusive?'
                        text: '<p>One <em>name</em> shared by every item of this element. Open another item and this one closes, with no script involved.</p>'
                  - self:
                        id: 17
                        header: 'Why is the name derived from the element?'
                        text: '<p>The browser groups items by name across the whole page, so two accordions sharing one would close each other. The name is the anchor of the element with a suffix.</p>'
                  - self:
                        id: 18
                        header: 'Is anything open at first?'
                        text: '<p>No. Which item a reader meets first is what the order of the items already says.</p>'

        # The styleguide. Not a showcase of content elements: the "styleguide"
        # backend layout declares no usable content column at all, and
        # "Templates/Page/Styleguide.html" renders the component library
        # straight from Fluid, ignoring anything placed on the page.
        #
        # "nav_hide", never "hidden". A hidden page returns 404 in the frontend
        # and is only reachable through a backend preview link carrying a valid
        # hash, which defeats the point of seeding it - the page exists to be
        # opened. "nav_hide" keeps it reachable by URL and out of every menu,
        # which is what "not published" meant here.
        - self:
              id: 9
              title: 'Styleguide'
              slug: '/styleguide'
              backend_layout: 'styleguide'
              nav_hide: 1

