                            header: 'The default style'
                            subheader: 'A rule at the start'
                            bodytext: >-
                              The quotation as every testimonial rendered it so far: set
                              apart by a rule at the start of the line and by its weight,
                              without a quotation mark.
                      - self:
                            id: 11204
                            CType: 'theme_testimonial'
                            tx_theme_quote_style: 'pull'
                            header: 'The pull quote'
                            subheader: 'Larger, between two rules'
                            bodytext: >-
