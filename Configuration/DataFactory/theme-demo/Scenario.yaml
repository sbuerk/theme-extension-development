                # page p takes the uids of the content of page p + 10.
                - self:
                      id: 150
                      title: 'Carousel'
                      slug: '/elements/theme/carousel'
                      backend_layout: 'content_sidebar'
                      abstract: 'Slides in one track that scrolls sideways, with the caption below, above or over the picture.'
                  entities:
                    content:
                      - self:
                            id: 15001
                            CType: 'header'
                            header: 'Carousel'
                            header_layout: 1
                      # Every caption position, so the page shows all three.
                      # Nothing about a carousel moves on its own, so there is
                      # no field for an interval and none to seed.
                      - self:
                            id: 15002
                            CType: 'theme_carousel'
                            header: 'Every caption position'
                            header_layout: 2
                            tx_theme_list_items: '460,461,462,463'
                      # A carousel without a heading: the region takes the
                      # generic name rather than staying nameless.
                      - self:
                            id: 15003
                            CType: 'theme_carousel'
                            tx_theme_list_items: '464,465'
                    listItem:
                      # The pictures are attached in "config.yml"; 465 has
                      # none, so a slide without one is on the page too.
                      - self:
                            id: 460
                            header: 'The caption below'
                            text: >-
                              The default: the words sit under the picture.
                            link: 't3://page?uid=9'
                            link_label: 'Open the styleguide'
                      - self:
                            id: 461
                            header: 'The caption above'
                            text: >-
                              Painted before the picture, and still after it in the
                              markup.
                            caption_position: 'above'
                      - self:
                            id: 462
                            header: 'The caption over the picture'
                            text: >-
                              Over the foot of the picture on a wide screen, below it on
                              a narrow one.
                            caption_position: 'overlay'
                            link: 't3://page?uid=3'
                            link_label: 'Look at the images'
                            link_variant: 'secondary'
                      - self:
                            id: 463
                            header: 'The fourth slide'
                            text: >-
                              Out of view until the track is scrolled, which is what
                              makes it obvious that it scrolls.
                      - self:
                            id: 464
                            header: 'A carousel with no heading'
                            text: >-
                              The region is named after the element, and takes a generic
                              name where the element has none.
                      - self:
                            id: 465
                            header: 'A slide without a picture'
                            text: >-
                              The caption is the whole slide.
