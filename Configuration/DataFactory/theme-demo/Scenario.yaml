              children:
                # The entry the journal leads with, on the article layout: the
                # running text at the reading measure with an editorial aside
                # beside it. The aside is colPos 1 here as well, and the
                # article layout renders it as a column of its own grid rather
                # than as the navigation column of the page shell - so this
                # page and its parent seed the same slot and get two different
                # things out of it, which is the point of sharing the number.
                - self:
                      id: 117
                      title: 'Composing a page'
                      slug: '/examples/journal/composing-a-page'
                      backend_layout: 'article'
                      abstract: 'A long read on the article layout: running text held to the reading measure, a pull quote, a byline, and editorial notes in the aside.'
                  entities:
                    content:
                      - self:
                            id: 11701
                            CType: 'header'
                            colPos: 2
                            header: 'Composing a page from elements that already exist'
                            header_layout: 1
                      - self:
                            id: 11702
                            CType: 'text'
                            bodytext: |
                              <p class="theme-lead">Every element of this theme was built to be
                              looked at on its own, and every one of them is wrong on its own.
                              A page is the unit that has to work.</p>
                              <p>The showcase pages below <a href="t3://page?uid=5">Elements</a>
                              do what a showcase has to do first: one element at a time, every
                              value of every field that changes how it looks, nothing else on
                              the page to argue with. That is how a defect in a single element
                              is found. It is not how an editor works, and it is not how a
                              reader meets the result.</p>
                              <h3>What changes when there are six of them</h3>
                              <p>Put a hero, a teaser list, a card group and a call to action on
                              one page and three things go wrong that none of them shows alone:
                              two headings claim the same level, two elements set the same
                              spacing twice, and the eye has no idea which of the four is the
                              one to act on. None of that is a bug in an element. All of it is
                              a decision somebody has to make once per page.</p>
                      - self:
                            id: 11703
                            CType: 'textpic'
                            header: 'The order is the argument'
                            header_layout: 3
                            imageorient: 17
                            imagecols: 1
                            bodytext: |
                              <p>A page is read from the top, so the order of the elements is
                              the order of the claims. The hero says what this is, the text
                              says why it is worth the next minute, the collection shows that
                              it exists, and the call to action is the only thing left to do.
                              Reversed, the same four elements are a page nobody finishes.</p>
                              <p>The picture beside this paragraph is the core
                              <em>Text &amp; Images</em> element with the image in the text at
                              the end of the line - the same element and the same field the
                              media pages demonstrate one value at a time.</p>
                      - self:
                            id: 11704
                            CType: 'theme_testimonial'
                            tx_theme_quote_style: 'pull'
                            header: 'An editor, in a workshop'
                            subheader: 'On being given twenty content elements'
                            bodytext: >-
                              I do not need more elements. I need to know which three of
                              these belong on the page I am writing.
                      - self:
                            id: 11705
                            CType: 'text'
                            header: 'What the theme can decide, and what it cannot'
                            header_layout: 3
                            bodytext: |
                              <p>The theme can make sure that two elements next to each other
                              never collide: one spacing scale, one heading rhythm, one
                              measure for running text whatever column it lands in. It does
                              that, and the pages of this section are where it is checked.</p>
                              <p>What it cannot decide is which elements a page needs. That is
                              editorial, it changes per page, and a theme that decided it
                              would be a template - which is the thing this theme exists not
                              to be.</p>
                      - self:
                            id: 11706
                            CType: 'theme_author'
                            header: 'The theme maintainers'
                            subheader: 'Who writes this journal'
                            bodytext: >-
                              The people who build sites against this theme and write down
                              what went wrong while they did.
                            tx_theme_list_items: '650,651'
                      - self:
                            id: 11707
                            CType: 'theme_notice'
                            tx_theme_notice_kind: 'note'
                            header: 'What this page is made of'
                            bodytext: '<p>A header in the stage, a text with a lead, a <em>Text &amp; Images</em> element with the image in the text, a testimonial in the pull quote style, a second text and an author element - with a notice and a link list in the aside. The backend layout is <em>Article</em>.</p>'
                      # The aside, colPos 1: editorial, and after the article
                      # in reading order. It carries no table of contents -
                      # the theme builds one for the page shell's aside of the
                      # "content_sidebar" layout only, and this layout has no
                      # page shell aside at all.
                      - self:
                            id: 11708
                            CType: 'theme_notice'
                            colPos: 1
                            tx_theme_notice_kind: 'info'
                            header: 'About this entry'
                            bodytext: '<p>Written after a workshop in which four editors were given every element of this theme and an empty page.</p>'
                      - self:
                            id: 11709
                            CType: 'theme_linklist'
                            colPos: 1
                            header: 'Read next'
                            tx_theme_list_items: '652,653,654'
                    listItem:
                      # The author's own links, 11706.
                      - self:
