              self:
                id: 1008
                title: 'Theme elements'
                slug: /elements/theme
                backend_layout: content
                abstract: 'The content elements this extension registers itself, one each; the pages below show the layouts of the heroes, the call to action and the quotation.'
                keywords: 'content elements, theme'
              entities:
                content:
                  -
                    self:
                      id: 1801
                      CType: theme_hero
                      header: 'The full hero'
                      header_layout: 2
                      bodytext: 'The hero carries a heading, a lead paragraph, one media slot and a single call to action. It is the widest element the theme ships and is meant to open a page.'
                      tx_theme_link: 't3://page?uid=1002'
                      tx_theme_link_label: 'Read the typography page'
                      tx_theme_link_variant: ''
                      tx_theme_link_icon: arrow-right
                  -
                    self:
                      id: 1802
                      CType: theme_hero_small
                      header: 'The reduced hero'
                      header_layout: 2
                      bodytext: 'The same fields as the full hero, rendered compactly. The element above and this one differ in nothing an editor fills in - only in the variant that was chosen.'
                      tx_theme_link: 't3://page?uid=1003'
                      tx_theme_link_label: 'Look at the media page'
                      tx_theme_link_variant: secondary
                  -
                    self:
                      id: 1803
                      CType: theme_hero_text_only
                      header: 'The hero without media'
                      header_layout: 2
                      bodytext: 'This variant has no image field in the backend form, so there is nothing to leave empty. What it demonstrates is the hero body on its own, full width.'
                      tx_theme_link: 't3://page?uid=1001'
                      tx_theme_link_label: 'Back to the start page'
                      tx_theme_link_variant: ghost
                  -
                    self:
                      id: 1804
                      CType: theme_teaser
                      header: 'A teaser without media'
                      bodytext: "A teaser is a secondary block: a heading, a couple of sentences and one link. Its heading defaults to h2 rather than the hero's h1."
                      tx_theme_link: 't3://page?uid=1004'
                      tx_theme_link_label: 'Open the empty page'
                      tx_theme_link_variant: link
                  -
                    self:
                      id: 1805
                      CType: theme_media_teaser
                      header: 'A teaser beside an image'
                      bodytext: 'Text and a single image side by side. The image is one file reference; the theme deliberately wires no gallery processing here, because there is no grid to arrange.'
                      tx_theme_link: 'https://docs.typo3.org/'
                      tx_theme_link_label: 'Read the TYPO3 documentation'
                      tx_theme_link_variant: ghost
                  -
                    self:
                      id: 1806
                      CType: theme_testimonial
                      header: 'Ada Lovelace'
                      subheader: 'Mathematician, 1843'
                      bodytext: 'The Analytical Engine weaves algebraic patterns just as the Jacquard loom weaves flowers and leaves.'
                  -
                    self:
                      id: 1807
                      CType: theme_author
                      header: 'Grace Hopper'
                      subheader: 'Compiler pioneer'
                      bodytext: 'Wrote the first compiler and spent the rest of her career arguing that a programming language should read like English.'
                      tx_theme_list_items: '1001,1002'
                  -
                    self:
                      id: 1808
                      CType: theme_linklist
                      header: 'Where to read more'
                      tx_theme_list_items: '1005,1003,1006,1004'
                  -
                    self:
                      id: 1809
                      CType: theme_sociallinks
                      header: Elsewhere
                      tx_theme_list_items: '1007,1019,1008,1009'
                  -
                    self:
                      id: 1810
                      CType: theme_media_teaser_grid
                      header: 'Three cards in a grid'
                      bodytext: "Every card is one row of the shared child table. The lead-in above is the element's own heading and body."
                      tx_theme_list_items: '1010,1011,1012'
                  -
                    self:
                      id: 1811
                      CType: theme_notice
                      tx_theme_notice_kind: note
                      header: 'A note'
                      bodytext: '<p>An aside to the text around it. It takes the note role and is never a live region, because nothing about it ever changes. It is also the kind a notice gets when nobody chose one.</p>'
                  -
                    self:
                      id: 1812
                      CType: theme_notice
                      tx_theme_notice_kind: info
                      header: Information
                      bodytext: '<p>The neutral kind, and the look of the bare class. It takes the status role, a polite live region that waits for a pause before it is read.</p>'
                  -
                    self:
                      id: 1813
                      CType: theme_notice
                      tx_theme_notice_kind: tip
                      header: 'A tip'
                      bodytext: '<p>A recommendation, and the one kind that follows the palette: switch the palette in the display settings, and this is the only notice that changes colour.</p>'
                  -
                    self:
                      id: 1814
                      CType: theme_notice
                      tx_theme_notice_kind: success
                      header: 'Something finished'
                      bodytext: '<p>Confirms that something went through. It takes the status role, like the information.</p>'
                  -
                    self:
                      id: 1815
                      CType: theme_notice
                      tx_theme_notice_kind: warning
                      header: 'A warning'
                      bodytext: '<p>Something needs attention before it becomes a problem. It takes the alert role, the assertive one.</p>'
                  -
                    self:
                      id: 1816
                      CType: theme_notice
                      tx_theme_notice_kind: danger
                      header: 'Something failed'
                      bodytext: '<p>Assertive like the warning, with a glyph of its own: once colours are forced, the glyph is what tells the six kinds apart.</p>'
                  -
                    self:
                      id: 1817
                      CType: theme_tabs
                      header: 'Three tabs'
                      header_layout: 2
                      tx_theme_list_items: '1013,1014,1015'
                  -
                    self:
                      id: 1818
                      CType: theme_accordion
                      header: 'An accordion'
                      header_layout: 2
                      tx_theme_list_items: '1016,1017,1018'
