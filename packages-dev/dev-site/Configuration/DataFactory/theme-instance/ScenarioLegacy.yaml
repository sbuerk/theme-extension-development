# The "/legacy/" tree of the seed set "theme-instance".
#
# GENERATED FILE. Written by "Build/Scripts/generateLegacyScenario.php" from
# "Configuration/DataFactory/theme-demo/Scenario.yaml" of the extension - edit
# that file and run the script, never this one.
#
# The showcase is delivered through the site set of the theme. This file holds
# a full mirror of it below a second site root, delivered through a root
# "sys_template" record and the classic static include instead. The site of
# this tree, "instance-core-*/config/sites/demo-legacy/", declares no
# dependency on the set, so the condition in
# "Configuration/TypoScript/Static/setup.typoscript" lets the static include
# through for it and for nothing else.
#
# Every mirrored record carries the uid of its original plus 1000, in every
# table, and so do the pointers at one the generator knows - a link and its
# content anchor, a menu page list, the "Insert records" element, an inline
# child list - so this tree links to itself and not out of it. The
# "sys_template" record has no original and is uid 1. The prose explaining a
# record is in the showcase, at its uid minus 1000.
#
# The two scenario files are composed into one before anything is written:
# "entitySettings" of the showcase apply here, and this file adds the one
# entity it needs on top of them.
entitySettings:
  template:
    tableName: sys_template
entities:
  page:
    -
      self:
        id: 1001
        title: 'Theme demo (sys_template delivery)'
        slug: /
        is_siteroot: 1
        backend_layout: start
      entities:
        template:
          -
            self:
              id: 1
              title: 'Theme demo, static include'
              root: 1
              clear: 3
              include_static_file: 'EXT:theme_extension_development/Configuration/TypoScript/Static'
        content:
          -
            self:
              id: 1101
              CType: header
              header: 'A frontend to look at'
              header_layout: 1
          -
            self:
              id: 1102
              CType: text
              header: 'What this is'
              header_layout: 2
              bodytext: "<p>This page tree is seeded from a definition in the repository, so a\ndevelopment instance can be rebuilt from nothing without clicking a\npage tree together by hand.</p>\n<p>Three sections are in the navigation: the\n<a href=\"t3://page?uid=1005\">content elements</a>, one page per\nelement with its variants; the\n<a href=\"t3://page?uid=1002\">typography</a>, from rich text and\nelements; and the <a href=\"t3://page?uid=1009\">styleguide</a>, which\nrenders every component of the library, with the\n<a href=\"t3://page?uid=1010\">form showcase</a>, a request form put\ntogether from the form components alone.</p>"
      children:
        -
          self:
            id: 1002
            title: Typography
            slug: /typography
            backend_layout: content
          entities:
            content:
              -
                self:
                  id: 1201
                  CType: header
                  header: Typography
                  header_layout: 1
              -
                self:
                  id: 1202
                  CType: text
                  header: 'Running text'
                  header_layout: 2
                  bodytext: "<p>A paragraph of running text, so the theme has something to set\nin its body font. It carries <strong>bold</strong> and\n<em>emphasised</em> words and a <a href=\"t3://page?uid=1001\">link</a>, which are\nthe three inline cases a stylesheet has to answer for.</p>\n"
              -
                self:
                  id: 1203
                  CType: text
                  header: 'A surface band, header centred'
                  header_layout: 2
                  header_position: center
                  frame_class: surface
                  space_before_class: large
                  bodytext: "<p>The frame \"Surface band\" fills the element with the surface\ncolour and draws the hairline around it. The header is centred,\nand the space before the element is \"large\".</p>"
              -
                self:
                  id: 1204
                  CType: text
                  header: 'A raised band, header at the end, looking like heading 4'
                  header_layout: 2
                  header_position: right
                  tx_theme_header_style: h4
                  frame_class: raised
                  bodytext: "<p>The raised surface is white in the light appearance, so the\nhairline is what draws this band there. The header is an h2 set\nin the look of heading 4.</p>"
              -
                self:
                  id: 1205
                  CType: text
                  header: 'An accent band, header in the display size'
                  header_layout: 2
                  tx_theme_header_style: display
                  frame_class: accent
                  bodytext: "<p>A tint of the primary accent of the active palette, with a\n<a href=\"t3://page?uid=1003\">link to the media page</a> in it:\nswitch the palette, and the tint follows it.</p>"
              -
                self:
                  id: 1206
                  CType: text
                  header: 'An inverse band, header at the start'
                  header_layout: 2
                  header_position: left
                  frame_class: inverse
                  space_after_class: extra-large
                  bodytext: "<p>The page in the other appearance: dark on a light page, light\non a dark one, with every colour of the theme turned with it -\nthe <a href=\"t3://page?uid=1001\">link to the start page</a> as well.\nThe space after the element is \"extra large\".</p>\n"
          children:
            -
              self:
                id: 1052
                title: Text
                slug: /typography/text
                backend_layout: content
              entities:
                content:
                  -
                    self:
                      id: 6201
                      CType: header
                      header: Text
                      header_layout: 1
                  -
                    self:
                      id: 6202
                      CType: text
                      bodytext: "<p class=\"theme-lead\">Running text, headings inside it, the inline\nsemantics and the alignments of the rich text editor - all from\none text element each.</p>\n<p>The rich text of these pages is written into the database the\nway a backend save writes it, so the processing of the rich text\npreset has run over it. It has not been typed into the editor:\nseveral things here need its source view.</p>"
                  -
                    self:
                      id: 6203
                      CType: text
                      header: 'Headings inside the text'
                      header_layout: 2
                      bodytext: "<p>The header of the element is its heading 2. The rich text\ncontinues the outline below it.</p>\n<h3>A heading 3 inside the text</h3>\n<p>The editor offers heading 2 and heading 3, so a text can carry\nsections of its own without an element per section.</p>\n<h3>A second heading 3, long enough to wrap onto a second line at\nthe width of the content column</h3>\n<p>A long heading is balanced over its lines, so the last line is\nnot a single orphaned word.</p>"
                  -
                    self:
                      id: 6204
                      CType: text
                      header: 'Inline semantics'
                      header_layout: 2
                      bodytext: "<p><strong>Strong importance</strong> and <em>stress emphasis</em>,\n<mark>a marked passage</mark>, <small>small print</small>,\n<s>no longer accurate</s>, <del>deleted</del> and <ins>inserted</ins>\ntext, H<sub>2</sub>O and E = mc<sup>2</sup>.</p>\n<p>An <abbr title=\"Rich Text Editor\">RTE</abbr> writes\n<code>&lt;p&gt;</code> around a paragraph; <kbd>Ctrl</kbd> +\n<kbd>B</kbd> makes a word strong. A <dfn>content element</dfn> is\na record rendered into a column of a page. <q>A quotation inside\na sentence</q>, as <cite>the style guide</cite> puts it, gets its\nquotation marks from the language.</p>"
                  -
                    self:
                      id: 6205
                      CType: text
                      header: Alignment
                      header_layout: 2
                      bodytext: "<p class=\"theme-text--start\">Aligned to the start of the line, which\nis where every paragraph starts anyway.</p>\n<p class=\"theme-text--center\">Centred, for a short line that stands\non its own.</p>\n<p class=\"theme-text--end\">Aligned to the end of the line.</p>\n<p class=\"theme-text--justify\">Justified: both edges of the column\nare straight, and the spaces between the words stretch to make them\nso. Without hyphenation the gaps grow on a narrow column, which is\nwhy the theme leaves justification to the paragraph that asks for\nit.</p>"
                  -
                    self:
                      id: 6206
                      CType: text
                      header: 'Language and direction'
                      header_layout: 2
                      bodytext: "<p lang=\"de\">Ein deutscher Absatz mit langen Zusammensetzungen wie\nInhaltselementdarstellung und Seitenbaumkonfigurationsdatei: mit der\nSprache am Absatz trennt der Browser sie am Zeilenende.</p>\n<p dir=\"rtl\" lang=\"ar\">هذه فقرة قصيرة باللغة العربية، تبدأ من\nاليمين وتنتهي في اليسار.</p>\n"
            -
              self:
                id: 1053
                title: Lists
                slug: /typography/lists
                backend_layout: content
              entities:
                content:
                  -
                    self:
                      id: 6301
                      CType: header
                      header: Lists
                      header_layout: 1
                  -
                    self:
                      id: 6302
                      CType: text
                      header: 'Lists inside the text'
                      header_layout: 2
                      bodytext: "<p>The lists of the rich text keep the markers of the element\nbaseline, nested lists included:</p>\n<ul>\n  <li>A first item</li>\n  <li>A second item, holding a list of its own\n    <ul>\n      <li>A nested item</li>\n      <li>A second nested item\n        <ul><li>A third level</li></ul>\n      </li>\n    </ul>\n  </li>\n  <li>A last item</li>\n</ul>\n<ol>\n  <li>A first step</li>\n  <li>A second step, with sub steps\n    <ol><li>A sub step</li><li>Another sub step</li></ol>\n  </li>\n  <li>A last step</li>\n</ol>"
                  -
                    self:
                      id: 6303
                      CType: text
                      header: 'The list component inside the text'
                      header_layout: 2
                      bodytext: "<p>The class of a list is kept by the rich text processing, so a\nlist in the source view can be one of the list component:</p>\n<ul class=\"theme-list theme-list--check\">\n  <li>Check marks, from the source view</li>\n  <li>The same component the bullet list element renders</li>\n</ul>\n<ul class=\"theme-list theme-list--columns-2\">\n  <li>Header</li><li>Text</li><li>Text &amp; Images</li>\n  <li>Text &amp; Media</li><li>Images</li><li>Bullet list</li>\n  <li>Table</li><li>File links</li>\n</ul>\n"
                  -
                    self:
                      id: 6304
                      CType: bullets
                      header: 'A definition list from the bullet list element'
                      header_layout: 2
                      bullets_type: 2
                      bodytext: "Unstyled|No marker and no indent\nCheck|A check mark in front of every item\nIcon|An icon of the set in front of every item\nColumns|The items flow into two or three columns\nDivided|A hairline between the rows"
                  -
                    self:
                      id: 6305
                      CType: text
                      bodytext: '<p>Every layout of the bullet list element is on its <a href="t3://page?uid=1035">own page</a>.</p>'
            -
              self:
                id: 1054
                title: Tables
                slug: /typography/tables
                backend_layout: content
              entities:
                content:
                  -
                    self:
                      id: 6401
                      CType: header
                      header: Tables
                      header_layout: 1
                  -
                    self:
                      id: 6402
                      CType: text
                      header: 'A table inside the text'
                      header_layout: 2
                      bodytext: "<p>A table of the rich text, with the classes of the table\ncomponent written in the source view. It has no scroll region of\nits own, so it has to fit the column.</p>\n<table class=\"theme-table theme-table--striped\">\n  <caption>The two appearances</caption>\n  <thead><tr><th scope=\"col\">Appearance</th><th scope=\"col\">Background</th><th scope=\"col\">Text</th></tr></thead>\n  <tbody>\n    <tr><th scope=\"row\">Light</th><td>A near white</td><td>A near black</td></tr>\n    <tr><th scope=\"row\">Dark</th><td>A near black</td><td>A near white</td></tr>\n  </tbody>\n</table>"
                  -
                    self:
                      id: 6403
                      CType: table
                      header: 'The table element, with a header column and a footer'
                      header_layout: 2
                      table_class: compact
                      table_caption: 'Contrast of the text colours on the page background'
                      table_delimiter: 124
                      table_enclosure: 0
                      table_header_position: 2
                      table_tfoot: 1
                      bodytext: "Primary text|The body copy|at least 7:1\nSecondary text|Leads and captions|at least 4.5:1\nMuted text|Dates and hints|at least 4.5:1\nEvery text colour|Holds AA on its surface|4.5:1"
                  -
                    self:
                      id: 6404
                      CType: text
                      bodytext: '<p>Every class of the table element is on its <a href="t3://page?uid=1036">own page</a>.</p>'
            -
              self:
                id: 1055
                title: 'Quotes and code'
                slug: /typography/quotes-and-code
                backend_layout: content
              entities:
                content:
                  -
                    self:
                      id: 6501
                      CType: header
                      header: 'Quotes and code'
                      header_layout: 1
                  -
                    self:
                      id: 6502
                      CType: text
                      header: 'A quotation inside the text'
                      header_layout: 2
                      bodytext: "<p>A block quotation of the rich text, set apart from the running\ntext around it:</p>\n<blockquote><p>Programs must be written for people to read, and only\nincidentally for machines to execute.</p></blockquote>\n<p>- <cite>Abelson and Sussman, Structure and Interpretation of\nComputer Programs</cite></p>\n"
                  -
                    self:
                      id: 6503
                      CType: theme_testimonial
                      header: 'Harold Abelson and Gerald Jay Sussman'
                      subheader: 'Preface to the first edition, 1985'
                      bodytext: '<p>Programs must be written for people to read, and only incidentally for machines to execute.</p>'
                  -
                    self:
                      id: 6504
                      CType: text
                      header: 'Preformatted text inside the text'
                      header_layout: 2
                      bodytext: "<p>The editor offers \"Pre-Formatted Text\" as a heading option. It\nkeeps line breaks and spaces, and scrolls rather than wraps:</p>\n<pre><code>tt_content.bullets =&lt; lib.contentElement\ntt_content.bullets.templateName = ContentElements/Bullets</code></pre>\n"
                  -
                    self:
                      id: 6505
                      CType: html
                      header: 'A code block with its file name (name only, not rendered)'
                      bodytext: "<h2 class=\"theme-content-element__heading\">A code block with its file name</h2>\n<figure class=\"theme-code\">\n    <figcaption class=\"theme-code__caption\">\n        <span class=\"theme-code__filename\">config/sites/demo/config.yaml</span>\n        <span class=\"theme-code__language\">YAML</span>\n    </figcaption>\n    <pre class=\"theme-code__block\" role=\"region\" tabindex=\"0\" aria-label=\"config/sites/demo/config.yaml\"><code>base: 'https://theme.example.com/'\nrootPageId: 1\ndependencies:\n  - sbuerk/theme-extension-development</code></pre>\n</figure>\n"
            -
              self:
                id: 1056
                title: Article
                slug: /typography/article
                backend_layout: content
              entities:
                content:
                  -
                    self:
                      id: 6601
                      CType: header
                      header: 'How a content element reaches the page'
                      header_layout: 1
                  -
                    self:
                      id: 6602
                      CType: text
                      bodytext: "<p class=\"theme-lead\">An editor fills in a form and saves it. A\nmoment later a visitor reads a paragraph. Between the two lie a\ndatabase row, a few lines of configuration and a template - and\neach of them decides something about what the visitor sees.</p>\n<p>This article follows one element along that way. It is also a\nspecimen: a long text, set with the components a site package gets\nfrom the theme, so the rhythm of headings, paragraphs, lists,\nfigures, tables and code can be read as a whole rather than one\nspecimen at a time.</p>"
                  -
                    self:
                      id: 6603
                      CType: text
                      header: 'The record'
                      header_layout: 2
                      bodytext: "<p>Everything starts as a row of the table <code>tt_content</code>.\nIts type, the CType, decides which fields the form shows and which\nrendering the frontend picks. The fields an editor fills in are\nplain columns of that row: a header, a text, a layout, a frame.</p>\n<h3>What the form does not show</h3>\n<p>Some columns are there without a field in the form. The page the\nelement belongs to, its position in the column and its language are\nwritten by the backend itself. They matter just as much: a content\nelement is rendered because a page asks for the content of one of\nits columns, not because the element exists.</p>"
                  -
                    self:
                      id: 6604
                      CType: textpic
                      header: 'The frame'
                      header_layout: 2
                      imageorient: 17
                      imagecols: 1
                      bodytext: "<p>Every element is rendered through one frame, the layout\n<code>ContentElement</code> of the theme. It writes the wrapper\nwith the anchor of the element, the CType as a modifier and as an\nattribute, and the modifiers of the appearance fields: the band of\nthe frame, the space before and after.</p>\n<p>The frame is also what the outlines of the development mode\ndraw. Switch them on in the display settings, and every element\nof this article shows its boundary and its CType - the image\nbeside this text belongs to the same element as the text itself.</p>\n<p>The image is placed in the text, at the end of the line. The\ngallery processor of the core computes its width from the column\nand the number of columns, and the theme floats it, so this text\nflows around it and continues under it once it is past.</p>"
                  -
                    self:
                      id: 6605
                      CType: bullets
                      header: 'What the frame reads'
                      header_layout: 2
                      bullets_type: 0
                      layout: 1
                      bodytext: "The frame: default, no frame, or one of four bands\nThe space before and after the element\nThe alignment and the look of the header\nThe CType, for the modifier and the outline"
                  -
                    self:
                      id: 6606
                      CType: text
                      header: 'The template'
                      header_layout: 2
                      bodytext: "<p>Inside the frame, the template of the CType renders what is\nparticular to it. A text element renders its header and its rich\ntext; a table element renders a table from the lines of its text\nfield, split by a data processor before the template sees them.</p>\n<blockquote><p>A template receives data it can render and never\ncomputes what a processor could hand it.</p></blockquote>\n<p>That division is the reason a table element and a table of the\nrich text look the same: both end in the same component, one from\na processor, the other from the source view of the editor.</p>"
                  -
                    self:
                      id: 6607
                      CType: table
                      header: 'The fields of a table element'
                      header_layout: 3
                      table_class: striped
                      table_caption: 'What the table element reads, and what it does with it'
                      table_delimiter: 124
                      table_enclosure: 0
                      table_header_position: 1
                      bodytext: "Field|Holds|Read by\nbodytext|The rows, one per line|TableProcessor\ntable_delimiter|The character code of the column separator|TableProcessor\ntable_header_position|Header row, header column, or none|TableProcessor\ntable_class|The look of the table|Table.html"
                  -
                    self:
                      id: 6608
                      CType: html
                      header: 'The TypoScript of the bullet list (name only, not rendered)'
                      bodytext: "<figure class=\"theme-code\">\n    <figcaption class=\"theme-code__caption\">\n        <span class=\"theme-code__filename\">Configuration/TypoScript/ContentElements.typoscript</span>\n        <span class=\"theme-code__language\">TypoScript</span>\n    </figcaption>\n    <pre class=\"theme-code__block\" role=\"region\" tabindex=\"0\" aria-label=\"Configuration/TypoScript/ContentElements.typoscript\"><code>tt_content.bullets =&lt; lib.contentElement\ntt_content.bullets {\n    templateName = ContentElements/Bullets\n}</code></pre>\n</figure>"
                  -
                    self:
                      id: 6609
                      CType: text
                      header: 'What is left to the editor'
                      header_layout: 2
                      bodytext: "<p>The editor chooses the type, fills in the fields and picks from\nthe values the form offers. The theme offers only values it\nrenders: a frame it does not draw is not in the list, and a field\nit does not read is not in the form.</p>\n<p>Everything else - the markup, the spacing, the colours in both\nappearances - follows from the theme, which is what lets a page of\nmany elements read as one page.</p>\n"
        -
          self:
            id: 1003
            title: Media
            slug: /media
            backend_layout: content
          entities:
            content:
              -
                self:
                  id: 1301
                  CType: header
                  header: Media
                  header_layout: 1
              -
                self:
                  id: 1302
                  CType: image
                  header: 'A single image'
                  header_layout: 2
              -
                self:
                  id: 1303
                  CType: image
                  header: 'Two images, two columns'
                  header_layout: 2
                  imagecols: 2
        -
          self:
            id: 1004
            title: 'Empty page'
            slug: /empty
            nav_hide: 1
        -
          self:
            id: 1005
            title: Elements
            slug: /elements
            backend_layout: content
          entities:
            content:
              -
                self:
                  id: 1501
                  CType: header
                  header: Elements
                  header_layout: 1
              -
                self:
                  id: 1502
                  CType: text
                  bodytext: "<p>Three pages, one per family: the classic types\n<em>EXT:frontend</em> registers without supplying a rendering,\nthe eleven menu types, and the thirteen this extension adds itself.\nEvery one of them appears exactly once, so a single branch of the\ntree answers what the theme does with each.</p>\n<p>Below the classic types, each has a page of its own with its\nvariants, and the <a href=\"t3://page?uid=1051\">Frames</a> page shows\nevery value of the Appearance tab, one element each.</p>"
          children:
            -
              self:
                id: 1006
                title: 'Core elements'
                slug: /elements/core
                abstract: 'Every classic content type EXT:frontend registers without supplying a rendering for it.'
                keywords: 'content elements, core'
                backend_layout: content_sidebar
              entities:
                content:
                  -
                    self:
                      id: 1601
                      CType: header
                      header: 'Core elements'
                      header_layout: 1
                  -
                    self:
                      id: 1602
                      CType: text
                      header: 'What this page is'
                      header_layout: 2
                      bodytext: "<p>Every classic content type this theme renders is on this\npage exactly once, so a single URL answers what each one\nlooks like and which of its fields the theme actually reads.\nThe copy of each element describes that element.</p>\n<p>The rendering is defined in\n<em>Configuration/TypoScript/ContentElements.typoscript</em>.\nThis theme does not depend on <em>fluid_styled_content</em>,\nso a content type without a branch in that file would render\nthe core's <strong>\"no rendering definition\"</strong> notice\ninstead of anything at all.</p>\n<p>Each of them also has a page of its own below this one, in the\nsub navigation, showing its variants: every orientation of\n<a href=\"t3://page?uid=1032\">Text &amp; Images</a>, every layout of\nthe <a href=\"t3://page?uid=1035\">bullet list</a>, every class of the\n<a href=\"t3://page?uid=1036\">table</a> and so on.</p>\n"
                  -
                    self:
                      id: 1603
                      CType: bullets
                      header: 'Bullet list'
                      header_layout: 2
                      bullets_type: 0
                      bodytext: "One item per line, with no markup and no delimiter\nEach line is escaped on output, so a typed tag stays text\nbullets_type 1 renders the same lines as an ordered list\nbullets_type 2 renders them as a definition list of terms\n"
                  -
                    self:
                      id: 1604
                      CType: table
                      header: Table
                      header_layout: 2
                      table_caption: 'The five table_* fields, and what this element sets them to'
                      table_delimiter: 124
                      table_enclosure: 0
                      table_header_position: 1
                      table_tfoot: 1
                      bodytext: "Field|What it stores|Value on this element\ntable_delimiter|The character CODE of the column separator|124, a vertical bar\ntable_enclosure|The character CODE of the quoting character, 0 for none|0\ntable_header_position|0 none, 1 first row, 2 first column|1\ntable_tfoot|Whether the last row becomes a table footer|1\nDecoded by|Classes/DataProcessing/TableProcessor.php|not by Table.html\n"
                  -
                    self:
                      id: 1605
                      CType: textpic
                      header: 'Text & Images'
                      header_layout: 2
                      imageorient: 17
                      imagecols: 1
                      bodytext: "<p>Reads the <em>image</em> field, which the core TCA\nrestricts to images. The gallery is placed by\n<em>imageorient</em> - 17 here, \"in text, right\" - and split\ninto <em>imagecols</em> columns, both of them computed by\nthe core's <strong>GalleryProcessor</strong> rather than by\nthe template.</p>\n"
                  -
                    self:
                      id: 1606
                      CType: textmedia
                      header: 'Text & Media'
                      header_layout: 2
                      imageorient: 8
                      imagecols: 2
                      bodytext: "<p>Reads the <em>assets</em> field instead of\n<em>image</em>, so a video or an audio file is allowed here\nwhere \"Text &amp; Images\" above would refuse it. With\n<em>imageorient</em> 8 the media sits below the text and\ncentered, and <em>imagecols</em> 2 puts the two files side\nby side.</p>\n"
                  -
                    self:
                      id: 1607
                      CType: image
                      header: Images
                      header_layout: 2
                  -
                    self:
                      id: 1608
                      CType: uploads
                      header: 'File links'
                      header_layout: 2
                      uploads_type: 2
                      filelink_size: 1
                      uploads_description: 1
                      filelink_sorting: name
                      filelink_sorting_direction: asc
                  -
                    self:
                      id: 1609
                      CType: html
                      header: 'Plain HTML (name only, not rendered)'
                      bodytext: "<h2 class=\"theme-content-element__heading\">Plain HTML</h2>\n<p>This paragraph, its heading and the class on that heading\nwere written as raw markup in <code>bodytext</code> and\nreached the page untouched. Nothing was escaped and no rich\ntext parsing ran, which is what separates this element from\n\"Text\" further up - the <code>code</code> tags in this\nsentence survive here in every installation. That\nelement's field is declared <em>enableRichtext</em>, so a\nsave keeps only what the processing of the rich text preset\nallows: <code>code</code> with the theme's preset, nothing\nof the kind without the rich text editor installed. Access to raw HTML is not restricted by\nanything in the frontend: the <code>CType</code> field\ncarries <code>authMode = explicitAllow</code>, so a\nnon-admin editor can only pick it if a backend group grants\nit explicitly.</p>\n<p>Two elements follow that have no visible header either.\nThe horizontal rule below is the <strong>Divider</strong>\nelement, which renders nothing but that rule. After it,\n<strong>Insert Records</strong> renders the page's own\n\"Core elements\" heading a second time - it is a reference to\nthe first element on this page, not a copy of it.</p>\n"
                  -
                    self:
                      id: 1610
                      CType: div
                      header: 'Divider before the record reference'
                  -
                    self:
                      id: 1611
                      CType: shortcut
                      header: 'Insert records (name only, not rendered)'
                      records: tt_content_1601
