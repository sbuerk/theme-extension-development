                        self:
                          id: 8003
                          CType: theme_text_icon
                          header: 'Configure once, in the site'
                          header_layout: 2
                          bodytext: "<p>A site depends on the site set of the theme - on TYPO3 v12 it\nincludes the static template instead - and constants and setup arrive\ntogether. Nothing is copied into the site package.</p>\n"
                          tx_theme_icon: gear
                          tx_theme_icon_position: start
                          tx_theme_icon_shape: square
                          tx_theme_icon_size: md
                          tx_theme_link: 't3://page?uid=1009'
                          tx_theme_link_label: 'Open the styleguide'
                          tx_theme_link_variant: ''
                      -
                        self:
                          id: 8004
                          CType: theme_text_icon
                          header: 'Templates that stay readable'
                          header_layout: 2
                          bodytext: "<p>Every element is one Fluid template on the contract of a component.\nA site package overrides the one file it wants to change and keeps the\nrest.</p>\n"
                          tx_theme_icon: code
                          tx_theme_icon_position: end
                          tx_theme_icon_shape: circle
                          tx_theme_icon_size: lg
                          tx_theme_link: 't3://page?uid=1006'
                          tx_theme_link_label: 'See the core elements'
                          tx_theme_link_variant: secondary
                          tx_theme_link_icon: arrow-right
                      -
