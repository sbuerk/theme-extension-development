      children:
        -
          self:
            id: 1002
            title: Typography
            slug: /typography
            backend_layout: content
          entities:
            content:
              -
                self:
                  id: 1201
                  CType: header
                  header: Typography
                  header_layout: 1
              -
                self:
                  id: 1202
                  CType: text
                  header: 'Running text'
                  header_layout: 2
                  bodytext: "<p>A paragraph of running text, so the theme has something to set\nin its body font. It carries <strong>bold</strong> and\n<em>emphasised</em> words and a <a href=\"t3://page?uid=1001\">link</a>, which are\nthe three inline cases a stylesheet has to answer for.</p>\n"
              -
                self:
                  id: 1203
                  CType: text
                  header: 'A surface band, header centred'
                  header_layout: 2
                  header_position: center
                  frame_class: surface
                  space_before_class: large
                  bodytext: "<p>The frame \"Surface band\" fills the element with the surface\ncolour and draws the hairline around it. The header is centred,\nand the space before the element is \"large\".</p>"
              -
                self:
                  id: 1204
                  CType: text
                  header: 'A raised band, header at the end, looking like heading 4'
                  header_layout: 2
                  header_position: right
                  tx_theme_header_style: h4
                  frame_class: raised
                  bodytext: "<p>The raised surface is white in the light appearance, so the\nhairline is what draws this band there. The header is an h2 set\nin the look of heading 4.</p>"
              -
                self:
                  id: 1205
                  CType: text
                  header: 'An accent band, header in the display size'
                  header_layout: 2
                  tx_theme_header_style: display
                  frame_class: accent
                  bodytext: "<p>A tint of the primary accent of the active palette, with a\n<a href=\"t3://page?uid=1003\">link to the media page</a> in it:\nswitch the palette, and the tint follows it.</p>"
              -
                self:
                  id: 1206
                  CType: text
                  header: 'An inverse band, header at the start'
                  header_layout: 2
                  header_position: left
                  frame_class: inverse
                  space_after_class: extra-large
                  bodytext: "<p>The page in the other appearance: dark on a light page, light\non a dark one, with every colour of the theme turned with it -\nthe <a href=\"t3://page?uid=1001\">link to the start page</a> as well.\nThe space after the element is \"extra large\".</p>\n"
          children:
            -
              self:
                id: 1052
                title: Text
                slug: /typography/text
                backend_layout: content
              entities:
                content:
                  -
                    self:
                      id: 6201
                      CType: header
                      header: Text
                      header_layout: 1
                  -
                    self:
                      id: 6202
                      CType: text
                      bodytext: "<p class=\"theme-lead\">Running text, headings inside it, the inline\nsemantics and the alignments of the rich text editor - all from\none text element each.</p>\n<p>The rich text of these pages is written into the database the\nway a backend save writes it, so the processing of the rich text\npreset has run over it. It has not been typed into the editor:\nseveral things here need its source view.</p>"
                  -
                    self:
                      id: 6203
                      CType: text
                      header: 'Headings inside the text'
                      header_layout: 2
                      bodytext: "<p>The header of the element is its heading 2. The rich text\ncontinues the outline below it.</p>\n<h3>A heading 3 inside the text</h3>\n<p>The editor offers heading 2 and heading 3, so a text can carry\nsections of its own without an element per section.</p>\n<h3>A second heading 3, long enough to wrap onto a second line at\nthe width of the content column</h3>\n<p>A long heading is balanced over its lines, so the last line is\nnot a single orphaned word.</p>"
                  -
                    self:
                      id: 6204
                      CType: text
                      header: 'Inline semantics'
                      header_layout: 2
                      bodytext: "<p><strong>Strong importance</strong> and <em>stress emphasis</em>,\n<mark>a marked passage</mark>, <small>small print</small>,\n<s>no longer accurate</s>, <del>deleted</del> and <ins>inserted</ins>\ntext, H<sub>2</sub>O and E = mc<sup>2</sup>.</p>\n<p>An <abbr title=\"Rich Text Editor\">RTE</abbr> writes\n<code>&lt;p&gt;</code> around a paragraph; <kbd>Ctrl</kbd> +\n<kbd>B</kbd> makes a word strong. A <dfn>content element</dfn> is\na record rendered into a column of a page. <q>A quotation inside\na sentence</q>, as <cite>the style guide</cite> puts it, gets its\nquotation marks from the language.</p>"
                  -
                    self:
                      id: 6205
                      CType: text
                      header: Alignment
                      header_layout: 2
                      bodytext: "<p class=\"theme-text--start\">Aligned to the start of the line, which\nis where every paragraph starts anyway.</p>\n<p class=\"theme-text--center\">Centred, for a short line that stands\non its own.</p>\n<p class=\"theme-text--end\">Aligned to the end of the line.</p>\n<p class=\"theme-text--justify\">Justified: both edges of the column\nare straight, and the spaces between the words stretch to make them\nso. Without hyphenation the gaps grow on a narrow column, which is\nwhy the theme leaves justification to the paragraph that asks for\nit.</p>"
                  -
                    self:
                      id: 6206
                      CType: text
                      header: 'Language and direction'
                      header_layout: 2
                      bodytext: "<p lang=\"de\">Ein deutscher Absatz mit langen Zusammensetzungen wie\nInhaltselementdarstellung und Seitenbaumkonfigurationsdatei: mit der\nSprache am Absatz trennt der Browser sie am Zeilenende.</p>\n<p dir=\"rtl\" lang=\"ar\">هذه فقرة قصيرة باللغة العربية، تبدأ من\nاليمين وتنتهي في اليسار.</p>\n"
            -
              self:
                id: 1053
                title: Lists
                slug: /typography/lists
                backend_layout: content
              entities:
                content:
                  -
                    self:
                      id: 6301
                      CType: header
                      header: Lists
                      header_layout: 1
                  -
                    self:
                      id: 6302
                      CType: text
                      header: 'Lists inside the text'
                      header_layout: 2
                      bodytext: "<p>The lists of the rich text keep the markers of the element\nbaseline, nested lists included:</p>\n<ul>\n  <li>A first item</li>\n  <li>A second item, holding a list of its own\n    <ul>\n      <li>A nested item</li>\n      <li>A second nested item\n        <ul><li>A third level</li></ul>\n      </li>\n    </ul>\n  </li>\n  <li>A last item</li>\n</ul>\n<ol>\n  <li>A first step</li>\n  <li>A second step, with sub steps\n    <ol><li>A sub step</li><li>Another sub step</li></ol>\n  </li>\n  <li>A last step</li>\n</ol>"
                  -
                    self:
                      id: 6303
                      CType: text
                      header: 'The list component inside the text'
                      header_layout: 2
                      bodytext: "<p>The class of a list is kept by the rich text processing, so a\nlist in the source view can be one of the list component:</p>\n<ul class=\"theme-list theme-list--check\">\n  <li>Check marks, from the source view</li>\n  <li>The same component the bullet list element renders</li>\n</ul>\n<ul class=\"theme-list theme-list--columns-2\">\n  <li>Header</li><li>Text</li><li>Text &amp; Images</li>\n  <li>Text &amp; Media</li><li>Images</li><li>Bullet list</li>\n  <li>Table</li><li>File links</li>\n</ul>\n"
                  -
                    self:
                      id: 6304
                      CType: bullets
                      header: 'A definition list from the bullet list element'
                      header_layout: 2
                      bullets_type: 2
                      bodytext: "Unstyled|No marker and no indent\nCheck|A check mark in front of every item\nIcon|An icon of the set in front of every item\nColumns|The items flow into two or three columns\nDivided|A hairline between the rows"
                  -
                    self:
                      id: 6305
                      CType: text
                      bodytext: '<p>Every layout of the bullet list element is on its <a href="t3://page?uid=1035">own page</a>.</p>'
            -
              self:
                id: 1054
                title: Tables
                slug: /typography/tables
                backend_layout: content
              entities:
                content:
                  -
                    self:
                      id: 6401
                      CType: header
                      header: Tables
                      header_layout: 1
                  -
                    self:
                      id: 6402
                      CType: text
                      header: 'A table inside the text'
                      header_layout: 2
                      bodytext: "<p>A table of the rich text, with the classes of the table\ncomponent written in the source view. It has no scroll region of\nits own, so it has to fit the column.</p>\n<table class=\"theme-table theme-table--striped\">\n  <caption>The two appearances</caption>\n  <thead><tr><th scope=\"col\">Appearance</th><th scope=\"col\">Background</th><th scope=\"col\">Text</th></tr></thead>\n  <tbody>\n    <tr><th scope=\"row\">Light</th><td>A near white</td><td>A near black</td></tr>\n    <tr><th scope=\"row\">Dark</th><td>A near black</td><td>A near white</td></tr>\n  </tbody>\n</table>"
                  -
                    self:
                      id: 6403
                      CType: table
                      header: 'The table element, with a header column and a footer'
                      header_layout: 2
                      table_class: compact
                      table_caption: 'Contrast of the text colours on the page background'
                      table_delimiter: 124
                      table_enclosure: 0
                      table_header_position: 2
                      table_tfoot: 1
                      bodytext: "Primary text|The body copy|at least 7:1\nSecondary text|Leads and captions|at least 4.5:1\nMuted text|Dates and hints|at least 4.5:1\nEvery text colour|Holds AA on its surface|4.5:1"
                  -
                    self:
                      id: 6404
                      CType: text
                      bodytext: '<p>Every class of the table element is on its <a href="t3://page?uid=1036">own page</a>.</p>'
            -
              self:
                id: 1055
                title: 'Quotes and code'
                slug: /typography/quotes-and-code
                backend_layout: content
              entities:
                content:
                  -
                    self:
                      id: 6501
                      CType: header
                      header: 'Quotes and code'
                      header_layout: 1
                  -
                    self:
                      id: 6502
                      CType: text
                      header: 'A quotation inside the text'
                      header_layout: 2
                      bodytext: "<p>A block quotation of the rich text, set apart from the running\ntext around it:</p>\n<blockquote><p>Programs must be written for people to read, and only\nincidentally for machines to execute.</p></blockquote>\n<p>- <cite>Abelson and Sussman, Structure and Interpretation of\nComputer Programs</cite></p>\n"
                  -
                    self:
                      id: 6503
                      CType: theme_testimonial
                      header: 'Harold Abelson and Gerald Jay Sussman'
                      subheader: 'Preface to the first edition, 1985'
                      bodytext: 'Programs must be written for people to read, and only incidentally for machines to execute.'
                  -
                    self:
                      id: 6504
                      CType: text
                      header: 'Preformatted text inside the text'
                      header_layout: 2
                      bodytext: "<p>The editor offers \"Pre-Formatted Text\" as a heading option. It\nkeeps line breaks and spaces, and scrolls rather than wraps:</p>\n<pre><code>tt_content.bullets =&lt; lib.contentElement\ntt_content.bullets.templateName = ContentElements/Bullets</code></pre>\n"
                  -
                    self:
                      id: 6505
                      CType: html
                      header: 'A code block with its file name (name only, not rendered)'
                      bodytext: "<h2 class=\"theme-content-element__heading\">A code block with its file name</h2>\n<figure class=\"theme-code\">\n    <figcaption class=\"theme-code__caption\">\n        <span class=\"theme-code__filename\">config/sites/demo/config.yaml</span>\n        <span class=\"theme-code__language\">YAML</span>\n    </figcaption>\n    <pre class=\"theme-code__block\" role=\"region\" tabindex=\"0\" aria-label=\"config/sites/demo/config.yaml\"><code>base: 'https://theme.example.com/'\nrootPageId: 1\ndependencies:\n  - sbuerk/theme-extension-development</code></pre>\n</figure>\n"
            -
              self:
                id: 1056
                title: Article
                slug: /typography/article
                backend_layout: content_sidebar
              entities:
                content:
                  -
                    self:
                      id: 6601
                      CType: header
                      header: 'How a content element reaches the page'
                      header_layout: 1
                      sectionIndex: 0
                  -
                    self:
                      id: 6602
                      CType: html
                      header: 'Byline (not visible in the frontend)'
                      sectionIndex: 0
                      bodytext: "<p class=\"theme-byline\">\n    <span class=\"theme-byline__item\">By <span class=\"theme-byline__author\">The theme team</span></span>\n    <time class=\"theme-byline__item\" datetime=\"2026-09-20\">20 September 2026</time>\n    <span class=\"theme-byline__item\">Six minutes</span>\n</p>"
                  -
                    self:
                      id: 6603
                      CType: text
                      bodytext: "<p class=\"theme-lead\">An editor fills in a form and saves it. A\nmoment later a visitor reads a paragraph. Between the two lie a\ndatabase row, a few lines of configuration and a template - and\neach of them decides something about what the visitor sees.</p>\n<p>This article follows one element along that way. It is also a\nspecimen: a long text, set with the components a site package gets\nfrom the theme, so the rhythm of headings, paragraphs, lists,\nfigures, tables and code can be read as a whole rather than one\nspecimen at a time.</p>"
                  -
                    self:
                      id: 6604
                      CType: text
                      header: 'The record'
                      header_layout: 2
                      bodytext: "<p>Everything starts as a row of the table <code>tt_content</code>.\nIts type, the CType, decides which fields the form shows and which\nrendering the frontend picks. The fields an editor fills in are\nplain columns of that row: a header, a text, a layout, a frame.</p>\n<h3>What the form does not show</h3>\n<p>Some columns are there without a field in the form. The page the\nelement belongs to, its position in the column and its language are\nwritten by the backend itself. They matter just as much: a content\nelement is rendered because a page asks for the content of one of\nits columns<sup class=\"theme-footnote-ref\" id=\"fnref1\"><a href=\"#fn1\">1</a></sup>,\nnot because the element exists.</p>"
                  -
                    self:
                      id: 6605
                      CType: textpic
                      header: 'The frame'
                      header_layout: 2
                      imageorient: 17
                      imagecols: 1
                      bodytext: "<p>Every element is rendered through one frame, the layout\n<code>ContentElement</code> of the theme. It writes the wrapper\nwith the anchor of the element, the CType as a modifier and as an\nattribute, and the modifiers of the appearance fields: the band of\nthe frame, the space before and after.</p>\n<p>The frame is also what the outlines of the development mode\ndraw. Switch them on in the display settings, and every element\nof this article shows its boundary and its CType - the image\nbeside this text belongs to the same element as the text itself.</p>\n<p>The image is placed in the text, at the end of the line. The\ngallery processor of the core computes its width from the column\nand the number of columns, and the theme floats it, so this text\nflows around it and continues under it once it is past.</p>"
                  -
                    self:
                      id: 6606
                      CType: bullets
                      header: 'What the frame reads'
                      header_layout: 2
                      bullets_type: 0
                      layout: 1
                      bodytext: "The frame: default, no frame, or one of four bands\nThe space before and after the element\nThe alignment and the look of the header\nThe CType, for the modifier and the outline"
                  -
                    self:
                      id: 6607
                      CType: text
                      header: 'The template'
                      header_layout: 2
                      bodytext: "<p>Inside the frame, the template of the CType renders what is\nparticular to it. A text element renders its header and its rich\ntext; a table element renders a table from the lines of its text\nfield, split by a data processor before the template sees them.</p>\n<blockquote><p>A template receives data it can render and never\ncomputes what a processor could hand it.</p></blockquote>\n<p>That division is the reason a table element and a table of the\nrich text look the same: both end in the same component, one from\na processor, the other from the source view of the\neditor<sup class=\"theme-footnote-ref\" id=\"fnref2\"><a href=\"#fn2\">2</a></sup>.</p>"
                  -
                    self:
                      id: 6608
                      CType: table
                      header: 'The fields of a table element'
                      header_layout: 3
                      table_class: striped
                      table_caption: 'What the table element reads, and what it does with it'
                      table_delimiter: 124
                      table_enclosure: 0
                      table_header_position: 1
                      bodytext: "Field|Holds|Read by\nbodytext|The rows, one per line|TableProcessor\ntable_delimiter|The character code of the column separator|TableProcessor\ntable_header_position|Header row, header column, or none|TableProcessor\ntable_class|The look of the table|Table.html\n"
                  -
                    self:
                      id: 6609
                      CType: html
                      header: 'The TypoScript of the bullet list (name only, not rendered)'
                      sectionIndex: 0
                      bodytext: "<figure class=\"theme-code\">\n    <figcaption class=\"theme-code__caption\">\n        <span class=\"theme-code__filename\">Configuration/TypoScript/ContentElements.typoscript</span>\n        <span class=\"theme-code__language\">TypoScript</span>\n    </figcaption>\n    <pre class=\"theme-code__block\" role=\"region\" tabindex=\"0\" aria-label=\"Configuration/TypoScript/ContentElements.typoscript\"><code>tt_content.bullets =&lt; lib.contentElement\ntt_content.bullets {\n    templateName = ContentElements/Bullets\n}</code></pre>\n</figure>"
                  -
                    self:
                      id: 6610
                      CType: text
                      header: 'What is left to the editor'
                      header_layout: 2
                      bodytext: "<p>The editor chooses the type, fills in the fields and picks from\nthe values the form offers. The theme offers only values it\nrenders: a frame it does not draw is not in the list, and a field\nit does not read is not in the form.</p>\n<p>Everything else - the markup, the spacing, the colours in both\nappearances - follows from the theme, which is what lets a page of\nmany elements read as one page.</p>\n"
                  -
                    self:
                      id: 6611
                      CType: html
                      header: 'Footnotes (not visible in the frontend)'
                      sectionIndex: 0
                      linkToTop: 1
                      bodytext: "<aside class=\"theme-footnotes\" aria-labelledby=\"article-footnotes-heading\">\n    <h2 class=\"theme-footnotes__heading\" id=\"article-footnotes-heading\">Notes</h2>\n    <ol class=\"theme-footnotes__list\">\n        <li class=\"theme-footnotes__item\" id=\"fn1\">\n            1. The column is the <code>colPos</code> of the element, and the backend\n            layout of the page decides which columns exist at all.\n            <a class=\"theme-footnotes__backlink\" href=\"#fnref1\" aria-label=\"Back to reference 1\"></a>\n        </li>\n        <li class=\"theme-footnotes__item\" id=\"fn2\">\n            2. Which is also why an element moved into a column the layout of its\n            page does not have disappears from the page without being deleted.\n            <a class=\"theme-footnotes__backlink\" href=\"#fnref2\" aria-label=\"Back to reference 2\"></a>\n        </li>\n    </ol>\n</aside>\n"
            -
              self:
                id: 1152
                title: 'Right to left'
                slug: /typography/right-to-left
                backend_layout: content
              entities:
                content:
                  -
                    self:
                      id: 16201
                      CType: header
                      header: 'Right to left'
                      header_layout: 1
                      sectionIndex: 0
                  -
                    self:
                      id: 16202
                      CType: text
                      bodytext: "<p class=\"theme-lead\">Every spacing, border and float of the theme is\nwritten as a logical property, and every glyph that points somewhere is\nmirrored by a rule of its own. This page is where that is looked at: the\nsame components as everywhere else, in a right-to-left context.</p>\n<p>The Arabic below is a specimen rather than a translation, and each\nblock is glossed in English underneath, so a reader who does not read\nArabic can still see which edge a line starts at. What is demonstrated is\nthe direction, not the copy.</p>"
                  -
                    self:
                      id: 16203
                      CType: html
                      header: 'Running text, a list and a quotation (not visible in the frontend)'
                      bodytext: "<h2>Running text, a list and a quotation</h2>\n<div dir=\"rtl\" lang=\"ar\">\n    <p>النص العربي يبدأ من اليمين.</p>\n    <p>هذه قائمة قصيرة:</p>\n    <ul>\n        <li>العنصر الأول</li>\n        <li>العنصر الثاني</li>\n        <li>العنصر الثالث</li>\n    </ul>\n    <blockquote><p>اقتباس قصير.</p></blockquote>\n</div>\n<p><small>\"Arabic text starts from the right.\", \"This is a short list:\",\nthe first, second and third item, and \"A short quotation.\" Nothing here\ncarries a class: the list marker, the indent of the quotation and the edge\nevery line starts at come from the element baseline.</small></p>"
                  -
                    self:
                      id: 16204
                      CType: html
                      header: 'Components (not visible in the frontend)'
                      bodytext: "<h2>Components</h2>\n<div dir=\"rtl\" lang=\"ar\">\n    <p>العنصر الأول<sup class=\"theme-footnote-ref\" id=\"rtl-fnref1\"><a href=\"#rtl-fn1\">1</a></sup></p>\n    <ul class=\"theme-list theme-list--check\">\n        <li>العنصر الأول</li>\n        <li>العنصر الثاني</li>\n    </ul>\n    <p class=\"theme-byline\">\n        <span class=\"theme-byline__item\">العنصر الأول</span>\n        <span class=\"theme-byline__item\">العنصر الثاني</span>\n    </p>\n    <div class=\"theme-table-wrapper\" tabindex=\"0\" role=\"region\" aria-label=\"A table in a right-to-left context\">\n        <table class=\"theme-table theme-table--striped\">\n            <caption class=\"theme-table__caption\">العنصر الأول</caption>\n            <thead>\n                <tr><th scope=\"col\">العنصر الأول</th><th scope=\"col\">العنصر الثاني</th></tr>\n            </thead>\n            <tbody>\n                <tr><td>العنصر الأول</td><td>العنصر الثاني</td></tr>\n                <tr><td>العنصر الأول</td><td>العنصر الثاني</td></tr>\n            </tbody>\n        </table>\n    </div>\n    <div class=\"theme-footnotes\">\n        <ol class=\"theme-footnotes__list\">\n            <li class=\"theme-footnotes__item\" id=\"rtl-fn1\">\n                1. العنصر الأول\n                <a class=\"theme-footnotes__backlink\" href=\"#rtl-fnref1\" aria-label=\"Back to reference 1\"></a>\n            </li>\n        </ol>\n    </div>\n</div>\n<p><small>The superscript reference, the check mark of the list, the rule\nbetween two byline items, the caption and the cells of the table and the\nhanging indent of the note all sit at the right edge, and none of them has\na rule for it: they are placed with <code>inset-inline-start</code>,\n<code>border-inline-start</code>, <code>padding-inline-start</code> and\n<code>text-align: start</code>. The arrow back from the note is mirrored,\nbecause it points somewhere.</small></p>"
                  -
                    self:
                      id: 16205
                      CType: text
                      header: 'A link that leaves the site'
                      header_layout: 2
                      bodytext: "<p>The marker after a link to another site is built by the theme rather\nthan written into the text, which is why this block is rich text and not\nraw markup: the marker only exists once TYPO3 has built the link.</p>\n<div dir=\"rtl\" lang=\"ar\">\n    <p><a href=\"https://example.org/\">العنصر الأول</a></p>\n</div>\n<p><small>The arrow points up and to the left, because the text it\nbelongs to runs the other way. The same rule turns the arrow back from a\nfootnote and the two chevrons of a carousel around, and the\n<em>Reading direction</em> section of the styleguide shows all of them\nside by side.</small></p>\n"
                  -
                    self:
                      id: 16206
                      CType: html
                      header: 'Numbers and Latin in a right-to-left line (not visible in the frontend)'
                      bodytext: "<h2>Numbers and Latin in a right-to-left line</h2>\n<div dir=\"rtl\" lang=\"ar\">\n    <p>TYPO3 <bdi>العنصر الأول</bdi> 13.4</p>\n</div>\n<p><small>Direction is resolved per run of text, not per element, so the\nbrowser keeps the Latin word and the version number running the other way\nby itself. <code>bdi</code> is what says where a run of user data begins,\nso a name starting with a strong right-to-left character cannot reorder\nthe sentence around it.</small></p>"
                  -
                    self:
                      id: 16207
                      CType: text
                      header: 'What this page does not cover'
                      header_layout: 2
                      bodytext: "<p>The page chrome is not in the wrapper. The site header, the main\nnavigation, the breadcrumb and the footer are rendered once per page and\nstay left to right here, because the page itself is an English one. A site\nthat is Arabic sets the direction on the <code>html</code> element through\nits site language, and everything below it then follows the same rules\nthis page shows.</p>\n<p>Neither are the components a record builds rather than writes: a\nnotice, a carousel or an embed is markup a template produces, and no field\nof the element can wrap that in a <code>div</code>. The styleguide has\nthem, in a section of its own.</p>\n<p>An arrow an editor puts into a button label is content rather than\nfurniture of the theme, and the theme does not turn it around. Only the\nglyphs the theme draws itself are mirrored.</p>\n"
