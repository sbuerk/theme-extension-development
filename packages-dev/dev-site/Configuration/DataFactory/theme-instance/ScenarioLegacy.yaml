                          imagecols: 1
                          bodytext: "<p>The position of the image is the value of\n<em>imageorient</em> in the heading. The core's\n<strong>GalleryProcessor</strong> turns it into a vertical and a\nhorizontal position, and the gallery partial turns those into\nmodifier classes. This paragraph is long enough to run past an\nimage placed in the text, which is what tells the variants that\nlet the text flow back under the image from the ones that keep it\nbeside the image.</p>"
