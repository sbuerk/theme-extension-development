                          header: 'An icon at the end, plain'
                          header_layout: 2
                          bodytext: "<p>At the end of the line the icon moves to the other side of the text,\nin a right-to-left page as well. It stays first in the markup.</p>\n"
                          tx_theme_icon: shield-halved
                          tx_theme_icon_position: end
                          tx_theme_icon_shape: plain
                          tx_theme_icon_size: md
