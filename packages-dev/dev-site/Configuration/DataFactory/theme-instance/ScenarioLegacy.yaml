              children:
                -
                  self:
                    id: 1117
                    title: 'Composing a page'
                    slug: /examples/journal/composing-a-page
                    backend_layout: article
                    abstract: 'A long read on the article layout: running text held to the reading measure, a pull quote, a byline, and editorial notes in the aside.'
                  entities:
                    content:
                      -
                        self:
                          id: 12701
                          CType: header
                          colPos: 2
                          header: 'Composing a page from elements that already exist'
                          header_layout: 1
                      -
                        self:
                          id: 12702
                          CType: text
                          bodytext: "<p class=\"theme-lead\">Every element of this theme was built to be\nlooked at on its own, and every one of them is wrong on its own.\nA page is the unit that has to work.</p>\n<p>The showcase pages below <a href=\"t3://page?uid=1005\">Elements</a>\ndo what a showcase has to do first: one element at a time, every\nvalue of every field that changes how it looks, nothing else on\nthe page to argue with. That is how a defect in a single element\nis found. It is not how an editor works, and it is not how a\nreader meets the result.</p>\n<h3>What changes when there are six of them</h3>\n<p>Put a hero, a teaser list, a card group and a call to action on\none page and three things go wrong that none of them shows alone:\ntwo headings claim the same level, two elements set the same\nspacing twice, and the eye has no idea which of the four is the\none to act on. None of that is a bug in an element. All of it is\na decision somebody has to make once per page.</p>"
                      -
                        self:
                          id: 12703
                          CType: textpic
                          header: 'The order is the argument'
                          header_layout: 3
                          imageorient: 17
                          imagecols: 1
                          bodytext: "<p>A page is read from the top, so the order of the elements is\nthe order of the claims. The hero says what this is, the text\nsays why it is worth the next minute, the collection shows that\nit exists, and the call to action is the only thing left to do.\nReversed, the same four elements are a page nobody finishes.</p>\n<p>The picture beside this paragraph is the core\n<em>Text &amp; Images</em> element with the image in the text at\nthe end of the line - the same element and the same field the\nmedia pages demonstrate one value at a time.</p>"
                      -
                        self:
                          id: 12704
                          CType: theme_testimonial
                          tx_theme_quote_style: pull
                          header: 'An editor, in a workshop'
                          subheader: 'On being given twenty content elements'
                          bodytext: 'I do not need more elements. I need to know which three of these belong on the page I am writing.'
                      -
                        self:
                          id: 12705
                          CType: text
                          header: 'What the theme can decide, and what it cannot'
                          header_layout: 3
                          bodytext: "<p>The theme can make sure that two elements next to each other\nnever collide: one spacing scale, one heading rhythm, one\nmeasure for running text whatever column it lands in. It does\nthat, and the pages of this section are where it is checked.</p>\n<p>What it cannot decide is which elements a page needs. That is\neditorial, it changes per page, and a theme that decided it\nwould be a template - which is the thing this theme exists not\nto be.</p>"
                      -
                        self:
                          id: 12706
                          CType: theme_author
                          header: 'The theme maintainers'
                          subheader: 'Who writes this journal'
                          bodytext: 'The people who build sites against this theme and write down what went wrong while they did.'
                          tx_theme_list_items: '1650,1651'
                      -
                        self:
                          id: 12707
                          CType: theme_notice
                          tx_theme_notice_kind: note
                          header: 'What this page is made of'
                          bodytext: '<p>A header in the stage, a text with a lead, a <em>Text &amp; Images</em> element with the image in the text, a testimonial in the pull quote style, a second text and an author element - with a notice and a link list in the aside. The backend layout is <em>Article</em>.</p>'
                      -
                        self:
                          id: 12708
                          CType: theme_notice
                          colPos: 1
                          tx_theme_notice_kind: info
                          header: 'About this entry'
                          bodytext: '<p>Written after a workshop in which four editors were given every element of this theme and an empty page.</p>'
                      -
