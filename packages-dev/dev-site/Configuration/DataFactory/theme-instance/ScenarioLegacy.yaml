                          header: 'Templates that stay readable'
                          header_layout: 2
                          bodytext: "<p>Every element is one Fluid template on the contract of a component.\nA site package overrides the one file it wants to change and keeps the\nrest.</p>\n"
                          tx_theme_icon: code
                          tx_theme_icon_position: end
                          tx_theme_icon_shape: circle
                          tx_theme_icon_size: lg
                          tx_theme_link: 't3://page?uid=1006'
                          tx_theme_link_label: 'See the core elements'
                          tx_theme_link_variant: secondary
                          tx_theme_link_icon: arrow-right
                      -
