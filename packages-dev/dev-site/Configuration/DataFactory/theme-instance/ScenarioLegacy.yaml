                          id: 8006
                          CType: theme_text_icon
                          header: 'From a checkout to a running site'
                          header_layout: 2
                          bodytext: "<p>Both development instances start with one command and seed this very\npage tree, so a change is looked at in the backend and the frontend of\nTYPO3 v13 and v14 alike.</p>\n"
                          tx_theme_icon: rocket
                          tx_theme_icon_position: top
