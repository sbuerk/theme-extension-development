                      CType: text
                      header: 'What this page is'
                      header_layout: 2
                      bodytext: "<p>Every classic content type this theme renders is on this\npage exactly once, so a single URL answers what each one\nlooks like and which of its fields the theme actually reads.\nThe copy of each element describes that element.</p>\n<p>The rendering is defined in\n<em>Configuration/TypoScript/ContentElements.typoscript</em>.\nThis theme does not depend on <em>fluid_styled_content</em>,\nso a content type without a branch in that file would render\nthe core's <strong>\"no rendering definition\"</strong> notice\ninstead of anything at all.</p>\n"
                  -
                    self:
                      id: 1603
                      CType: bullets
                      header: 'Bullet list'
                      header_layout: 2
                      bullets_type: 0
                      bodytext: "One item per line, with no markup and no delimiter\nEach line is escaped on output, so a typed tag stays text\nbullets_type 1 renders the same lines as an ordered list\nbullets_type 2 renders them as a definition list of terms\n"
                  -
                    self:
                      id: 1604
                      CType: table
                      header: Table
                      header_layout: 2
                      table_caption: 'The five table_* fields, and what this element sets them to'
                      table_delimiter: 124
                      table_enclosure: 0
                      table_header_position: 1
                      table_tfoot: 1
                      bodytext: "Field|What it stores|Value on this element\ntable_delimiter|The character CODE of the column separator|124, a vertical bar\ntable_enclosure|The character CODE of the quoting character, 0 for none|0\ntable_header_position|0 none, 1 first row, 2 first column|1\ntable_tfoot|Whether the last row becomes a table footer|1\nDecoded by|Classes/DataProcessing/TableProcessor.php|not by Table.html\n"
                  -
                    self:
                      id: 1605
                      CType: textpic
                      header: 'Text & Images'
                      header_layout: 2
                      imageorient: 17
                      imagecols: 1
                      bodytext: "<p>Reads the <em>image</em> field, which the core TCA\nrestricts to images. The gallery is placed by\n<em>imageorient</em> - 17 here, \"in text, right\" - and split\ninto <em>imagecols</em> columns, both of them computed by\nthe core's <strong>GalleryProcessor</strong> rather than by\nthe template.</p>\n"
                  -
                    self:
                      id: 1606
                      CType: textmedia
                      header: 'Text & Media'
                      header_layout: 2
                      imageorient: 8
                      imagecols: 2
                      bodytext: "<p>Reads the <em>assets</em> field instead of\n<em>image</em>, so a video or an audio file is allowed here\nwhere \"Text &amp; Images\" above would refuse it. With\n<em>imageorient</em> 8 the media sits below the text and\ncentered, and <em>imagecols</em> 2 puts the two files side\nby side.</p>\n"
                  -
                    self:
                      id: 1607
                      CType: image
                      header: Images
                      header_layout: 2
                  -
                    self:
                      id: 1608
                      CType: uploads
                      header: 'File links'
                      header_layout: 2
                      uploads_type: 2
                      filelink_size: 1
                      uploads_description: 1
                      filelink_sorting: name
                      filelink_sorting_direction: asc
                  -
                    self:
                      id: 1609
                      CType: html
                      header: 'Plain HTML (name only, not rendered)'
                      bodytext: "<h2 class=\"theme-content-element__heading\">Plain HTML</h2>\n<p>This paragraph, its heading and the class on that heading\nwere written as raw markup in <code>bodytext</code> and\nreached the page untouched. Nothing was escaped and no rich\ntext parsing ran, which is what separates this element from\n\"Text\" further up - the <code>code</code> tags in this\nsentence survive here in every installation. That\nelement's field is declared <em>enableRichtext</em>, so a\nsave keeps only what the processing of the rich text preset\nallows: <code>code</code> with the theme's preset, nothing\nof the kind without the rich text editor installed. Access to raw HTML is not restricted by\nanything in the frontend: the <code>CType</code> field\ncarries <code>authMode = explicitAllow</code>, so a\nnon-admin editor can only pick it if a backend group grants\nit explicitly.</p>\n<p>Two elements follow that have no visible header either.\nThe horizontal rule below is the <strong>Divider</strong>\nelement, which renders nothing but that rule. After it,\n<strong>Insert Records</strong> renders the page's own\n\"Core elements\" heading a second time - it is a reference to\nthe first element on this page, not a copy of it.</p>\n"
                  -
