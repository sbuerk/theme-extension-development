              bodytext: "<p>This page tree is seeded from a definition in the repository, so a\ndevelopment instance can be rebuilt from nothing without clicking a\npage tree together by hand.</p>\n<p>Two of its pages are not in the navigation: the\n<a href=\"t3://page?uid=1009\">styleguide</a>, which renders every\ncomponent of the library, and the\n<a href=\"t3://page?uid=1010\">form showcase</a>, a request form put\ntogether from the form components alone.</p>"
      children:
        -
