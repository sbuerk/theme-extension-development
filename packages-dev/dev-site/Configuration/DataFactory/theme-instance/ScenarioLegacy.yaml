                          CType: text
                          header: 'Four layouts, up to four columns'
                          header_layout: 2
                          bodytext: "<p>A group of features: an icon, a title, a sentence or two and a\nlink each. The layout sets the icon above the title, beside it on a\nframed tile, or frames the whole feature; the fourth sets the heading\nand the text of the element beside the grid. The grid takes two,\nthree or four columns at most, and fewer where a column would be too\nnarrow - one on a phone.</p>"
