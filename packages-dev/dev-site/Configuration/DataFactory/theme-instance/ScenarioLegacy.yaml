                      header: 'Frames, spacing and header looks'
                      header_layout: 2
                      space_before_class: extra-large
                  -
                    self:
                      id: 16364
                      CType: shortcut
                      header: 'Frames, spacing and header looks: the Appearance tab of every element'
                      records: 'tt_content_6103,tt_content_6104,tt_content_6105,tt_content_6106,tt_content_6107,tt_content_6108,tt_content_6109,tt_content_6110,tt_content_6111,tt_content_6112,tt_content_6113,tt_content_6114,tt_content_6115,tt_content_6116,tt_content_6117,tt_content_6118,tt_content_6119,tt_content_6120,tt_content_6121,tt_content_6122'
                  -
                    self:
                      id: 16365
                      CType: text
                      header: 'What is not on this page'
                      header_layout: 2
                      space_before_class: extra-large
                      linkToTop: 1
                      bodytext: "<p><em>Insert records</em> itself. This page is built out of that element,\nand a shortcut reached through a shortcut renders nothing on purpose - it\nis how the theme makes a reference cycle impossible on both core\nversions. Its own page, <a href=\"t3://page?uid=1050\">Insert records</a>,\nshows what it does.</p>\n<p>The backend layouts. A layout is a property of a page, so one page can\nonly ever show one of them; the pages of the showcase carry them between\nthem instead.</p>\n<p>The component library and the form showcase. Both are rendered from\nFluid rather than from records - see\n<a href=\"t3://page?uid=1009\">Styleguide</a> and\n<a href=\"t3://page?uid=1010\">Forms</a> - so there is nothing here to\nreference.</p>\n"
        -
          self:
            id: 1171
            title: Layouts
            slug: /layouts
            backend_layout: content
          entities:
            content:
              -
                self:
                  id: 18101
                  CType: header
                  header: 'Page layouts'
                  header_layout: 1
              -
                self:
                  id: 18102
                  CType: text
                  header: 'What a backend layout decides'
                  header_layout: 2
                  bodytext: "<p>A page's backend layout decides two separate things: which\ncolumns the page module offers an editor, and which template the\nfrontend renders. The first is page TSconfig, the second is the\nfile named after the layout in\n<code>Resources/Private/Templates/Page/</code>, and the colPos\nnumbers are the only thing that connects them.</p>\n<p>Each page below shows one layout, with a labelled box in every\ncolumn it declares. The boxes are ordinary content elements: the\ndashed outline and the type chip around them are the theme's own\ndevelopment affordance, which the display settings in the header\nswitch off.</p>"
              -
                self:
                  id: 18103
                  CType: menu_subpages
                  header: 'One page per layout'
                  header_layout: 2
                  pages: '1171'
          children:
            -
              self:
                id: 1172
                title: 'Two columns'
                slug: /layouts/two-columns
                backend_layout: two_columns
                abstract: 'Two content columns of equal width, below a full width stage.'
              entities:
                content:
                  -
                    self:
                      id: 18201
                      CType: text
                      colPos: 2
                      frame_class: accent
                      header: 'Stage - colPos 2'
                      header_layout: 1
                      bodytext: "<p>The full width row above the columns. It is the same slot\nthe content page and the start page use, so a hero placed\nhere renders the same way on all three.</p>"
                  -
                    self:
                      id: 18202
                      CType: text
                      colPos: 0
                      frame_class: surface
                      header: 'Main content - colPos 0'
                      header_layout: 2
                      bodytext: "<p>The first column, and the column every other layout has as\nwell. Content moved here from a content page keeps its colPos\nand stays where it was.</p>"
                  -
                    self:
                      id: 18203
                      CType: text
                      colPos: 0
                      frame_class: surface
                      header: 'A second element in the same column'
                      header_layout: 3
                      bodytext: "<p>Elements of one column stack; they do not become columns of\ntheir own. The column is a wrapper in the markup for exactly\nthis reason.</p>"
                  -
                    self:
                      id: 18204
                      CType: text
                      colPos: 3
                      frame_class: raised
                      header: 'Second column - colPos 3'
                      header_layout: 2
                      bodytext: "<p>The second column of this layout and of the two below it.\nBoth columns are half the content width from 768 pixels up and\nstacked below that.</p>\n"
            -
              self:
                id: 1173
                title: 'Two columns, wide first'
                slug: /layouts/two-columns-wide
                backend_layout: two_columns_wide
                abstract: 'The same two columns, the first one twice as wide as the second.'
              entities:
                content:
                  -
                    self:
                      id: 18301
                      CType: text
                      colPos: 2
                      frame_class: accent
                      header: 'Stage - colPos 2'
                      header_layout: 1
                      bodytext: "<p>The same stage slot as on every other layout that has\none.</p>"
                  -
                    self:
                      id: 18302
                      CType: text
                      colPos: 0
                      frame_class: surface
                      header: 'Main content - colPos 0'
                      header_layout: 2
                      bodytext: "<p>Two thirds of the content width. The ratio is stated twice -\nas a three column page module grid this column spans two of,\nand as a grid fraction in the template - because the page\nmodule has whole columns to work with and the frontend has\nfractions.</p>"
                  -
                    self:
                      id: 18303
                      CType: text
                      colPos: 3
                      frame_class: raised
                      header: 'Second column - colPos 3'
                      header_layout: 2
                      bodytext: "<p>One third. Switching this page to the equal column layout\nmoves nothing: both layouts read colPos 0 and colPos 3.</p>\n"
            -
              self:
                id: 1174
                title: 'Three columns'
                slug: /layouts/three-columns
                backend_layout: three_columns
                abstract: 'Three content columns of equal width, below a full width stage.'
              entities:
                content:
                  -
                    self:
                      id: 18401
                      CType: text
                      colPos: 2
                      frame_class: accent
                      header: 'Stage - colPos 2'
                      header_layout: 1
                      bodytext: '<p>The stage spans all three columns.</p>'
                  -
                    self:
                      id: 18402
                      CType: text
                      colPos: 0
                      frame_class: surface
                      header: 'Main content - colPos 0'
                      header_layout: 2
                      bodytext: '<p>The first of three equal columns.</p>'
                  -
                    self:
                      id: 18403
                      CType: text
                      colPos: 3
                      frame_class: raised
                      header: 'Second column - colPos 3'
                      header_layout: 2
                      bodytext: "<p>The second. A page switched from here to one of the two\ncolumn layouts keeps this column where it is and leaves the\nthird unrendered, rather than reshuffling the first two.</p>"
                  -
                    self:
                      id: 18404
                      CType: text
                      colPos: 4
                      frame_class: default
                      header: 'Third column - colPos 4'
                      header_layout: 2
                      bodytext: "<p>The third, and the only column of the theme that no other\nlayout declares. Left with the default appearance, so the\ndashed outline is all that draws this box.</p>\n"
            -
              self:
                id: 1175
                title: Article
                slug: /layouts/article
                backend_layout: article
                abstract: 'A long read at the reading measure, with an aside of notes beside it.'
              entities:
                content:
                  -
                    self:
                      id: 18501
                      CType: text
                      colPos: 2
                      frame_class: accent
                      header: 'Stage - colPos 2'
                      header_layout: 1
                      bodytext: '<p>The stage spans the article and its aside.</p>'
                  -
                    self:
                      id: 18502
                      CType: text
                      colPos: 0
                      frame_class: surface
                      header: 'The article - colPos 0'
                      header_layout: 2
                      bodytext: "<p>Held to the reading measure, the same 68 characters the\nlead of a hero and the running text of a quotation are held\nto. The column may be wider than that; the text is not.</p>\n<p>The measure is a property of the text rather than of the\nlayout, which is why it is a cap on this column and not a\ngrid track: a column holding something that is not prose - a\ntable, a gallery - still has the whole track to use.</p>"
                  -
                    self:
                      id: 18503
                      CType: text
                      colPos: 1
                      frame_class: raised
                      header: 'The aside - colPos 1'
                      header_layout: 2
                      bodytext: "<p>The same column number as the sidebar of the sidebar\nlayout, so material moved between the two layouts stays where\nit was. What differs is the rendering: there the slot goes\ninto the navigation column of the page shell, which also\ncarries the sub navigation and the table of contents; here it\nis a column of the article grid that follows the article in\nreading order and carries nothing but what an editor puts in\nit.</p>\n"
            -
              self:
                id: 1176
                title: Cover
                slug: /layouts/cover
                backend_layout: cover
                abstract: 'A landing page of one column, centred in the viewport.'
              entities:
                content:
                  -
                    self:
                      id: 18601
                      CType: text
                      colPos: 0
                      frame_class: accent
                      header: 'Cover - colPos 0'
                      header_layout: 1
                      bodytext: "<p>The only column of this layout, centred between the header\nand the footer. The page is as tall as the viewport whatever\nis placed here, so a short cover sits in the middle of the\nscreen rather than under the header.</p>"
                  -
                    self:
                      id: 18602
                      CType: text
                      colPos: 0
                      header: 'No stage, and no breadcrumb'
                      header_layout: 2
                      bodytext: "<p>A cover page is the top of whatever it announces: a trail\nabove it would lead nowhere worth going, and a stage would be\na second place to put the banner that this page already is.</p>\n"
            -
              self:
                id: 1177
                title: 'Full-width bands'
                slug: /layouts/bands
                backend_layout: bands
                abstract: 'Three bands, stacked, each spanning the full width of the viewport.'
              entities:
                content:
                  -
                    self:
                      id: 18701
                      CType: text
                      colPos: 0
                      frame_class: surface
                      header: 'First band - colPos 0'
                      header_layout: 1
                      bodytext: "<p>The page gives up its content container while it holds a\nband stack, so a band reaches both edges of the viewport. The\nheader and the footer keep theirs.</p>"
                  -
                    self:
                      id: 18702
                      CType: text
                      colPos: 3
                      frame_class: accent
                      header: 'Second band - colPos 3'
                      header_layout: 2
                      bodytext: "<p>The same column numbers as the three column layout, laid\nout one below the other instead of side by side - so a page\nmoved between the two changes how it reads and not where its\ncontent sits.</p>"
                  -
                    self:
                      id: 18703
                      CType: text
                      colPos: 4
                      frame_class: inverse
                      header: 'Third band - colPos 4'
                      header_layout: 2
                      bodytext: "<p>An inverted band, which is the appearance that makes the\nwidth obvious at a glance. Bands are flush against each\nother; the space between two of them is the space after the\nlast element of the one above.</p>\n"
        -
          self:
            id: 1113
            title: Examples
            slug: /examples
            backend_layout: content
            abstract: 'Whole pages composed from the elements the theme already ships - an album, a pricing page, a weblog, a product page and three landing pages.'
            keywords: 'examples, composition'
          entities:
            content:
              -
                self:
                  id: 12301
                  CType: header
                  header: Examples
                  header_layout: 1
              -
                self:
                  id: 12302
                  CType: text
                  header: 'Pages, not specimens'
                  header_layout: 2
                  bodytext: "<p>The rest of this tree takes the theme apart: one page per content\nelement, one per backend layout, one per value of a field. These\npages put it back together. Each of them is a page somebody might\nactually publish, and each is made of nothing but the elements,\nlayouts, frames and appearance values that are demonstrated one at a\ntime elsewhere.</p>\n<p>That is the point of the section. An element looks finished on a\npage that holds nothing else; what it is worth is decided next to\nfive other elements, under a heading, in a column of a real width.\nThe last element of every page below names what that page is made\nof.</p>\n"
              -
                self:
                  id: 12303
                  CType: menu_abstract
                  header: 'The pages of this section'
                  header_layout: 2
                  pages: '1113'
          children:
            -
              self:
                id: 1114
                title: Album
                slug: /examples/album
                backend_layout: content
                abstract: 'A photo collection: a centred reduced hero in the stage, a gallery in three columns, a row of cards and a closing call to action.'
              entities:
                content:
                  -
                    self:
                      id: 12401
                      CType: theme_hero_small
                      colPos: 2
                      tx_theme_hero_layout: centred
                      tx_theme_eyebrow: Album
                      header: 'Field notes from a relaunch'
                      header_layout: 1
                      bodytext: 'Nine months of a site being rebuilt, photographed on the way. The pictures are placeholders; the page around them is not.'
                      tx_theme_link: 't3://page?uid=1113'
                      tx_theme_link_label: 'Back to the examples'
                      tx_theme_link_variant: ghost
                      tx_theme_link_icon: arrow-left
                  -
                    self:
