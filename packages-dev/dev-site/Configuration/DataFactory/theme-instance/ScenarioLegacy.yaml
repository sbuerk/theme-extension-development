                          id: 8005
                          CType: theme_text_icon
                          header: 'Readable for everybody'
                          header_layout: 2
                          bodytext: "<p>Every colour of the theme is checked against the surfaces it sits\non, in both appearances and all five palettes. The icon beside this\ntext is decoration: the heading says the same.</p>\n"
                          tx_theme_icon: universal-access
                          tx_theme_icon_position: top
                          tx_theme_icon_shape: plain
                          tx_theme_icon_size: xl
                      -
                        self:
                          id: 8006
