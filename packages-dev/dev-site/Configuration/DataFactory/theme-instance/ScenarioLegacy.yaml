                          header_layout: 2
                          imageorient: 0
                          imagecols: 1
                          bodytext: '<p>A video file in the <em>assets</em> field renders as a native player with its controls, and the WebVTT file of the same name becomes its caption track. The file itself is a placeholder that carries no picture, so the player shows its controls and nothing else.</p>'
                      -
