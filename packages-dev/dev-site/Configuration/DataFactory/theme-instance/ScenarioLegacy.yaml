              colPos: 13
              CType: text
              header: Reference
              header_layout: 2
              bodytext: "<p>The <a href=\"t3://page?uid=1009\">styleguide</a> renders every\ncomponent straight from Fluid, the\n<a href=\"t3://page?uid=1010\">form showcase</a> puts a request form\ntogether from the form components alone, and the\n<a href=\"t3://page?uid=1153\">cheatsheet</a> gathers every element\non one page.</p>"
          -
            self:
              id: 1106
              colPos: 14
              CType: theme_sociallinks
              header: Elsewhere
              header_layout: 2
              tx_theme_list_items: '1700,1701,1702'
          -
            self:
              id: 1107
              colPos: 10
              CType: text
              header: 'Footer meta'
              header_layout: 100
              bodytext: "<p>Seeded from\n<code>Configuration/DataFactory/theme-demo/</code>. This row and the\nfour columns above it are edited once, on the\n<a href=\"t3://page?uid=1001\">site root</a>, and every page below it\nrenders them: the five footer slots are the only content objects of\nthe theme that slide down the rootline.</p>\n"
        listItem:
          -
