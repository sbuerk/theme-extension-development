                          header: 'From a checkout to a running site'
                          header_layout: 2
                          bodytext: "<p>Both development instances start with one command and seed this very\npage tree, so a change is looked at in the backend and the frontend of\nTYPO3 v12 and v13 alike.</p>\n"
                          tx_theme_icon: rocket
                          tx_theme_icon_position: top
