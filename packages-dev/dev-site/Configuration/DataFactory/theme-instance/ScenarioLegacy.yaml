                          CType: header
                          header: Header
                          header_layout: 1
                      -
                        self:
                          id: 4002
                          CType: text
                          header: 'Levels and positions'
                          header_layout: 2
                          bodytext: "<p>The element is a heading and nothing else. Its level is the\nvalue of \"Layout\" in the header palette, heading 1 to heading 5;\n\"Default\" is a heading 2, and \"Hidden\" keeps the record and\nrenders nothing. The alignment moves the heading to the start,\nthe centre or the end of the line - the logical edges, so it\nfollows a right-to-left language.</p>"
