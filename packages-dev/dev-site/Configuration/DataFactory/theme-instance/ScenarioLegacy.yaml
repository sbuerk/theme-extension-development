                          header: 'Configure once, in the site'
                          header_layout: 2
                          bodytext: "<p>A site depends on the site set of the theme, and constants, page\nTSconfig and setup arrive together. Nothing is copied into the site\npackage.</p>\n"
                          tx_theme_icon: gear
                          tx_theme_icon_position: start
                          tx_theme_icon_shape: square
