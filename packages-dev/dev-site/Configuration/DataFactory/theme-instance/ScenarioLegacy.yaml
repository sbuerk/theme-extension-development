                          header: 'Running text'
                          header_layout: 2
                          bodytext: "<p>The text element renders its header and its rich text, and\nthe rich text goes through the parsing function of the frontend,\nso a <a href=\"t3://page?uid=1035\">link to another page</a> is\nresolved and <strong>strong</strong> and <em>emphasised</em>\nwords keep their meaning.</p>\n<p>A second paragraph, so the space between two of them is on\nthe page as well.</p>"
                      -
                        self:
                          id: 4103
                          CType: text
                          header: 'A list and a quotation inside the text'
                          header_layout: 2
                          bodytext: "<p>Rich text holds lists and quotations of its own:</p>\n<ul><li>an unordered list,</li><li>with a second item,</li></ul>\n<ol><li>an ordered one,</li><li>numbered by the browser.</li></ol>\n<blockquote><p>A quotation set apart from the text around it.</p></blockquote>"
