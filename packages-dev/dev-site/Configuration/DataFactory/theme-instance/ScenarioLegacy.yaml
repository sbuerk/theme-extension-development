              CType: text
              header: 'What this is'
              header_layout: 2
              bodytext: "<p>This page tree is seeded from a definition in the repository, so a\ndevelopment instance can be rebuilt from nothing without clicking a\npage tree together by hand.</p>\n<p>The navigation holds the sections of the showcase: the\n<a href=\"t3://page?uid=1005\">content elements</a>, one page per\nelement with its variants; the\n<a href=\"t3://page?uid=1002\">typography</a>, from rich text and\nelements; the <a href=\"t3://page?uid=1171\">page layouts</a>, one\nwireframe page per backend layout; the\n<a href=\"t3://page?uid=1113\">examples</a>, whole pages composed\nfrom the elements above; and the\n<a href=\"t3://page?uid=1009\">styleguide</a>, which renders every\ncomponent of the library, with the\n<a href=\"t3://page?uid=1010\">form showcase</a>, a request form put\ntogether from the form components alone.</p>\n"
          -
            self:
              id: 1103
              colPos: 11
              CType: text
              header: About
              header_layout: 2
              bodytext: "<p>A theme built to be read, in a repository built to be reviewed.\nEvery decision it makes is written down next to the code that makes\nit.</p>"
          -
            self:
              id: 1104
              colPos: 12
              CType: menu_pages
