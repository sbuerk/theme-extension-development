                          header_layout: 1
                      -
                        self:
                          id: 8002
                          CType: text
                          header: 'Where the icon goes'
                          header_layout: 2
                          bodytext: "<p>The heading, the text and the link of the element sit beside one\nicon of the set. The icon goes at the start of the line, at its end or\nabove the text; it is drawn plain in the accent, or on a square or a\nround tile of the accent; and it comes in three sizes. The elements\nbelow show every one of those values.</p>"
