                -
                  self:
                    id: 1031
                    title: Text
                    slug: /elements/core/text
                    backend_layout: content_sidebar
                  entities:
                    content:
                      -
                        self:
                          id: 4101
                          CType: header
                          header: Text
                          header_layout: 1
                      -
                        self:
                          id: 4102
                          CType: text
                          header: 'Running text'
                          header_layout: 2
                          bodytext: "<p>The text element renders its header and its rich text, and\nthe rich text goes through the parsing function of the frontend,\nso a <a href=\"t3://page?uid=1035\">link to another page</a> is\nresolved and <strong>strong</strong> and <em>emphasised</em>\nwords keep their meaning.</p>\n<p>A second paragraph, so the space between two of them is on\nthe page as well.</p>"
                      -
                        self:
                          id: 4103
                          CType: text
                          header: 'A list and a quotation inside the text'
                          header_layout: 2
                          bodytext: "<p>Rich text holds lists and quotations of its own:</p>\n<ul><li>an unordered list,</li><li>with a second item,</li></ul>\n<ol><li>an ordered one,</li><li>numbered by the browser.</li></ol>\n<blockquote><p>A quotation set apart from the text around it.</p></blockquote>"
                      -
                        self:
                          id: 4104
                          CType: text
                          bodytext: "<p>This element has no header, so it starts with its text.</p>\n"
                      -
                        self:
                          id: 4105
                          CType: text
                          header: 'Text in columns'
                          header_layout: 2
                          layout: 1
                          bodytext: "<p>The layout Columns sets the rich text of the element in\ntwo columns wherever each of them can be at least thirty\ncharacters wide, and in one column where it cannot - on a\nphone, or in a narrow sidebar. The text itself is the same\nmarkup as in running text; only the block around it\nchanges.</p>\n<p>A hairline separates the columns. A paragraph keeps at\nleast two of its lines on either side of a break, so a\ncolumn never starts or ends with a single stranded\nline.</p>\n<h3>What stays in one piece</h3>\n<p>A heading moves with the paragraph it opens, and the\nblocks below are never cut in half by a column\nbreak:</p>\n<ul><li>a quotation,</li><li>a table or a code block,</li><li>every item of a list.</li></ul>\n<blockquote><p>Columns suit short, self-contained text: a\nnotice, a set of facts, an imprint. A long article reads\nbetter in one column at the measure.</p></blockquote>\n<p>The first element of the text starts at the top of the\nfirst column, level with the second.</p>\n"
                -
                  self:
                    id: 1032
                    title: 'Text & Images'
                    slug: /elements/core/textpic
                    backend_layout: content_sidebar
                  entities:
                    content:
                      -
                        self:
                          id: 4201
                          CType: header
                          header: 'Text & Images'
                          header_layout: 1
                      -
                        self:
                          id: 4202
                          CType: textpic
                          header: 'Above, centred (0)'
                          header_layout: 2
                          imageorient: 0
                          imagecols: 1
                          bodytext: "<p>The position of the image is the value of\n<em>imageorient</em> in the heading. The core's\n<strong>GalleryProcessor</strong> turns it into a vertical and a\nhorizontal position, and the gallery partial turns those into\nmodifier classes. This paragraph is long enough to run past an\nimage placed in the text, which is what tells the variants that\nlet the text flow back under the image from the ones that keep it\nbeside the image.</p>"
