                      header_layout: 1
                  -
                    self:
                      id: 16302
                      CType: text
                      bodytext: "<p class=\"theme-lead\">Every content element the theme renders, and every\nvariant of one, on a single page. The pages below\n<a href=\"t3://page?uid=1005\">Elements</a> show the same elements one family\nat a time, with the prose that explains them; this page is the one to\nscroll through, or to search in the browser.</p>\n<p>It holds no element of its own. Each family below is an\n<em>Insert records</em> element naming the elements of one page, so the\npage cannot drift from what it shows - and it demonstrates that element\nby being made of it.</p>"
