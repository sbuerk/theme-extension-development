# The seed set the development instances are built from.
#
#   vendor/bin/typo3 data-factory:import theme-instance
#
# It is the showcase of the extension, "theme-demo", plus what only a
# development instance needs. It does not repeat the showcase: "imports" pulls
# the descriptor of that set in, and the core's YamlFileLoader appends an
# imported list to the importing one - so the "scenarios" below and the
# "references" of the second import ADD to those of the showcase, in the
# order the imports are declared, and the scalar keys of this file win over
# the imported ones.
#
# What it adds:
#
#   ScenarioLegacy.yaml     a second tree below "/legacy/", the showcase
#   ReferencesLegacy.yaml   mirrored at uid + 1000 and delivered through a root
#                           "sys_template" record instead of the site set.
#                           Both GENERATED by
#                           "Build/Scripts/generateLegacyScenario.php".
#   Accounts.yaml           a backend editor with its group and file mount, two
#                           frontend users, and the login and members pages
#                           that use them.
#
# The showcase and this set are never imported into the same installation:
# this set contains the showcase, and importing it twice is a uid collision
# that data-factory refuses.
#
# No "sites". The site configurations of the instances are committed at
# "instance-core-*/config/sites/demo/" and ".../demo-legacy/": they carry a
# title per core version, and "data-factory:import" refuses a site identifier
# that already exists - a set writing them would fail the second time an
# instance is rebuilt.
identifier: theme-instance
title: 'Theme development instance'
description: >-
  The showcase of the theme delivered twice - through its site set below "/"
  and through a root sys_template record below "/legacy/" - as the development
  instances "instance-core-13" and "instance-core-14" are built from.

imports:
  - { resource: 'EXT:theme_extension_development/Configuration/DataFactory/theme-demo/config.yml' }
  - { resource: 'ReferencesLegacy.yaml' }

scenarios:
  - ScenarioLegacy.yaml
  - Accounts.yaml
